3" text-anchor="middle" font-weight="700">満足 → そのまま住む</text><rect x="48.0" y="362.0" width="640.0" height="246.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="76.0" y="398.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><rect x="89.7" y="411.7" width="30.6" height="30.6" rx="3" fill="#a97a24"/><rect x="134.0" y="398.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><rect x="147.7" y="411.7" width="30.6" height="30.6" rx="3" fill="#a97a24"/><rect x="192.0" y="398.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><circle cx="221.0" cy="427.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><rect x="192.0" y="456.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><rect x="192.0" y="514.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><rect x="205.7" y="527.7" width="30.6" height="30.6" rx="3" fill="#a97a24"/><rect x="134.0" y="514.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><circle cx="163.0" cy="543.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><rect x="76.0" y="514.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><rect x="89.7" y="527.7" width="30.6" height="30.6" rx="3" fill="#a97a24"/><rect x="76.0" y="456.0" width="58.0" height="58.0" rx="0" fill="#ffffff" stroke="#e2ded4" stroke-width="1"/><rect x="89.7" y="469.7" width="30.6" height="30.6" rx="3" fill="#a97a24"/><rect x="134.0" y="456.0" width="58.0" height="58.0" rx="0" fill="#fbeae6" stroke="#c4442b" stroke-width="3"/><circle cx="163.0" cy="485.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="163.0" y="596.0" font-size="14" fill="#3d434b" text-anchor="middle">真ん中の人（青）</text><text x="300.0" y="412.0" font-size="18" fill="#6b6f76" text-anchor="start" font-weight="700">例2</text><text x="300.0" y="450.0" font-size="18" fill="#14181d" text-anchor="start">同じ仲間 2人 ÷ まわりの住人 7人</text><text x="300.0" y="486.0" font-size="26" fill="#14181d" text-anchor="start" font-weight="700">＝ 29%</text><text x="420.0" y="486.0" font-size="20" fill="#3d434b" text-anchor="start" font-weight="700">＜ 満足ライン 35%</text><rect x="300.0" y="512.0" width="350.0" height="58.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.6"/><text x="475.0" y="548.0" font-size="20" fill="#c4442b" text-anchor="middle" font-weight="700">不満 → 空き地へ引っ越す</text><text x="712.0" y="128.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">引っ越しが連鎖するしくみ</text><rect x="712.0" y="150.0" width="440.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="742.0" cy="192.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="742.0" y="197.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="770.0" y="186.0" font-size="16.5" fill="#14181d" text-anchor="start">不満な人が、空き地のどこかへ</text><text x="770.0" y="210.8" font-size="16.5" fill="#14181d" text-anchor="start">引っ越す（行き先はランダム）</text><line x1="932.0" y1="236.0" x2="932.0" y2="258.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><rect x="712.0" y="262.0" width="440.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="742.0" cy="304.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="742.0" y="309.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="770.0" y="298.0" font-size="16.5" fill="#14181d" text-anchor="start">元の場所と引っ越し先のまわりで、</text><text x="770.0" y="322.8" font-size="16.5" fill="#14181d" text-anchor="start">近所の割合が変わる</text><line x1="932.0" y1="348.0" x2="932.0" y2="370.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><rect x="712.0" y="374.0" width="440.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="742.0" cy="416.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="742.0" y="421.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="770.0" y="410.0" font-size="16.5" fill="#14181d" text-anchor="start">そのせいで、別の人が</text><text x="770.0" y="434.8" font-size="16.5" fill="#14181d" text-anchor="start">新しく不満になる</text><line x1="932.0" y1="460.0" x2="932.0" y2="482.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><rect x="712.0" y="486.0" width="440.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="742.0" cy="528.0" r="13.6" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="742.0" y="533.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="770.0" y="522.0" font-size="16.5" fill="#14181d" text-anchor="start">くり返すうちに、同じ仲間</text><text x="770.0" y="546.8" font-size="16.5" fill="#14181d" text-anchor="start">どうしで固まって落ち着く</text><circle cx="724.0" cy="611.0" r="8.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="740.0" y="617.0" font-size="15" fill="#3d434b" text-anchor="start">青</text><rect x="776.8" y="603.8" width="14.4" height="14.4" rx="3" fill="#a97a24"/><text x="800.0" y="617.0" font-size="15" fill="#3d434b" text-anchor="start">オレンジ</text><rect x="880" y="603" width="16" height="16" fill="#ffffff" stroke="#e2ded4"/><text x="904.0" y="617.0" font-size="15" fill="#3d434b" text-anchor="start">空き地（数えない）</text><text x="48" y="650" font-size="15" fill="#6b6f76">満足ライン＝シミュの「満足する同類の割合」（初期値35%）。まわりに住人がいなければ満足。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>