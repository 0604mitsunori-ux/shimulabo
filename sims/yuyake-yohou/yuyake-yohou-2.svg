<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">夕焼けになりやすい条件（焼け度の決まり）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="124.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">日の入りのころの雲量と焼け度（このページの判定）</text><rect x="48" y="146" width="560" height="75" fill="#f2efe7"/><text x="60.0" y="178.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">0〜5%</text><text x="60.0" y="202.0" font-size="14" fill="#3d434b" text-anchor="start">快晴</text><rect x="214.0" y="159.0" width="181.5" height="26.0" rx="3" fill="#d47d62" stroke="none" stroke-width="0"/><text x="405.5" y="180.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">55点</text><text x="214.0" y="208.0" font-size="15" fill="#3d434b" text-anchor="start">快晴。焼けるけど、ちょっと平凡かも</text><text x="60.0" y="253.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">6〜15%</text><rect x="214.0" y="234.0" width="231.0" height="26.0" rx="3" fill="#cd6349" stroke="none" stroke-width="0"/><text x="455.0" y="255.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">70点</text><text x="214.0" y="283.0" font-size="15" fill="#3d434b" text-anchor="start">きれいなグラデーション日和</text><rect x="48" y="296" width="560" height="75" fill="#f2efe7"/><text x="60.0" y="328.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">16〜40%</text><rect x="214.0" y="309.0" width="290.4" height="26.0" rx="3" fill="#c4442b" stroke="none" stroke-width="0"/><text x="514.4" y="330.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">88点</text><text x="214.0" y="358.0" font-size="15" fill="#3d434b" text-anchor="start">燃える空の予感！カメラの準備を</text><text x="60.0" y="403.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">41〜65%</text><rect x="214.0" y="384.0" width="244.2" height="26.0" rx="3" fill="#cb5c43" stroke="none" stroke-width="0"/><text x="468.2" y="405.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">74点</text><text x="214.0" y="433.0" font-size="15" fill="#3d434b" text-anchor="start">雲の切れ間しだいで大当たりも</text><rect x="48" y="446" width="560" height="75" fill="#f2efe7"/><text x="60.0" y="478.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">66〜85%</text><rect x="214.0" y="459.0" width="132.0" height="26.0" rx="3" fill="#db977c" stroke="none" stroke-width="0"/><text x="356.0" y="480.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">40点</text><text x="214.0" y="508.0" font-size="15" fill="#3d434b" text-anchor="start">雲多め。ドラマチック狙いならワンチャン</text><text x="60.0" y="553.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">86〜100%</text><rect x="214.0" y="534.0" width="49.5" height="26.0" rx="3" fill="#e7c2a6" stroke="none" stroke-width="0"/><text x="273.5" y="555.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">15点</text><text x="214.0" y="583.0" font-size="15" fill="#3d434b" text-anchor="start">今日は厚い雲の向こう…</text><text x="60.0" y="612.0" font-size="14" fill="#6b6f76" text-anchor="start">雲量＝空のうち雲がおおっている割合</text><defs><clipPath id="pane"><rect x="648" y="100" width="504" height="300"/></clipPath><linearGradient id="cb" x1="0" x2="0" y1="0" y2="1"><stop offset=".45" stop-color="#f3f1ec"/><stop offset="1" stop-color="#ef8a4a"/></linearGradient></defs><rect x="648.0" y="100.0" width="504.0" height="300.0" rx="10" fill="#eef3f6" stroke="#e2ded4" stroke-width="1.2"/><circle cx="850" cy="1110" r="760" fill="#d8cfb8" stroke="#b9a983" clip-path="url(#pane)"/><line x1="1110" y1="382" x2="798.6" y2="216.0" stroke="#c4442b" stroke-width="2" stroke-dasharray="6 5"/><line x1="1110" y1="382" x2="951.0" y2="242.0" stroke="#c4442b" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="780" cy="196" rx="62" ry="22" fill="url(#cb)" stroke="#c9c3b6" stroke-width="1"/><ellipse cx="930" cy="222" rx="70" ry="22" fill="url(#cb)" stroke="#c9c3b6" stroke-width="1"/><circle cx="1110.0" cy="382.0" r="15.0" fill="#f4d35e" stroke="#a97a24" stroke-width="1.5"/><line x1="658.0" y1="350.0" x2="1142.0" y2="350.0" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="850.0" y1="350.0" x2="850.0" y2="324.0" stroke="#14181d" stroke-width="3"/><circle cx="850.0" cy="317.0" r="7.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="1138.0" y="340.0" font-size="14" fill="#3d434b" text-anchor="end">地平線</text><text x="1088.0" y="388.0" font-size="14" fill="#14181d" text-anchor="end" font-weight="700">太陽（地平線の下）</text><text x="664.0" y="128.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">日没後、地平線の下の太陽の光が</text><text x="664.0" y="152.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">雲の底を照らす＝雲がスクリーンになる</text><text x="648.0" y="438.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">ベスト観賞タイム（このページの表示）</text><rect x="780.0" y="480.0" width="270.0" height="52.0" rx="6" fill="#fbeae6" stroke="#c4442b" stroke-width="1.4"/><text x="915.0" y="512.0" font-size="17" fill="#c4442b" text-anchor="middle" font-weight="700">マジックアワー</text><line x1="670.0" y1="546.0" x2="1104.0" y2="546.0" stroke="#14181d" stroke-width="2" marker-end="url(#ah-ink)"/><line x1="690.0" y1="538.0" x2="690.0" y2="554.0" stroke="#14181d" stroke-width="2"/><text x="690.0" y="576.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">日の入り</text><line x1="780.0" y1="538.0" x2="780.0" y2="554.0" stroke="#14181d" stroke-width="2"/><text x="780.0" y="576.0" font-size="15" fill="#14181d" text-anchor="middle">5分後</text><line x1="1050.0" y1="538.0" x2="1050.0" y2="554.0" stroke="#14181d" stroke-width="2"/><text x="1050.0" y="576.0" font-size="15" fill="#14181d" text-anchor="middle">20分後</text><text x="1122.0" y="552.0" font-size="14" fill="#3d434b" text-anchor="start">時刻</text><text x="48" y="650" font-size="15" fill="#6b6f76">雲量は日の入りの時刻にいちばん近い1時間の予報（Open-Meteo）。雲の高さや厚さは見ていない。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>