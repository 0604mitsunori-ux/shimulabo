<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">夕焼けが赤いしくみ（光の散乱）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><defs><clipPath id="body"><rect x="48" y="96" width="740" height="524"/></clipPath><linearGradient id="rayB" gradientUnits="userSpaceOnUse" x1="371.6" y1="372.3" x2="545.7" y2="453.4"><stop offset="0" stop-color="#f4d35e"/><stop offset=".55" stop-color="#ef9a3c"/><stop offset="1" stop-color="#c4442b"/></linearGradient></defs><g clip-path="url(#body)"><circle cx="440.0" cy="680.0" r="315.0" fill="#e6f0f6" stroke="#b9d3e2" stroke-width="1.4"/><circle cx="440.0" cy="680.0" r="250.0" fill="#cfdcc4" stroke="#8aa27a" stroke-width="2"/></g><text x="686.0" y="544.0" font-size="15" fill="#1b4a63" text-anchor="middle" font-weight="700">空気の層</text><text x="56.0" y="122.0" font-size="17" fill="#a97a24" text-anchor="start" font-weight="700">太陽の光</text><line x1="52.0" y1="140.0" x2="108.0" y2="166.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="194.0" x2="108.0" y2="220.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="248.0" x2="108.0" y2="274.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="302.0" x2="108.0" y2="328.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="356.0" x2="108.0" y2="382.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="410.0" x2="108.0" y2="436.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="464.0" x2="108.0" y2="490.1" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="120.0" y1="254.9" x2="372.0" y2="372.4" stroke="#f4d35e" stroke-width="4"/><line x1="372.0" y1="372.4" x2="545.7" y2="453.4" stroke="url(#rayB)" stroke-width="6" stroke-linecap="round"/><line x1="392.8" y1="382.2" x2="409.8" y2="352.7" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="427.6" y1="398.4" x2="430.5" y2="364.5" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="462.3" y1="414.5" x2="479.3" y2="385.1" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="497.0" y1="430.7" x2="500.0" y2="396.9" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="120.0" y1="530.8" x2="206.2" y2="571.0" stroke="#f4d35e" stroke-width="4"/><line x1="184.0" y1="560.6" x2="158.0" y2="545.6" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="184.0" y1="560.6" x2="178.8" y2="531.1" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="184.0" y1="560.6" x2="154.4" y2="565.8" stroke="#3f7fc0" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="213.4" y1="574.3" x2="189.9" y2="563.4" stroke="#14181d" stroke-width="3"/><circle cx="183.5" cy="560.4" r="7.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><line x1="545.7" y1="453.4" x2="556.6" y2="429.9" stroke="#14181d" stroke-width="3"/><circle cx="559.6" cy="423.5" r="7.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><circle cx="247.4" cy="604.3" r="15.3" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="247.4" y="610.8" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">①</text><circle cx="573.7" cy="407.4" r="15.3" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="573.7" y="413.9" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">②</text><text x="332.0" y="306.4" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">空気の中の道のりが長い</text><text x="271.4" y="610.3" font-size="15" fill="#1b4a63" text-anchor="start" font-weight="700">道のりが短い</text><text x="440.0" y="610.0" font-size="18" fill="#4d6340" text-anchor="middle" font-weight="700">地球</text><text x="812.0" y="128.0" font-size="18" fill="#2c6b86" text-anchor="start" font-weight="700">① 昼（太陽が高い）</text><text x="812.0" y="158.0" font-size="16" fill="#14181d" text-anchor="start">空気の中を通る道のりが短い。</text><text x="812.0" y="182.0" font-size="16" fill="#14181d" text-anchor="start">青い光が空いっぱいに散らばり、</text><text x="812.0" y="206.0" font-size="16" fill="#14181d" text-anchor="start">空が青く見える。</text><text x="812.0" y="270.0" font-size="18" fill="#c4442b" text-anchor="start" font-weight="700">② 夕方（太陽が地平線の近く）</text><text x="812.0" y="300.0" font-size="16" fill="#14181d" text-anchor="start">道のりは真上から来るときの約38倍。</text><text x="812.0" y="324.0" font-size="16" fill="#14181d" text-anchor="start">青い光は途中で散らばって減り、</text><text x="812.0" y="348.0" font-size="16" fill="#14181d" text-anchor="start">残った赤・オレンジの光が届く。</text><text x="812.0" y="424.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">光の色と散らばりやすさ</text><defs><linearGradient id="spec" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5b3fa8"/><stop offset=".2" stop-color="#2f6fd0"/><stop offset=".45" stop-color="#3fa86a"/><stop offset=".65" stop-color="#e8d23a"/><stop offset=".82" stop-color="#ef8a2c"/><stop offset="1" stop-color="#c8301e"/></linearGradient></defs><rect x="812" y="440" width="330" height="26" rx="4" fill="url(#spec)"/><text x="812.0" y="490.0" font-size="15" fill="#3d434b" text-anchor="start">青（波長 約450nm）</text><text x="1142.0" y="490.0" font-size="15" fill="#3d434b" text-anchor="end">赤（約700nm）</text><text x="812.0" y="524.0" font-size="17" fill="#3f7fc0" text-anchor="start" font-weight="700">青い光は赤い光の約6倍</text><text x="812.0" y="548.0" font-size="17" fill="#3f7fc0" text-anchor="start" font-weight="700">散らばりやすい</text><text x="812.0" y="576.0" font-size="14" fill="#3d434b" text-anchor="start">（波長の4乗に反比例＝レイリー散乱）</text><text x="48" y="650" font-size="15" fill="#6b6f76">模式図（大きさ・空気の厚さは実際とちがう）。散乱＝光が空気の分子に当たって、いろいろな向きに散らばること。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>