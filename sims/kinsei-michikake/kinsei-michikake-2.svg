<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">金星の見え方の早見表</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">金星が見える時刻と、真夜中に見えないわけ</text><line x1="280.0" y1="300.0" x2="280.0" y2="172.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><text x="280.0" y="162.0" font-size="15" fill="#a97a24" text-anchor="middle" font-weight="700">太陽の方向</text><line x1="196.0" y1="392.0" x2="87.6" y2="288.4" stroke="#c4442b" stroke-width="2" stroke-dasharray="6 4"/><circle cx="87.6" cy="288.4" r="9.0" fill="#f4d35e" stroke="#c4442b" stroke-width="2"/><text x="48.0" y="252.4" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">金星（よいの明星）</text><text x="48.0" y="272.4" font-size="14" fill="#c4442b" text-anchor="start">太陽から東へ最大約46°</text><line x1="364.0" y1="392.0" x2="472.4" y2="288.4" stroke="#2c6b86" stroke-width="2" stroke-dasharray="6 4"/><circle cx="472.4" cy="288.4" r="9.0" fill="#f4d35e" stroke="#2c6b86" stroke-width="2"/><text x="545.0" y="252.4" font-size="15" fill="#2c6b86" text-anchor="end" font-weight="700">金星（明けの明星）</text><text x="545.0" y="272.4" font-size="14" fill="#2c6b86" text-anchor="end">太陽から西へ最大約46°</text><circle cx="280.0" cy="392.0" r="84.0" fill="#2f4f6b" stroke="#2f4f6b" stroke-width="0"/><path d="M196,392 A84,84 0 0 1 364,392Z" fill="#7fb3d5"/><text x="280.0" y="362.0" font-size="18" fill="#14385a" text-anchor="middle" font-weight="700">昼</text><text x="280.0" y="442.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">夜</text><path d="M227.4,416.5 A58,58 0 0 0 255.5,444.6" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M263.6,448.4 L253.4,449.1 L257.6,440.0Z" fill="#fff"/><text x="274.0" y="416.0" font-size="14" fill="#fff" text-anchor="end" font-weight="700">自転</text><line x1="196.0" y1="288.0" x2="196.0" y2="496.0" stroke="#14181d" stroke-width="2.2"/><circle cx="196.0" cy="392.0" r="6.0" fill="#c4442b" stroke="#fff" stroke-width="1.5"/><text x="184.0" y="422.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">夕方</text><text x="184.0" y="444.0" font-size="15" fill="#3d434b" text-anchor="end">西の空に見える</text><line x1="364.0" y1="288.0" x2="364.0" y2="496.0" stroke="#14181d" stroke-width="2.2"/><circle cx="364.0" cy="392.0" r="6.0" fill="#c4442b" stroke="#fff" stroke-width="1.5"/><text x="376.0" y="422.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">明け方</text><text x="376.0" y="444.0" font-size="15" fill="#3d434b" text-anchor="start">東の空に見える</text><line x1="176.0" y1="476.0" x2="384.0" y2="476.0" stroke="#14181d" stroke-width="2.2"/><circle cx="280.0" cy="476.0" r="6.0" fill="#c4442b" stroke="#fff" stroke-width="1.5"/><text x="280.0" y="510.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">真夜中</text><text x="280.0" y="532.0" font-size="15" fill="#3d434b" text-anchor="middle">金星は地平線の下（見えない）</text><text x="48.0" y="596.0" font-size="14" fill="#6b6f76" text-anchor="start">黒い線＝それぞれの時刻の観察者の地平線（地球の外側が空）。</text><text x="48.0" y="615.6" font-size="14" fill="#6b6f76" text-anchor="start">北極の上から見た図。大きさは誇張。</text><text x="560.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">金星の位置と見え方（円軌道で計算）</text><rect x="560.0" y="144.0" width="592.0" height="322.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="560" y="144" width="592" height="46" rx="8" fill="#eef3f6"/><text x="633.0" y="173.4" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">位置</text><text x="736.0" y="173.4" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">距離</text><text x="830.0" y="173.4" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">形（光る部分）</text><text x="929.0" y="173.4" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">大きさ</text><text x="1058.0" y="173.4" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">見え方</text><line x1="560.0" y1="190.0" x2="1152.0" y2="190.0" stroke="#e2ded4" stroke-width="1"/><text x="633.0" y="219.4" font-size="14.5" fill="#14181d" text-anchor="middle">① 外合</text><text x="736.0" y="219.4" font-size="14.5" fill="#14181d" text-anchor="middle">約1.72</text><text x="830.0" y="219.4" font-size="14.5" fill="#14181d" text-anchor="middle">丸い（100%）</text><text x="929.0" y="219.4" font-size="14.5" fill="#14181d" text-anchor="middle">1倍</text><text x="1058.0" y="219.4" font-size="14.5" fill="#14181d" text-anchor="middle">見えない（太陽の方向）</text><rect x="561" y="236" width="590" height="46" fill="#f7f5ef"/><line x1="560.0" y1="236.0" x2="1152.0" y2="236.0" stroke="#e2ded4" stroke-width="1"/><text x="633.0" y="265.4" font-size="14.5" fill="#14181d" text-anchor="middle">② 東方最大離角</text><text x="736.0" y="265.4" font-size="14.5" fill="#14181d" text-anchor="middle">約0.69</text><text x="830.0" y="265.4" font-size="14.5" fill="#14181d" text-anchor="middle">半月形（50%）</text><text x="929.0" y="265.4" font-size="14.5" fill="#14181d" text-anchor="middle">約2.5倍</text><text x="1058.0" y="265.4" font-size="14.5" fill="#14181d" text-anchor="middle">よいの明星（夕方・西）</text><line x1="560.0" y1="282.0" x2="1152.0" y2="282.0" stroke="#e2ded4" stroke-width="1"/><text x="633.0" y="311.4" font-size="14.5" fill="#14181d" text-anchor="middle">③ 内合の約30日前</text><text x="736.0" y="311.4" font-size="14.5" fill="#14181d" text-anchor="middle">約0.39</text><text x="830.0" y="311.4" font-size="14.5" fill="#14181d" text-anchor="middle">三日月形（21%）</text><text x="929.0" y="311.4" font-size="14.5" fill="#14181d" text-anchor="middle">約4.4倍</text><text x="1058.0" y="311.4" font-size="14.5" fill="#14181d" text-anchor="middle">よいの明星（夕方・西）</text><rect x="561" y="328" width="590" height="46" fill="#f7f5ef"/><line x1="560.0" y1="328.0" x2="1152.0" y2="328.0" stroke="#e2ded4" stroke-width="1"/><text x="633.0" y="357.4" font-size="14.5" fill="#14181d" text-anchor="middle">④ 内合</text><text x="736.0" y="357.4" font-size="14.5" fill="#14181d" text-anchor="middle">約0.28</text><text x="830.0" y="357.4" font-size="14.5" fill="#14181d" text-anchor="middle">見えない（0%）</text><text x="929.0" y="357.4" font-size="14.5" fill="#14181d" text-anchor="middle">約6.2倍</text><text x="1058.0" y="357.4" font-size="14.5" fill="#14181d" text-anchor="middle">見えない（太陽の方向）</text><line x1="560.0" y1="374.0" x2="1152.0" y2="374.0" stroke="#e2ded4" stroke-width="1"/><text x="633.0" y="403.4" font-size="14.5" fill="#14181d" text-anchor="middle">⑤ 内合の約30日後</text><text x="736.0" y="403.4" font-size="14.5" fill="#14181d" text-anchor="middle">約0.39</text><text x="830.0" y="403.4" font-size="14.5" fill="#14181d" text-anchor="middle">三日月形（21%）</text><text x="929.0" y="403.4" font-size="14.5" fill="#14181d" text-anchor="middle">約4.4倍</text><text x="1058.0" y="403.4" font-size="14.5" fill="#14181d" text-anchor="middle">明けの明星（明け方・東）</text><rect x="561" y="420" width="590" height="46" fill="#f7f5ef"/><line x1="560.0" y1="420.0" x2="1152.0" y2="420.0" stroke="#e2ded4" stroke-width="1"/><text x="633.0" y="449.4" font-size="14.5" fill="#14181d" text-anchor="middle">⑥ 西方最大離角</text><text x="736.0" y="449.4" font-size="14.5" fill="#14181d" text-anchor="middle">約0.69</text><text x="830.0" y="449.4" font-size="14.5" fill="#14181d" text-anchor="middle">半月形（50%）</text><text x="929.0" y="449.4" font-size="14.5" fill="#14181d" text-anchor="middle">約2.5倍</text><text x="1058.0" y="449.4" font-size="14.5" fill="#14181d" text-anchor="middle">明けの明星（明け方・東）</text><text x="560.0" y="488.0" font-size="15" fill="#14181d" text-anchor="start">・地球から見ると、金星は太陽から最大でも約46°しかはなれない</text><text x="560.0" y="510.5" font-size="15" fill="#14181d" text-anchor="start">　→ 夕方の西の空か、明け方の東の空にしか見えない。</text><text x="560.0" y="533.0" font-size="15" fill="#14181d" text-anchor="start">・①→②→④→⑥→①と一周するのに約584日（約1年7か月）。</text><text x="560.0" y="555.5" font-size="15" fill="#14181d" text-anchor="start">・距離は天文単位、大きさは①（外合のころ）を1とした倍率。</text><text x="48" y="650" font-size="15" fill="#6b6f76">金星は地球より内側を回るので、真夜中には見えない。地球に近いほど大きく、細く欠けて見える。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>