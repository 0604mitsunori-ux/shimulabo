<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">出席率の計算方法（式と早見表）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="98.0" width="1104.0" height="70.0" rx="10" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="600.0" y="145.0" font-size="24" fill="#14181d" text-anchor="middle" font-weight="700">出席率（%）＝（授業日数 − 欠席日数）÷ 授業日数 × 100</text><text x="60.0" y="212.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">例）授業日数120日・欠席5日（シミュの初期値）</text><rect x="60" y="232" width="498.3" height="50" rx="6" fill="#2c6b86"/><rect x="560.3" y="232" width="19.7" height="50" rx="3" fill="#c4442b"/><text x="309.2" y="264.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">出席 115日</text><text x="580.0" y="306.0" font-size="16" fill="#c4442b" text-anchor="end" font-weight="700">欠席 5日</text><text x="60.0" y="306.0" font-size="16" fill="#3d434b" text-anchor="start">授業日数 120日</text><circle cx="76.0" cy="363.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="76.0" y="368.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="100.0" y="370.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">出席日数 ＝ 120 − 5 ＝ 115日</text><circle cx="76.0" cy="409.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="76.0" y="414.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="100.0" y="416.0" font-size="20" fill="#c4442b" text-anchor="start" font-weight="700">出席率 ＝ 115 ÷ 120 × 100 ＝ 約95.8%</text><rect x="60.0" y="470.0" width="520.0" height="122.0" rx="10" fill="#f6eedc" stroke="#f6eedc" stroke-width="1.2"/><text x="78.0" y="502.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">年間200日で 9割（90%）を保つには</text><text x="78.0" y="538.0" font-size="17" fill="#3d434b" text-anchor="start">休めるのは 200 × 10% ＝ 20日まで</text><text x="78.0" y="574.0" font-size="20" fill="#a97a24" text-anchor="start" font-weight="700">いま欠席5日 → あと15日まで</text><text x="640.0" y="212.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">出席率の早見表（年間200日の場合）</text><rect x="640.0" y="228.0" width="512.0" height="364.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="640" y="228" width="512" height="52" rx="8" fill="#eef3f6"/><text x="705.0" y="261.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">欠席日数</text><text x="840.0" y="261.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">出席率</text><text x="1031.0" y="261.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">目安</text><line x1="640.0" y1="280.0" x2="1152.0" y2="280.0" stroke="#e2ded4" stroke-width="1"/><text x="705.0" y="313.3" font-size="17" fill="#14181d" text-anchor="middle">0日</text><text x="840.0" y="313.3" font-size="17" fill="#14181d" text-anchor="middle">100%</text><text x="1031.0" y="313.3" font-size="17" fill="#14181d" text-anchor="middle">皆勤</text><rect x="641" y="332" width="510" height="52" fill="#f7f5ef"/><line x1="640.0" y1="332.0" x2="1152.0" y2="332.0" stroke="#e2ded4" stroke-width="1"/><text x="705.0" y="365.3" font-size="17" fill="#14181d" text-anchor="middle">5日</text><text x="840.0" y="365.3" font-size="17" fill="#14181d" text-anchor="middle">97.5%</text><text x="1031.0" y="365.3" font-size="17" fill="#14181d" text-anchor="middle">非常に良好</text><line x1="640.0" y1="384.0" x2="1152.0" y2="384.0" stroke="#e2ded4" stroke-width="1"/><text x="705.0" y="417.3" font-size="17" fill="#14181d" text-anchor="middle">10日</text><text x="840.0" y="417.3" font-size="17" fill="#14181d" text-anchor="middle">95.0%</text><text x="1031.0" y="417.3" font-size="17" fill="#14181d" text-anchor="middle">良好</text><rect x="641" y="436" width="510" height="52" fill="#f7f5ef"/><line x1="640.0" y1="436.0" x2="1152.0" y2="436.0" stroke="#e2ded4" stroke-width="1"/><text x="705.0" y="469.3" font-size="17" fill="#14181d" text-anchor="middle">20日</text><text x="840.0" y="469.3" font-size="17" fill="#14181d" text-anchor="middle">90.0%</text><text x="1031.0" y="469.3" font-size="17" fill="#14181d" text-anchor="middle">ひとつの目安ライン</text><line x1="640.0" y1="488.0" x2="1152.0" y2="488.0" stroke="#e2ded4" stroke-width="1"/><text x="705.0" y="521.3" font-size="17" fill="#14181d" text-anchor="middle">40日</text><text x="840.0" y="521.3" font-size="17" fill="#14181d" text-anchor="middle">80.0%</text><text x="1031.0" y="521.3" font-size="17" fill="#14181d" text-anchor="middle">注意（要件に注意）</text><rect x="641" y="540" width="510" height="52" fill="#f7f5ef"/><line x1="640.0" y1="540.0" x2="1152.0" y2="540.0" stroke="#e2ded4" stroke-width="1"/><text x="705.0" y="573.3" font-size="17" fill="#14181d" text-anchor="middle">60日</text><text x="840.0" y="573.3" font-size="17" fill="#14181d" text-anchor="middle">70.0%</text><text x="1031.0" y="573.3" font-size="17" fill="#14181d" text-anchor="middle">進級・単位に影響も</text><text x="48" y="650" font-size="15" fill="#6b6f76">出席停止や忌引きは欠席に数えない扱いが一般的（学校で確認）。目安は在籍校の規定で変わる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>