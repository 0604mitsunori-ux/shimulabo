<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">出席率◯%を保つには何回まで休める？（早見表）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="98.0" width="1104.0" height="62.0" rx="10" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="600.0" y="140.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">休める回数の上限 ＝ 授業回数 ×（1 − 出席率）　※端数は切り捨て</text><rect x="80.0" y="182.0" width="1040.0" height="270.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="80" y="182" width="1040" height="54" rx="8" fill="#eef3f6"/><text x="240.0" y="216.6" font-size="18.5" fill="#14181d" text-anchor="middle" font-weight="700">授業回数</text><text x="495.0" y="216.6" font-size="18.5" fill="#14181d" text-anchor="middle" font-weight="700">90%以上</text><text x="685.0" y="216.6" font-size="18.5" fill="#14181d" text-anchor="middle" font-weight="700">80%以上</text><text x="875.0" y="216.6" font-size="18.5" fill="#14181d" text-anchor="middle" font-weight="700">75%以上</text><text x="1045.0" y="216.6" font-size="18.5" fill="#14181d" text-anchor="middle" font-weight="700">3分の2以上</text><line x1="80.0" y1="236.0" x2="1120.0" y2="236.0" stroke="#e2ded4" stroke-width="1"/><text x="240.0" y="270.6" font-size="18.5" fill="#14181d" text-anchor="middle">15回（大学の半期）</text><text x="495.0" y="270.6" font-size="18.5" fill="#14181d" text-anchor="middle">1回まで</text><text x="685.0" y="270.6" font-size="18.5" fill="#14181d" text-anchor="middle">3回まで</text><text x="875.0" y="270.6" font-size="18.5" fill="#14181d" text-anchor="middle">3回まで</text><text x="1045.0" y="270.6" font-size="18.5" fill="#14181d" text-anchor="middle">5回まで</text><rect x="81" y="290" width="1038" height="54" fill="#f7f5ef"/><line x1="80.0" y1="290.0" x2="1120.0" y2="290.0" stroke="#e2ded4" stroke-width="1"/><text x="240.0" y="324.6" font-size="18.5" fill="#14181d" text-anchor="middle">30回（大学の通年）</text><text x="495.0" y="324.6" font-size="18.5" fill="#14181d" text-anchor="middle">3回まで</text><text x="685.0" y="324.6" font-size="18.5" fill="#14181d" text-anchor="middle">6回まで</text><text x="875.0" y="324.6" font-size="18.5" fill="#14181d" text-anchor="middle">7回まで</text><text x="1045.0" y="324.6" font-size="18.5" fill="#14181d" text-anchor="middle">10回まで</text><line x1="80.0" y1="344.0" x2="1120.0" y2="344.0" stroke="#e2ded4" stroke-width="1"/><text x="240.0" y="378.6" font-size="18.5" fill="#14181d" text-anchor="middle">35回（高校の週1科目）</text><text x="495.0" y="378.6" font-size="18.5" fill="#14181d" text-anchor="middle">3回まで</text><text x="685.0" y="378.6" font-size="18.5" fill="#14181d" text-anchor="middle">7回まで</text><text x="875.0" y="378.6" font-size="18.5" fill="#14181d" text-anchor="middle">8回まで</text><text x="1045.0" y="378.6" font-size="18.5" fill="#14181d" text-anchor="middle">11回まで</text><rect x="81" y="398" width="1038" height="54" fill="#f7f5ef"/><line x1="80.0" y1="398.0" x2="1120.0" y2="398.0" stroke="#e2ded4" stroke-width="1"/><text x="240.0" y="432.6" font-size="18.5" fill="#14181d" text-anchor="middle">200日（年間の授業日数）</text><text x="495.0" y="432.6" font-size="18.5" fill="#14181d" text-anchor="middle">20日まで</text><text x="685.0" y="432.6" font-size="18.5" fill="#14181d" text-anchor="middle">40日まで</text><text x="875.0" y="432.6" font-size="18.5" fill="#14181d" text-anchor="middle">50日まで</text><text x="1045.0" y="432.6" font-size="18.5" fill="#14181d" text-anchor="middle">66日まで</text><text x="80.0" y="498.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">例）大学の半期15回で「3分の2以上の出席」なら</text><circle cx="100.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="100.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="146.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="146.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="192.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="192.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="238.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="238.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="284.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="284.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="330.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="330.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="376.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="376.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="422.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="422.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="468.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="468.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="514.0" cy="542.0" r="17.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="2"/><text x="514.0" y="548.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">出</text><circle cx="560.0" cy="542.0" r="17.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="560.0" y="548.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">欠</text><circle cx="606.0" cy="542.0" r="17.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="606.0" y="548.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">欠</text><circle cx="652.0" cy="542.0" r="17.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="652.0" y="548.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">欠</text><circle cx="698.0" cy="542.0" r="17.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="698.0" y="548.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">欠</text><circle cx="744.0" cy="542.0" r="17.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="744.0" y="548.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">欠</text><text x="790.0" y="537.0" font-size="18" fill="#2c6b86" text-anchor="start" font-weight="700">出席10回以上</text><text x="790.0" y="563.0" font-size="18" fill="#c4442b" text-anchor="start" font-weight="700">欠席5回まで</text><text x="80.0" y="606.0" font-size="15.5" fill="#3d434b" text-anchor="start">遅刻・早退を欠席に数える学校や、「3分の1を超えて欠席すると不可」など境目の扱いがちがう学校もある。</text><text x="48" y="650" font-size="15" fill="#6b6f76">3分の2以上＝約66.7%以上。高校・大学の単位認定でよく使われる。最終的には在籍校の規定を確認。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>