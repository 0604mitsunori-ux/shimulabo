<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">ハーディー・ワインベルグの法則（まとめ）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="120.0" font-size="22" fill="#14181d" text-anchor="start" font-weight="700">(p＋q)²＝p²＋2pq＋q²＝1</text><text x="274.0" y="150.0" font-size="15" fill="#6b6f76" text-anchor="middle" font-weight="700">精子の遺伝子 →</text><text x="214.0" y="176.0" font-size="16" fill="#c4442b" text-anchor="middle" font-weight="700">A（p＝0.6）</text><text x="364.0" y="176.0" font-size="16" fill="#2c6b86" text-anchor="middle" font-weight="700">a（q＝0.4）</text><text x="48.0" y="158.0" font-size="15" fill="#6b6f76" text-anchor="start" font-weight="700">卵の</text><text x="48.0" y="178.0" font-size="15" fill="#6b6f76" text-anchor="start" font-weight="700">遺伝子 ↓</text><text x="114.0" y="274.0" font-size="18" fill="#c4442b" text-anchor="end" font-weight="700">A</text><text x="114.0" y="296.0" font-size="14" fill="#c4442b" text-anchor="end" font-weight="700">p＝0.6</text><text x="114.0" y="424.0" font-size="18" fill="#2c6b86" text-anchor="end" font-weight="700">a</text><text x="114.0" y="446.0" font-size="14" fill="#2c6b86" text-anchor="end" font-weight="700">q＝0.4</text><rect x="124.0" y="186.0" width="180.0" height="180.0" rx="0" fill="#fbeae6" stroke="#3d434b" stroke-width="1.4"/><text x="214.0" y="272.0" font-size="24" fill="#14181d" text-anchor="middle" font-weight="700">AA</text><text x="214.0" y="298.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">p²＝0.36</text><rect x="304.0" y="186.0" width="120.0" height="180.0" rx="0" fill="#f6eedc" stroke="#3d434b" stroke-width="1.4"/><text x="364.0" y="272.0" font-size="24" fill="#14181d" text-anchor="middle" font-weight="700">Aa</text><text x="364.0" y="298.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">pq＝0.24</text><rect x="124.0" y="366.0" width="180.0" height="120.0" rx="0" fill="#f6eedc" stroke="#3d434b" stroke-width="1.4"/><text x="214.0" y="422.0" font-size="24" fill="#14181d" text-anchor="middle" font-weight="700">Aa</text><text x="214.0" y="448.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">pq＝0.24</text><rect x="304.0" y="366.0" width="120.0" height="120.0" rx="0" fill="#eef3f6" stroke="#3d434b" stroke-width="1.4"/><text x="364.0" y="422.0" font-size="24" fill="#14181d" text-anchor="middle" font-weight="700">aa</text><text x="364.0" y="448.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">q²＝0.16</text><text x="442.0" y="210.0" font-size="15" fill="#6b6f76" text-anchor="start">面積が</text><text x="442.0" y="230.0" font-size="15" fill="#6b6f76" text-anchor="start">その組み合わせ</text><text x="442.0" y="250.0" font-size="15" fill="#6b6f76" text-anchor="start">の割合</text><text x="48.0" y="522.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">AA：Aa：aa＝p²：2pq：q²</text><text x="48.0" y="550.0" font-size="18" fill="#c4442b" text-anchor="start" font-weight="700">＝36%：48%：16%（p＝0.6 のとき）</text><text x="48.0" y="584.0" font-size="16" fill="#3d434b" text-anchor="start">次の世代のAの頻度＝p²＋pq＝p(p＋q)＝p</text><text x="48.0" y="608.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">→ 遺伝子頻度は世代をこえて変わらない</text><rect x="600.0" y="100.0" width="552.0" height="152.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="600" y="100" width="6" height="152" rx="3" fill="#2c6b86"/><text x="622.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">法則が成り立つ5つの条件</text><text x="622.0" y="156.0" font-size="16" fill="#3d434b" text-anchor="start">① 集団が十分に大きい（遺伝的浮動が無視できる）</text><text x="622.0" y="180.0" font-size="16" fill="#3d434b" text-anchor="start">② 自由に交配が行われる</text><text x="622.0" y="204.0" font-size="16" fill="#3d434b" text-anchor="start">③ 突然変異が起こらない　④ 移入や移出がない</text><text x="622.0" y="228.0" font-size="16" fill="#3d434b" text-anchor="start">⑤ 自然選択がはたらかない</text><text x="600.0" y="290.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">早見表：遺伝子頻度と遺伝子型頻度</text><rect x="600.0" y="304.0" width="552.0" height="231.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="600" y="304" width="552" height="33" rx="8" fill="#eef3f6"/><text x="650.0" y="325.1" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">p（A）</text><text x="750.0" y="325.1" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">q（a）</text><text x="858.0" y="325.1" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">AA（p²）</text><text x="976.0" y="325.1" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">Aa（2pq）</text><text x="1094.0" y="325.1" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">aa（q²）</text><line x1="600.0" y1="337.0" x2="1152.0" y2="337.0" stroke="#e2ded4" stroke-width="1"/><text x="650.0" y="358.1" font-size="16" fill="#14181d" text-anchor="middle">0.9</text><text x="750.0" y="358.1" font-size="16" fill="#14181d" text-anchor="middle">0.1</text><text x="858.0" y="358.1" font-size="16" fill="#14181d" text-anchor="middle">0.81</text><text x="976.0" y="358.1" font-size="16" fill="#14181d" text-anchor="middle">0.18</text><text x="1094.0" y="358.1" font-size="16" fill="#14181d" text-anchor="middle">0.01</text><rect x="601" y="370" width="550" height="33" fill="#f7f5ef"/><line x1="600.0" y1="370.0" x2="1152.0" y2="370.0" stroke="#e2ded4" stroke-width="1"/><text x="650.0" y="391.1" font-size="16" fill="#14181d" text-anchor="middle">0.8</text><text x="750.0" y="391.1" font-size="16" fill="#14181d" text-anchor="middle">0.2</text><text x="858.0" y="391.1" font-size="16" fill="#14181d" text-anchor="middle">0.64</text><text x="976.0" y="391.1" font-size="16" fill="#14181d" text-anchor="middle">0.32</text><text x="1094.0" y="391.1" font-size="16" fill="#14181d" text-anchor="middle">0.04</text><line x1="600.0" y1="403.0" x2="1152.0" y2="403.0" stroke="#e2ded4" stroke-width="1"/><text x="650.0" y="424.1" font-size="16" fill="#14181d" text-anchor="middle">0.7</text><text x="750.0" y="424.1" font-size="16" fill="#14181d" text-anchor="middle">0.3</text><text x="858.0" y="424.1" font-size="16" fill="#14181d" text-anchor="middle">0.49</text><text x="976.0" y="424.1" font-size="16" fill="#14181d" text-anchor="middle">0.42</text><text x="1094.0" y="424.1" font-size="16" fill="#14181d" text-anchor="middle">0.09</text><rect x="601" y="436" width="550" height="33" fill="#f7f5ef"/><line x1="600.0" y1="436.0" x2="1152.0" y2="436.0" stroke="#e2ded4" stroke-width="1"/><text x="650.0" y="457.1" font-size="16" fill="#14181d" text-anchor="middle">0.6</text><text x="750.0" y="457.1" font-size="16" fill="#14181d" text-anchor="middle">0.4</text><text x="858.0" y="457.1" font-size="16" fill="#14181d" text-anchor="middle">0.36</text><text x="976.0" y="457.1" font-size="16" fill="#14181d" text-anchor="middle">0.48</text><text x="1094.0" y="457.1" font-size="16" fill="#14181d" text-anchor="middle">0.16</text><line x1="600.0" y1="469.0" x2="1152.0" y2="469.0" stroke="#e2ded4" stroke-width="1"/><text x="650.0" y="490.1" font-size="16" fill="#14181d" text-anchor="middle">0.5</text><text x="750.0" y="490.1" font-size="16" fill="#14181d" text-anchor="middle">0.5</text><text x="858.0" y="490.1" font-size="16" fill="#14181d" text-anchor="middle">0.25</text><text x="976.0" y="490.1" font-size="16" fill="#14181d" text-anchor="middle">0.50</text><text x="1094.0" y="490.1" font-size="16" fill="#14181d" text-anchor="middle">0.25</text><rect x="601" y="502" width="550" height="33" fill="#f7f5ef"/><line x1="600.0" y1="502.0" x2="1152.0" y2="502.0" stroke="#e2ded4" stroke-width="1"/><text x="650.0" y="523.1" font-size="16" fill="#14181d" text-anchor="middle">0.99</text><text x="750.0" y="523.1" font-size="16" fill="#14181d" text-anchor="middle">0.01</text><text x="858.0" y="523.1" font-size="16" fill="#14181d" text-anchor="middle">0.9801</text><text x="976.0" y="523.1" font-size="16" fill="#14181d" text-anchor="middle">0.0198</text><text x="1094.0" y="523.1" font-size="16" fill="#14181d" text-anchor="middle">0.0001</text><text x="600.0" y="572.0" font-size="15" fill="#3d434b" text-anchor="start">計算の例：aa が16%なら q²＝0.16 → q＝0.4、p＝0.6、</text><text x="600.0" y="594.5" font-size="15" fill="#3d434b" text-anchor="start">Aa＝2×0.6×0.4＝0.48（顕性の形質の個体84%のうち約57%）</text><text x="48" y="650" font-size="15" fill="#6b6f76">親の遺伝子型の割合がどうであっても、遺伝子頻度が p・q なら1世代の自由な交配で p²：2pq：q² になる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>