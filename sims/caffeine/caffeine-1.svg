6" fill="#14181d" text-anchor="start">2杯を寝る6時間前</text><text x="1132.0" y="380.0" font-size="16" fill="#a97a24" text-anchor="end" font-weight="700">約70mg・眠り浅いかも</text><text x="826.0" y="418.0" font-size="16" fill="#14181d" text-anchor="start">1杯を寝る8時間前</text><text x="1132.0" y="418.0" font-size="16" fill="#1b4a63" text-anchor="end" font-weight="700">約26mg・おおむねOK</text><rect x="806.0" y="468.0" width="346.0" height="148.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.2"/><text x="826.0" y="508.0" font-size="15" fill="#14181d" text-anchor="start">※ 目安であり、医療の診断ではない。</text><text x="826.0" y="530.5" font-size="15" fill="#14181d" text-anchor="start">体質・体重・代謝などで個人差がある。</text><text x="826.0" y="553.0" font-size="15" fill="#14181d" text-anchor="start">1杯＝コーヒー約80mgとして計算。</text><text x="48" y="650" font-size="15" fill="#6b6f76">就寝時に50mg以上残っていると、寝つきや眠りの質に影響する可能性があるとされる（シミュの判定）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>