<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">凸レンズでできる像の作図（物体が焦点距離の2倍より遠いとき）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><line x1="60.0" y1="392.0" x2="1140.0" y2="392.0" stroke="#6b6f76" stroke-width="1.4"/><text x="1140.0" y="382.0" font-size="14" fill="#6b6f76" text-anchor="end">光軸</text><ellipse cx="600" cy="392" rx="16" ry="150" fill="#eef3f6" stroke="#2c6b86" stroke-width="2"/><line x1="600.0" y1="242.0" x2="600.0" y2="542.0" stroke="#2c6b86" stroke-width="1" stroke-dasharray="4 4"/><text x="600.0" y="232.0" font-size="17" fill="#2c6b86" text-anchor="middle" font-weight="700">凸レンズ</text><circle cx="450.0" cy="392.0" r="5.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="450.0" y="422.0" font-size="14" fill="#14181d" text-anchor="middle">焦点</text><circle cx="750.0" cy="392.0" r="5.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="750.0" y="422.0" font-size="14" fill="#14181d" text-anchor="middle">焦点</text><circle cx="300.0" cy="392.0" r="5.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="300.0" y="422.0" font-size="14" fill="#14181d" text-anchor="middle">焦点距離の2倍</text><circle cx="900.0" cy="392.0" r="5.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="900.0" y="422.0" font-size="14" fill="#14181d" text-anchor="middle">焦点距離の2倍</text><polyline points="150.0,272.0 600.0,272.0 990.0,584.0" fill="none" stroke="#c4442b" stroke-width="2.6" stroke-linejoin="round"/><polyline points="150.0,272.0 1100.0,525.3" fill="none" stroke="#c4442b" stroke-width="2.6" stroke-linejoin="round"/><polyline points="150.0,272.0 600.0,452.0 1100.0,452.0" fill="none" stroke="#c4442b" stroke-width="2.6" stroke-linejoin="round"/><text x="410.0" y="260.0" font-size="14" fill="#c4442b" text-anchor="start">① 光軸に平行な光</text><text x="350.0" y="308.0" font-size="14" fill="#c4442b" text-anchor="start">② 中心を通る光</text><text x="395.0" y="482.0" font-size="14" fill="#c4442b" text-anchor="start">③ 焦点を通る光</text><line x1="150.0" y1="392.0" x2="150.0" y2="280.0" stroke="#14181d" stroke-width="5"/><path d="M150,272 l-11,16 h22z" fill="#14181d"/><text x="150.0" y="258.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">物体</text><line x1="825.0" y1="392.0" x2="825.0" y2="444.0" stroke="#2c6b86" stroke-width="5"/><path d="M825.0,452.0 l-11,-16 h22z" fill="#2c6b86"/><text x="841.0" y="486.0" font-size="17" fill="#2c6b86" text-anchor="start" font-weight="700">実像（上下逆・物体より小さい）</text><text x="60.0" y="126.0" font-size="16" fill="#14181d" text-anchor="start">物体の位置：焦点距離の3倍　→　像の位置：焦点距離の1.5倍（焦点と焦点距離の2倍の間）・大きさ 0.5倍</text><text x="48" y="650" font-size="15" fill="#6b6f76">3本の光のうち2本をかけば、交わった所に像ができる。光はレンズの中心の線で1回曲げてかく（教科書の約束）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>