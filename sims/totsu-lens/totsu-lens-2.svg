t="700">A</text><rect x="680" y="128" width="150" height="44" fill="#eef3f6" opacity=".9"/><text x="755.0" y="157.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">C</text><rect x="830" y="128" width="150" height="44" fill="#fbeae6" opacity=".9"/><text x="905.0" y="157.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">E</text><line x1="680.0" y1="120.0" x2="680.0" y2="180.0" stroke="#14181d" stroke-width="2"/><circle cx="680.0" cy="198.0" r="12.8" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="680.0" y="203.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">B</text><text x="680.0" y="114.0" font-size="14" fill="#14181d" text-anchor="middle">焦点距離の2倍</text><line x1="830.0" y1="120.0" x2="830.0" y2="180.0" stroke="#14181d" stroke-width="2"/><circle cx="830.0" cy="198.0" r="12.8" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="830.0" y="203.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">D</text><text x="830.0" y="114.0" font-size="14" fill="#14181d" text-anchor="middle">焦点</text><text x="80.0" y="114.0" font-size="14" fill="#6b6f76" text-anchor="start">← 物体をおく位置（レンズの左側）</text><rect x="60.0" y="236.0" width="1080.0" height="324.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="60" y="236" width="1080" height="54" rx="8" fill="#eef3f6"/><text x="85.0" y="270.6" font-size="16.5" fill="#14181d" text-anchor="middle" font-weight="700"></text><text x="255.0" y="270.6" font-size="16.5" fill="#14181d" text-anchor="middle" font-weight="700">物体の位置</text><text x="475.0" y="270.6" font-size="16.5" fill="#14181d" text-anchor="middle" font-weight="700">像</text><text x="645.0" y="270.6" font-size="16.5" fill="#14181d" text-anchor="middle" font-weight="700">向き</text><text x="835.0" y="270.6" font-size="16.5" fill="#14181d" text-anchor="middle" font-weight="700">大きさ</text><text x="1035.0" y="270.6" font-size="16.5" fill="#14181d" text-anchor="middle" font-weight="700">使われ方</text><line x1="60.0" y1="290.0" x2="1140.0" y2="290.0" stroke="#e2ded4" stroke-width="1"/><text x="85.0" y="324.6" font-size="16.5" fill="#14181d" text-anchor="middle">A</text><text x="255.0" y="324.6" font-size="16.5" fill="#14181d" text-anchor="middle">焦点距離の2倍より遠い</text><text x="475.0" y="324.6" font-size="16.5" fill="#14181d" text-anchor="middle">実像</text><text x="645.0" y="324.6" font-size="16.5" fill="#14181d" text-anchor="middle">上下左右が逆</text><text x="835.0" y="324.6" font-size="16.5" fill="#14181d" text-anchor="middle">物体より小さい</text><text x="1035.0" y="324.6" font-size="16.5" fill="#14181d" text-anchor="middle">カメラ</text><rect x="61" y="344" width="1078" height="54" fill="#f7f5ef"/><line x1="60.0" y1="344.0" x2="1140.0" y2="344.0" stroke="#e2ded4" stroke-width="1"/><text x="85.0" y="378.6" font-size="16.5" fill="#14181d" text-anchor="middle">B</text><text x="255.0" y="378.6" font-size="16.5" fill="#14181d" text-anchor="middle">焦点距離の2倍</text><text x="475.0" y="378.6" font-size="16.5" fill="#14181d" text-anchor="middle">実像</text><text x="645.0" y="378.6" font-size="16.5" fill="#14181d" text-anchor="middle">上下左右が逆</text><text x="835.0" y="378.6" font-size="16.5" fill="#14181d" text-anchor="middle">物体と同じ</text><text x="1035.0" y="378.6" font-size="16.5" fill="#14181d" text-anchor="middle">—</text><line x1="60.0" y1="398.0" x2="1140.0" y2="398.0" stroke="#e2ded4" stroke-width="1"/><text x="85.0" y="432.6" font-size="16.5" fill="#14181d" text-anchor="middle">C</text><text x="255.0" y="432.6" font-size="16.5" fill="#14181d" text-anchor="middle">焦点と焦点距離の2倍の間</text><text x="475.0" y="432.6" font-size="16.5" fill="#14181d" text-anchor="middle">実像</text><text x="645.0" y="432.6" font-size="16.5" fill="#14181d" text-anchor="middle">上下左右が逆</text><text x="835.0" y="432.6" font-size="16.5" fill="#14181d" text-anchor="middle">物体より大きい</text><text x="1035.0" y="432.6" font-size="16.5" fill="#14181d" text-anchor="middle">プロジェクター</text><rect x="61" y="452" width="1078" height="54" fill="#f7f5ef"/><line x1="60.0" y1="452.0" x2="1140.0" y2="452.0" stroke="#e2ded4" stroke-width="1"/><text x="85.0" y="486.6" font-size="16.5" fill="#14181d" text-anchor="middle">D</text><text x="255.0" y="486.6" font-size="16.5" fill="#14181d" text-anchor="middle">焦点</text><text x="475.0" y="486.6" font-size="16.5" fill="#14181d" text-anchor="middle">像はできない</text><text x="645.0" y="486.6" font-size="16.5" fill="#14181d" text-anchor="middle">—</text><text x="835.0" y="486.6" font-size="16.5" fill="#14181d" text-anchor="middle">—</text><text x="1035.0" y="486.6" font-size="16.5" fill="#14181d" text-anchor="middle">—</text><line x1="60.0" y1="506.0" x2="1140.0" y2="506.0" stroke="#e2ded4" stroke-width="1"/><text x="85.0" y="540.6" font-size="16.5" fill="#14181d" text-anchor="middle">E</text><text x="255.0" y="540.6" font-size="16.5" fill="#14181d" text-anchor="middle">焦点より近い</text><text x="475.0" y="540.6" font-size="16.5" fill="#14181d" text-anchor="middle">虚像</text><text x="645.0" y="540.6" font-size="16.5" fill="#14181d" text-anchor="middle">物体と同じ向き</text><text x="835.0" y="540.6" font-size="16.5" fill="#14181d" text-anchor="middle">物体より大きい</text><text x="1035.0" y="540.6" font-size="16.5" fill="#14181d" text-anchor="middle">虫めがね</text><text x="48" y="650" font-size="15" fill="#6b6f76">実像はスクリーンにうつる像、虚像はレンズをのぞくと見える像（スクリーンにはうつらない）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>