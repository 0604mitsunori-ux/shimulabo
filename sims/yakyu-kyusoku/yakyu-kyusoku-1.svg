<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">時速140kmの球が本塁に届くまで</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><line x1="70.0" y1="300.0" x2="1130.0" y2="300.0" stroke="#c9bfa6" stroke-width="3"/><rect x="88.0" y="296.0" width="44.0" height="8.0" rx="2" fill="#ffffff" stroke="#14181d" stroke-width="1.6"/><text x="110.0" y="334.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">投手板</text><path d="M1072,294 h36 v8 l-18,10 l-18,-10z" fill="#ffffff" stroke="#14181d" stroke-width="1.6"/><text x="1090.0" y="340.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">本塁（打者）</text><line x1="110.0" y1="358.0" x2="1090.0" y2="358.0" stroke="#3d434b" stroke-width="1.4"/><line x1="110.0" y1="350.0" x2="110.0" y2="366.0" stroke="#3d434b" stroke-width="1.4"/><line x1="1090.0" y1="350.0" x2="1090.0" y2="366.0" stroke="#3d434b" stroke-width="1.4"/><text x="600.0" y="384.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">18.44m</text><circle cx="110.0" cy="254.0" r="9.0" fill="#ffffff" stroke="#c4442b" stroke-width="2"/><line x1="110.0" y1="266.0" x2="110.0" y2="294.0" stroke="#e2ded4" stroke-width="1.2"/><text x="110.0" y="232.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">0.0秒</text><text x="110.0" y="322.0" font-size="14" fill="#6b6f76" text-anchor="middle"></text><circle cx="316.7" cy="254.0" r="9.0" fill="#ffffff" stroke="#c4442b" stroke-width="2"/><line x1="316.7" y1="266.0" x2="316.7" y2="294.0" stroke="#e2ded4" stroke-width="1.2"/><text x="316.7" y="232.0" font-size="16" fill="#14181d" text-anchor="middle">0.1秒</text><text x="316.7" y="322.0" font-size="14" fill="#6b6f76" text-anchor="middle">3.9m</text><circle cx="523.4" cy="254.0" r="9.0" fill="#ffffff" stroke="#c4442b" stroke-width="2"/><line x1="523.4" y1="266.0" x2="523.4" y2="294.0" stroke="#e2ded4" stroke-width="1.2"/><text x="523.4" y="232.0" font-size="16" fill="#14181d" text-anchor="middle">0.2秒</text><text x="523.4" y="322.0" font-size="14" fill="#6b6f76" text-anchor="middle">7.8m</text><circle cx="730.0" cy="254.0" r="9.0" fill="#ffffff" stroke="#c4442b" stroke-width="2"/><line x1="730.0" y1="266.0" x2="730.0" y2="294.0" stroke="#e2ded4" stroke-width="1.2"/><text x="730.0" y="232.0" font-size="16" fill="#14181d" text-anchor="middle">0.3秒</text><text x="730.0" y="322.0" font-size="14" fill="#6b6f76" text-anchor="middle">11.7m</text><circle cx="936.7" cy="254.0" r="9.0" fill="#ffffff" stroke="#c4442b" stroke-width="2"/><line x1="936.7" y1="266.0" x2="936.7" y2="294.0" stroke="#e2ded4" stroke-width="1.2"/><text x="936.7" y="232.0" font-size="16" fill="#14181d" text-anchor="middle">0.4秒</text><text x="936.7" y="322.0" font-size="14" fill="#6b6f76" text-anchor="middle">15.6m</text><circle cx="1090.0" cy="254.0" r="9.0" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="1090.0" y="232.0" font-size="18" fill="#c4442b" text-anchor="middle" font-weight="700">0.47秒</text><text x="1090.0" y="208.0" font-size="16" fill="#c4442b" text-anchor="middle" font-weight="700">到着</text><text x="110.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">時速140kmの球（0.1秒ごとの位置）</text><text x="110.0" y="432.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">投げてから届くまでの 0.47秒</text><rect x="110.0" y="456.0" width="566.6" height="40.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><rect x="676.6" y="456.0" width="413.4" height="40.0" rx="4" fill="#fbeae6" stroke="#c4442b" stroke-width="1.4"/><text x="393.3" y="482.0" font-size="16" fill="#1b4a63" text-anchor="middle" font-weight="700">判断に使える時間 約0.27秒</text><text x="883.3" y="482.0" font-size="16" fill="#c4442b" text-anchor="middle" font-weight="700">反応 約0.2秒</text><text x="110.0" y="532.0" font-size="16" fill="#3d434b" text-anchor="start">人は見てから体が動き出すまでに約0.2秒かかる。投げてから約0.27秒（球が残り約7.8m）までに</text><text x="110.0" y="557.6" font-size="16" fill="#3d434b" text-anchor="start">打つかどうかを決めないと、体が動き出す前にボールが届いてしまう。だから打者は「予測」して振る。</text><rect x="760.0" y="108.0" width="392.0" height="76.0" rx="10" fill="#f6eedc" stroke="#a97a24" stroke-width="1.2"/><text x="778.0" y="138.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">秒速 ＝ 140 ÷ 3.6 ＝ 38.9 m/s</text><text x="778.0" y="168.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">到達時間 ＝ 18.44 ÷ 38.9 ＝ 0.47秒</text><text x="48" y="650" font-size="15" fill="#6b6f76">変化球や、投手がボールを離す位置（投手板より前）は考えない単純計算。シミュの計算と同じ。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>