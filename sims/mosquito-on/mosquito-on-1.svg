<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">モスキート音：聞こえた最高の音と聴力年齢の目安</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="104.0" width="500.0" height="236.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="70.0" y="138.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">このページのテストのしかた</text><circle cx="84.0" cy="170.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="84.0" y="175.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="106.0" y="176.0" font-size="15.5" fill="#14181d" text-anchor="start">8kHz から始めて、10→12→14→15→16</text><text x="106.0" y="197.7" font-size="15.5" fill="#14181d" text-anchor="start">→17→18→19→20kHz と高くしていく（1回2秒）</text><circle cx="84.0" cy="226.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="84.0" y="231.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="106.0" y="232.0" font-size="15.5" fill="#14181d" text-anchor="start">聞こえたら「聞こえた」で次の音へ。</text><text x="106.0" y="253.7" font-size="15.5" fill="#14181d" text-anchor="start">聞こえなければ、そこで終わり</text><circle cx="84.0" cy="282.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="84.0" y="287.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="106.0" y="288.0" font-size="15.5" fill="#14181d" text-anchor="start">最後に「聞こえた」音の高さで、</text><text x="106.0" y="309.7" font-size="15.5" fill="#14181d" text-anchor="start">聴力年齢の目安を出す（右の表）</text><rect x="48.0" y="354.0" width="500.0" height="104.0" rx="12" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="70.0" y="386.0" font-size="18" fill="#1b4a63" text-anchor="start" font-weight="700">人の耳と高い音</text><text x="70.0" y="416.0" font-size="15.5" fill="#14181d" text-anchor="start">人が聞こえる音の高さは およそ20Hz〜20kHz。</text><text x="70.0" y="438.5" font-size="15.5" fill="#14181d" text-anchor="start">年齢とともに、高い音の側から聞こえにくくなる。</text><rect x="48.0" y="472.0" width="500.0" height="144.0" rx="12" fill="#fbeae6" stroke="#c4442b" stroke-width="1.4"/><text x="70.0" y="504.0" font-size="18" fill="#c4442b" text-anchor="start" font-weight="700">※ 医療の診断ではありません</text><text x="70.0" y="534.0" font-size="15.5" fill="#14181d" text-anchor="start">あくまで簡易的な目安。聞こえに不安があるときは</text><text x="70.0" y="556.5" font-size="15.5" fill="#14181d" text-anchor="start">耳鼻咽喉科を受診する。音量は小さめから始める。</text><text x="70.0" y="579.0" font-size="15.5" fill="#14181d" text-anchor="start">スピーカーは高い音が出にくいので、イヤホン推奨。</text><text x="590.0" y="126.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">聞こえた最高の音 → 聴力年齢の目安</text><rect x="590" y="146" width="562" height="44" fill="#f2efe7"/><text x="668.0" y="174.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">20 kHz</text><rect x="680" y="157" width="270.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="175.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">10代並み</text><text x="668.0" y="218.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">19 kHz</text><rect x="680" y="201" width="256.5" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="219.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">10代並み</text><rect x="590" y="234" width="562" height="44" fill="#f2efe7"/><text x="668.0" y="262.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">18 kHz</text><rect x="680" y="245" width="243.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="263.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">24歳以下</text><text x="668.0" y="306.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">17 kHz</text><rect x="680" y="289" width="229.5" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="307.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">24歳以下</text><rect x="590" y="322" width="562" height="44" fill="#f2efe7"/><text x="668.0" y="350.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">16 kHz</text><rect x="680" y="333" width="216.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="351.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">20代後半</text><text x="668.0" y="394.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">15 kHz</text><rect x="680" y="377" width="202.5" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="395.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">30代</text><rect x="590" y="410" width="562" height="44" fill="#f2efe7"/><text x="668.0" y="438.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">14 kHz</text><rect x="680" y="421" width="189.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="439.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">40代</text><text x="668.0" y="482.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">12 kHz</text><rect x="680" y="465" width="162.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="483.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">40代後半</text><rect x="590" y="498" width="562" height="44" fill="#f2efe7"/><text x="668.0" y="526.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">10 kHz</text><rect x="680" y="509" width="135.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="527.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">50代</text><text x="668.0" y="570.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">8 kHz</text><rect x="680" y="553" width="108.0" height="22" rx="3" fill="#2c6b86"/><text x="968.0" y="571.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">60歳以上</text><line x1="680.0" y1="146.0" x2="680.0" y2="586.0" stroke="#3d434b" stroke-width="1.4"/><text x="950.0" y="608.0" font-size="14" fill="#6b6f76" text-anchor="end">棒の長さ＝音の高さ（0〜20kHz）</text><text x="48" y="650" font-size="15" fill="#6b6f76">このシミュの判定表（簡易な目安）。聞こえ方はイヤホン・音量・まわりの音でも変わる。医療の診断ではない。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>