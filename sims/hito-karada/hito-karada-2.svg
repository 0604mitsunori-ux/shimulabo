<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">呼吸・消化と吸収・心臓の働き（まとめ）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="100.0" width="352.0" height="516.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="100" width="352" height="6" rx="3" fill="#2c6b86"/><text x="66.0" y="138.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">① 呼吸（肺）</text><text x="66.0" y="170.0" font-size="15" fill="#3d434b" text-anchor="start">肺胞で、酸素が血液にとりこまれ、</text><text x="66.0" y="192.5" font-size="15" fill="#3d434b" text-anchor="start">二酸化炭素が肺胞に出される。</text><text x="66.0" y="250.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">吸う空気</text><rect x="66" y="262" width="210.0" height="20" rx="3" fill="#a97a24"/><text x="284.0" y="278.0" font-size="15" fill="#a97a24" text-anchor="start" font-weight="700">酸素 約21%</text><rect x="66" y="290" width="2.5" height="20" rx="2" fill="#3d434b"/><text x="76.5" y="306.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">二酸化炭素 約0.04%</text><text x="66.0" y="362.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">はいた空気</text><rect x="66" y="374" width="170.0" height="20" rx="3" fill="#a97a24"/><text x="244.0" y="390.0" font-size="15" fill="#a97a24" text-anchor="start" font-weight="700">酸素 約17%</text><rect x="66" y="402" width="40.0" height="20" rx="2" fill="#3d434b"/><text x="114.0" y="418.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">二酸化炭素 約4%</text><text x="66.0" y="468.0" font-size="15" fill="#6b6f76" text-anchor="start">残りはおもにちっ素（約78%）</text><line x1="66.0" y1="492.0" x2="382.0" y2="492.0" stroke="#e2ded4" stroke-width="1.2"/><text x="66.0" y="522.0" font-size="15" fill="#14181d" text-anchor="start">1分間に出入りする空気（安静時）</text><text x="66.0" y="544.5" font-size="15" fill="#14181d" text-anchor="start">15回 × 500mL ＝ 7.5L</text><text x="66.0" y="567.0" font-size="15" fill="#14181d" text-anchor="start">とりこむ酸素：7.5L ×（21%−17%）</text><text x="66.0" y="589.5" font-size="15" fill="#14181d" text-anchor="start">　＝ 約300mL</text><rect x="424.0" y="100.0" width="352.0" height="516.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="424" y="100" width="352" height="6" rx="3" fill="#a97a24"/><text x="442.0" y="138.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">② 消化と吸収</text><text x="442.0" y="172.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">口→食道→胃→小腸→大腸→こう門</text><rect x="438.0" y="190.0" width="324.0" height="54.0" rx="8" fill="#f7f5ef" stroke="none" stroke-width="0"/><text x="448.0" y="212.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">デンプン → ブドウ糖</text><text x="448.0" y="234.0" font-size="14" fill="#3d434b" text-anchor="start">だ液・すい液のアミラーゼ、小腸の壁</text><rect x="438.0" y="252.0" width="324.0" height="54.0" rx="8" fill="#f7f5ef" stroke="none" stroke-width="0"/><text x="448.0" y="274.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">タンパク質 → アミノ酸</text><text x="448.0" y="296.0" font-size="14" fill="#3d434b" text-anchor="start">胃液のペプシン、すい液のトリプシン、小腸の壁</text><rect x="438.0" y="314.0" width="324.0" height="54.0" rx="8" fill="#f7f5ef" stroke="none" stroke-width="0"/><text x="448.0" y="336.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">脂肪 → 脂肪酸とモノグリセリド</text><text x="448.0" y="358.0" font-size="14" fill="#3d434b" text-anchor="start">胆汁が細かくし、すい液のリパーゼが分解</text><text x="442.0" y="416.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">小腸の柔毛から吸収する</text><text x="442.0" y="444.0" font-size="15" fill="#3d434b" text-anchor="start">・ブドウ糖・アミノ酸 → 毛細血管</text><text x="442.0" y="466.5" font-size="15" fill="#3d434b" text-anchor="start">　→ 肝臓を通って全身へ</text><text x="442.0" y="489.0" font-size="15" fill="#3d434b" text-anchor="start">・脂肪酸とモノグリセリド → 柔毛の中で</text><text x="442.0" y="511.5" font-size="15" fill="#3d434b" text-anchor="start">　再び脂肪になり、リンパ管へ</text><text x="442.0" y="534.0" font-size="15" fill="#3d434b" text-anchor="start">・水分はおもに小腸で吸収（大腸でも）</text><rect x="800.0" y="100.0" width="352.0" height="516.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="800" y="100" width="352" height="6" rx="3" fill="#c4442b"/><text x="818.0" y="138.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">③ 心臓が送り出す血液の量</text><text x="818.0" y="172.0" font-size="15" fill="#3d434b" text-anchor="start">1分間に送り出す量</text><text x="818.0" y="194.5" font-size="15" fill="#3d434b" text-anchor="start">＝ 心拍数 × 1回に送り出す量</text><text x="818.0" y="238.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">安静時（おとなの目安）</text><text x="818.0" y="268.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">70回 × 70mL ＝ 4,900mL</text><text x="818.0" y="304.0" font-size="24" fill="#c4442b" text-anchor="start" font-weight="700">≒ 約4.9L（1分間）</text><text x="818.0" y="348.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">運動中（ジョギングくらい）</text><text x="818.0" y="376.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">130回 × 100mL ＝ 約13L</text><line x1="818.0" y1="400.0" x2="1134.0" y2="400.0" stroke="#e2ded4" stroke-width="1.2"/><text x="818.0" y="430.0" font-size="15" fill="#3d434b" text-anchor="start">1日では 約7,056L（安静時）</text><text x="818.0" y="452.5" font-size="15" fill="#3d434b" text-anchor="start">＝ 200Lのドラム缶 約35本分</text><text x="818.0" y="475.0" font-size="15" fill="#3d434b" text-anchor="start">体の血液は約5Lなので、安静時は</text><text x="818.0" y="497.5" font-size="15" fill="#3d434b" text-anchor="start">約1分で、体の血液と同じくらいの</text><text x="818.0" y="520.0" font-size="15" fill="#3d434b" text-anchor="start">量が心臓から送り出されている。</text><text x="818.0" y="542.5" font-size="15" fill="#3d434b" text-anchor="start">心臓が1回ちぢむと、手首の脈が1回ふれる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">数値はおとなの目安（年齢・体格・体調で変わる）。学習用で、医療的な判断には使えない。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>