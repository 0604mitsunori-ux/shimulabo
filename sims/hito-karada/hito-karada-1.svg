#fff"/><polygon points="219.0,320.0 201.0,327.0 201.0,313.0" fill="#fff"/><polyline points="393.0,362.0 393.0,258.0 260.0,258.0 260.0,196.0" fill="none" stroke="#2c6b86" stroke-width="12" stroke-linejoin="round"/><polygon points="393.0,301.0 400.0,319.0 386.0,319.0" fill="#fff"/><polygon points="317.5,258.0 335.5,251.0 335.5,265.0" fill="#fff"/><polygon points="260.0,218.0 267.0,236.0 253.0,236.0" fill="#fff"/><polyline points="560.0,196.0 560.0,236.0 470.0,236.0 470.0,290.0" fill="none" stroke="#c4442b" stroke-width="12" stroke-linejoin="round"/><polygon points="560.0,225.0 553.0,207.0 567.0,207.0" fill="#fff"/><polygon points="506.0,236.0 524.0,229.0 524.0,243.0" fill="#fff"/><polygon points="470.0,272.0 463.0,254.0 477.0,254.0" fill="#fff"/><polyline points="520.0,405.0 650.0,405.0 650.0,592.0 600.0,592.0" fill="none" stroke="#c4442b" stroke-width="12" stroke-linejoin="round"/><polygon points="594.0,405.0 576.0,412.0 576.0,398.0" fill="#fff"/><polygon points="650.0,507.5 643.0,489.5 657.0,489.5" fill="#fff"/><polygon points="616.0,592.0 634.0,585.0 634.0,599.0" fill="#fff"/><polyline points="160.0,592.0 130.0,592.0" fill="none" stroke="#2c6b86" stroke-width="12" stroke-linejoin="round"/><line x1="330.0" y1="334.0" x2="330.0" y2="384.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><line x1="470.0" y1="334.0" x2="470.0" y2="384.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><text x="334.0" y="326.0" font-size="17" fill="#1b4a63" text-anchor="middle" font-weight="700">右心房</text><text x="345.0" y="412.0" font-size="17" fill="#1b4a63" text-anchor="middle" font-weight="700">右心室</text><text x="471.0" y="326.0" font-size="17" fill="#9c3320" text-anchor="middle" font-weight="700">左心房</text><text x="465.0" y="412.0" font-size="17" fill="#9c3320" text-anchor="middle" font-weight="700">左心室</text><rect x="160.0" y="534.0" width="440.0" height="82.0" rx="16" fill="#f4f1ea" stroke="#cfc6b4" stroke-width="1.6"/><text x="178.0" y="562.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">全身</text><text x="226.0" y="562.0" font-size="15" fill="#3d434b" text-anchor="start">酸素・養分をわたし、二酸化炭素などを受けとる</text><path d="M170,594 L170.0,594.0 L175.8,587.6 L181.7,585.0 L187.5,587.6 L193.3,594.0 L199.2,600.4 L205.0,603.0 L210.8,600.4 L216.7,594.0 L222.5,587.6 L228.3,585.0 L234.2,587.6 L240.0,594.0 L245.8,600.4 L251.7,603.0 L257.5,600.4 L263.3,594.0 L269.2,587.6 L275.0,585.0 L280.8,587.6 L286.7,594.0 L292.5,600.4 L298.3,603.0 L304.2,600.4 L310.0,594.0 L315.8,587.6 L321.7,585.0 L327.5,587.6 L333.3,594.0 L339.2,600.4 L345.0,603.0 L350.8,600.4 L356.7,594.0 L362.5,587.6 L368.3,585.0 L374.2,587.6 L380.0,594.0 L385.8,600.4 L391.7,603.0 L397.5,600.4 L403.3,594.0 L409.2,587.6 L415.0,585.0 L420.8,587.6 L426.7,594.0 L432.5,600.4 L438.3,603.0 L444.2,600.4 L450.0,594.0 L455.8,587.6 L461.7,585.0 L467.5,587.6 L473.3,594.0 L479.2,600.4 L485.0,603.0 L490.8,600.4 L496.7,594.0 L502.5,587.6 L508.3,585.0 L514.2,587.6 L520.0,594.0 L525.8,600.4 L531.7,603.0 L537.5,600.4 L543.3,594.0 L549.2,587.6 L555.0,585.0 L560.8,587.6 L566.7,594.0 L572.5,600.4 L578.3,603.0 L584.2,600.4 L590.0,594.0" fill="none" stroke="url(#hk-body)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="405.0" y="224.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">肺循環</text><text x="405.0" y="518.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">体循環</text><text x="405.0" y="488.0" font-size="15" fill="#6b6f76" text-anchor="middle">心臓（体の正面から見た図：図の左が体の右）</text><text x="248.0" y="230.0" font-size="17" fill="#1b4a63" text-anchor="end" font-weight="700">肺動脈</text><text x="248.0" y="250.0" font-size="15" fill="#1b4a63" text-anchor="end">静脈血</text><text x="574.0" y="226.0" font-size="17" fill="#9c3320" text-anchor="start" font-weight="700">肺静脈</text><text x="574.0" y="246.0" font-size="15" fill="#9c3320" text-anchor="start">動脈血</text><text x="142.0" y="470.0" font-size="17" fill="#1b4a63" text-anchor="start" font-weight="700">大静脈</text><text x="142.0" y="490.0" font-size="15" fill="#1b4a63" text-anchor="start">静脈血</text><text x="664.0" y="470.0" font-size="17" fill="#9c3320" text-anchor="start" font-weight="700">大動脈</text><text x="664.0" y="490.0" font-size="15" fill="#9c3320" text-anchor="start">動脈血</text><line x1="790.0" y1="116.0" x2="824.0" y2="116.0" stroke="#c4442b" stroke-width="10"/><text x="834.0" y="122.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">動脈血（酸素が多い血液）</text><line x1="790.0" y1="146.0" x2="824.0" y2="146.0" stroke="#2c6b86" stroke-width="10"/><text x="834.0" y="152.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">静脈血（二酸化炭素が多い血液）</text><rect x="790.0" y="172.0" width="362.0" height="170.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="790" y="172" width="362" height="34" rx="8" fill="#eef3f6"/><text x="829.0" y="193.8" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">部屋</text><text x="957.0" y="193.8" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">つながる血管</text><text x="1099.0" y="193.8" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">血液</text><line x1="790.0" y1="206.0" x2="1152.0" y2="206.0" stroke="#e2ded4" stroke-width="1"/><text x="829.0" y="227.8" font-size="15" fill="#14181d" text-anchor="middle">右心房</text><text x="957.0" y="227.8" font-size="15" fill="#14181d" text-anchor="middle">大静脈（全身から）</text><text x="1099.0" y="227.8" font-size="15" fill="#14181d" text-anchor="middle">静脈血</text><rect x="791" y="240" width="360" height="34" fill="#f7f5ef"/><line x1="790.0" y1="240.0" x2="1152.0" y2="240.0" stroke="#e2ded4" stroke-width="1"/><text x="829.0" y="261.8" font-size="15" fill="#14181d" text-anchor="middle">右心室</text><text x="957.0" y="261.8" font-size="15" fill="#14181d" text-anchor="middle">肺動脈（肺へ）</text><text x="1099.0" y="261.8" font-size="15" fill="#14181d" text-anchor="middle">静脈血</text><line x1="790.0" y1="274.0" x2="1152.0" y2="274.0" stroke="#e2ded4" stroke-width="1"/><text x="829.0" y="295.8" font-size="15" fill="#14181d" text-anchor="middle">左心房</text><text x="957.0" y="295.8" font-size="15" fill="#14181d" text-anchor="middle">肺静脈（肺から）</text><text x="1099.0" y="295.8" font-size="15" fill="#14181d" text-anchor="middle">動脈血</text><rect x="791" y="308" width="360" height="34" fill="#f7f5ef"/><line x1="790.0" y1="308.0" x2="1152.0" y2="308.0" stroke="#e2ded4" stroke-width="1"/><text x="829.0" y="329.8" font-size="15" fill="#14181d" text-anchor="middle">左心室</text><text x="957.0" y="329.8" font-size="15" fill="#14181d" text-anchor="middle">大動脈（全身へ）</text><text x="1099.0" y="329.8" font-size="15" fill="#14181d" text-anchor="middle">動脈血</text><text x="790.0" y="370.0" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">肺循環：右心室→肺動脈→肺→肺静脈→左心房</text><text x="790.0" y="396.0" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">体循環：左心室→大動脈→全身→大静脈→右心房</text><rect x="790.0" y="414.0" width="362.0" height="104.0" rx="10" fill="#f6eedc" stroke="#e3d3ad" stroke-width="1.2"/><text x="804.0" y="442.0" font-size="16" fill="#14181d" text-anchor="start">名前は、心臓から出る血管＝動脈、</text><text x="804.0" y="466.0" font-size="16" fill="#14181d" text-anchor="start">心臓にもどる血管＝静脈。だから</text><text x="804.0" y="490.0" font-size="16" fill="#14181d" text-anchor="start">肺動脈には静脈血、肺静脈には動脈血。</text><text x="790.0" y="548.0" font-size="15" fill="#3d434b" text-anchor="start">左心室は全身へ血液を送り出すので、</text><text x="790.0" y="571.2" font-size="15" fill="#3d434b" text-anchor="start">かべの筋肉がいちばん厚い。</text><text x="790.0" y="594.5" font-size="15" fill="#3d434b" text-anchor="start">部屋の出口や静脈には、逆流を防ぐ弁がある。</text><text x="48" y="650" font-size="15" fill="#6b6f76">模式図（大きさ・位置は実際とちがう）。見やすいように動脈血を赤、静脈血を青でかいた（実際の静脈血は暗い赤色）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>