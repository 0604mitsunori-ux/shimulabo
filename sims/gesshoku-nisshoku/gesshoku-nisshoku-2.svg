b" text-anchor="middle">満月・新月が交点の近く</text><circle cx="58.0" cy="562.0" r="7.0" fill="#f4d35e" stroke="#a97a24" stroke-width="1.2"/><text x="72.0" y="567.0" font-size="14" fill="#3d434b" text-anchor="start">満月</text><circle cx="128.0" cy="562.0" r="7.0" fill="#3b3f46" stroke="#fff" stroke-width="1.2"/><text x="142.0" y="567.0" font-size="14" fill="#3d434b" text-anchor="start">新月</text><line x1="194.0" y1="562.0" x2="224.0" y2="562.0" stroke="#2c6b86" stroke-width="1.8"/><text x="230.0" y="567.0" font-size="14" fill="#3d434b" text-anchor="start">月の通り道（公転面より上）</text><line x1="428.0" y1="562.0" x2="458.0" y2="562.0" stroke="#2c6b86" stroke-width="1.8" stroke-dasharray="4 4"/><text x="464.0" y="567.0" font-size="14" fill="#3d434b" text-anchor="start">（公転面より下）</text><text x="48.0" y="592.0" font-size="14" fill="#6b6f76" text-anchor="start">交点＝月の通り道が地球の公転面と交わる所。</text><text x="48.0" y="612.3" font-size="14" fill="#6b6f76" text-anchor="start">通り道のかたむき（実際は約5.1°）は大きくかいた。大きさ・きょりは実際とちがう。</text><text x="752.0" y="130.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">満月・新月のときの上下のずれと食</text><rect x="752.0" y="146.0" width="400.0" height="294.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="752" y="146" width="400" height="42" rx="8" fill="#eef3f6"/><text x="877.0" y="172.9" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">起こる食</text><text x="1077.0" y="172.9" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">ずれ</text><line x1="752.0" y1="188.0" x2="1152.0" y2="188.0" stroke="#e2ded4" stroke-width="1"/><text x="877.0" y="214.9" font-size="15.5" fill="#14181d" text-anchor="middle">皆既月食</text><text x="1077.0" y="214.9" font-size="15.5" fill="#14181d" text-anchor="middle">約0.44°以内</text><rect x="753" y="230" width="398" height="42" fill="#f7f5ef"/><line x1="752.0" y1="230.0" x2="1152.0" y2="230.0" stroke="#e2ded4" stroke-width="1"/><text x="877.0" y="256.9" font-size="15.5" fill="#14181d" text-anchor="middle">部分月食</text><text x="1077.0" y="256.9" font-size="15.5" fill="#14181d" text-anchor="middle">約0.96°以内</text><line x1="752.0" y1="272.0" x2="1152.0" y2="272.0" stroke="#e2ded4" stroke-width="1"/><text x="877.0" y="298.9" font-size="15.5" fill="#14181d" text-anchor="middle">半影月食（ほぼ気づかない）</text><text x="1077.0" y="298.9" font-size="15.5" fill="#14181d" text-anchor="middle">約1.49°以内</text><rect x="753" y="314" width="398" height="42" fill="#f7f5ef"/><line x1="752.0" y1="314.0" x2="1152.0" y2="314.0" stroke="#e2ded4" stroke-width="1"/><text x="877.0" y="340.9" font-size="15.5" fill="#14181d" text-anchor="middle">日食（どこかで部分日食）</text><text x="1077.0" y="340.9" font-size="15.5" fill="#14181d" text-anchor="middle">約1.47°以内</text><line x1="752.0" y1="356.0" x2="1152.0" y2="356.0" stroke="#e2ded4" stroke-width="1"/><text x="877.0" y="382.9" font-size="15.5" fill="#14181d" text-anchor="middle">皆既・金環日食（どこかで）</text><text x="1077.0" y="382.9" font-size="15.5" fill="#14181d" text-anchor="middle">約0.95°以内</text><rect x="753" y="398" width="398" height="42" fill="#f7f5ef"/><line x1="752.0" y1="398.0" x2="1152.0" y2="398.0" stroke="#e2ded4" stroke-width="1"/><text x="877.0" y="424.9" font-size="15.5" fill="#14181d" text-anchor="middle">食は起きない</text><text x="1077.0" y="424.9" font-size="15.5" fill="#14181d" text-anchor="middle">それより大きい</text><text x="752.0" y="468.0" font-size="14" fill="#6b6f76" text-anchor="start">ずれは、地球の中心から見た月の上下のはなれ</text><text x="752.0" y="489.7" font-size="14" fill="#6b6f76" text-anchor="start">（月までの距離が平均のとき。最大で約5.1°）。</text><text x="752.0" y="524.0" font-size="15" fill="#14181d" text-anchor="start">・月の見かけの直径は約0.5°。ずれが月3個分</text><text x="752.0" y="545.8" font-size="15" fill="#14181d" text-anchor="start">　より大きいと、食は起きない。</text><text x="752.0" y="567.5" font-size="15" fill="#14181d" text-anchor="start">・交点の近くで満月・新月になるのは約半年ごと</text><text x="752.0" y="589.2" font-size="15" fill="#14181d" text-anchor="start">　→ 食は年に2回ほどの時期にまとまって起こる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">ふだんの満月・新月は、太陽と地球を結ぶ線の上か下を通るので、食は起きない。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>