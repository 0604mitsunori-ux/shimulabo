<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker><clipPath id="gn-body"><rect x="0" y="96" width="1200" height="528"/></clipPath></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">月食と日食が起こる位置関係</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><g clip-path="url(#gn-body)"><circle cx="-250" cy="365" r="322" fill="#f4d35e" stroke="#a97a24" stroke-width="2"/></g><text x="14.0" y="372.0" font-size="20" fill="#7a5a10" text-anchor="start" font-weight="700">太陽</text><text x="104.0" y="130.0" font-size="20" fill="#c4442b" text-anchor="start" font-weight="700">月食（満月のころ）</text><line x1="84.0" y1="198.0" x2="168.0" y2="198.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><line x1="84.0" y1="236.0" x2="168.0" y2="236.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><line x1="84.0" y1="274.0" x2="168.0" y2="274.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><path d="M430,190 L820,172.6 L820,299.4 L430,282Z" fill="#c9ccd2" opacity=".55"/><path d="M430,190 L820,205.9 L820,266.1 L430,282Z" fill="#3b3f46" opacity=".88"/><circle cx="430.0" cy="236.0" r="46.0" fill="#2f4f6b" stroke="#2f4f6b" stroke-width="0"/><path d="M430.0,190.0 A46,46 0 0 0 430.0,282.0Z" fill="#7fb3d5"/><text x="430.0" y="242.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">地球</text><circle cx="730.0" cy="236.0" r="12.5" fill="#9a3b22" stroke="#f0c9b8" stroke-width="1.4"/><text x="590.0" y="242.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">地球の本影（こい影）</text><line x1="790.0" y1="176.0" x2="806.0" y2="154.0" stroke="#6b6f76" stroke-width="1.2"/><text x="806.0" y="148.0" font-size="15" fill="#3d434b" text-anchor="middle">半影（うすい影）</text><line x1="730.0" y1="250.5" x2="736.0" y2="310.0" stroke="#6b6f76" stroke-width="1.2"/><text x="736.0" y="328.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">月（赤黒く見える）</text><rect x="862.0" y="112.0" width="290.0" height="162.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="876.0" y="142.0" font-size="16" fill="#14181d" text-anchor="start">並び方　太陽－地球－月</text><text x="876.0" y="170.0" font-size="16" fill="#14181d" text-anchor="start">月の形　満月</text><text x="876.0" y="198.0" font-size="16" fill="#14181d" text-anchor="start">月が地球の影に入る</text><text x="876.0" y="226.0" font-size="16" fill="#14181d" text-anchor="start">月が出ていればどこでも見られる</text><text x="876.0" y="254.0" font-size="14.5" fill="#6b6f76" text-anchor="start">本影は月の直径の約2.7倍</text><text x="104.0" y="364.0" font-size="20" fill="#1b4a63" text-anchor="start" font-weight="700">日食（新月のころ）</text><line x1="84.0" y1="434.0" x2="168.0" y2="434.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><line x1="84.0" y1="472.0" x2="168.0" y2="472.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><line x1="84.0" y1="510.0" x2="168.0" y2="510.0" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><path d="M470,459.5 L730,446.6 L730,497.4 L470,484.5Z" fill="#c9ccd2" opacity=".6"/><path d="M470,459.5 L684,472 L470,484.5Z" fill="#3b3f46" opacity=".9"/><circle cx="730.0" cy="472.0" r="46.0" fill="#2f4f6b" stroke="#2f4f6b" stroke-width="0"/><path d="M730.0,426.0 A46,46 0 0 0 730.0,518.0Z" fill="#7fb3d5"/><text x="748.0" y="478.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">地球</text><ellipse cx="690" cy="472" rx="7" ry="23.4" fill="#3b3f46" opacity=".45"/><circle cx="687.0" cy="472.0" r="4.5" fill="#14181d" stroke="#14181d" stroke-width="0"/><circle cx="470.0" cy="472.0" r="12.5" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><path d="M470.0,459.5 A12.535,12.535 0 0 0 470.0,484.5Z" fill="#f4d35e"/><text x="470.0" y="446.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">月（新月）</text><line x1="686.0" y1="478.0" x2="640.0" y2="538.0" stroke="#3d434b" stroke-width="1.2"/><text x="640.0" y="556.0" font-size="15" fill="#14181d" text-anchor="end" font-weight="700">こい影（本影）が届く所 → 皆既日食</text><line x1="688.0" y1="493.4" x2="650.0" y2="574.0" stroke="#3d434b" stroke-width="1.2"/><text x="640.0" y="582.0" font-size="15" fill="#3d434b" text-anchor="end">うすい影（半影）の所 → 部分日食</text><rect x="862.0" y="380.0" width="290.0" height="162.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="876.0" y="410.0" font-size="16" fill="#14181d" text-anchor="start">並び方　太陽－月－地球</text><text x="876.0" y="438.0" font-size="16" fill="#14181d" text-anchor="start">月の形　新月</text><text x="876.0" y="466.0" font-size="16" fill="#14181d" text-anchor="start">月の影が地球に落ちる</text><text x="876.0" y="494.0" font-size="16" fill="#14181d" text-anchor="start">影が通る、限られた所だけ</text><text x="876.0" y="522.0" font-size="14.5" fill="#6b6f76" text-anchor="start">太陽を直接見てはいけない</text><line x1="96.0" y1="344.0" x2="1152.0" y2="344.0" stroke="#e2ded4" stroke-width="1.2"/><text x="1152.0" y="612.0" font-size="14" fill="#6b6f76" text-anchor="end">大きさの比はほぼ実際どおり。きょりは実際とちがう（月までは地球の直径の約30倍）</text><text x="48" y="650" font-size="15" fill="#6b6f76">太陽・地球・月が一直線に並ぶと食が起こる。月食は満月のころ、日食は新月のころ。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>