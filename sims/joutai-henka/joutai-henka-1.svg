t-anchor="middle">（凝縮）</text><text x="342.0" y="176.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">加熱 →</text><text x="858.0" y="176.0" font-size="15" fill="#c4442b" text-anchor="end" font-weight="700">加熱 →</text><text x="342.0" y="378.0" font-size="15" fill="#1b4a63" text-anchor="start" font-weight="700">← 冷却</text><text x="858.0" y="378.0" font-size="15" fill="#1b4a63" text-anchor="end" font-weight="700">← 冷却</text><text x="64.0" y="420.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">並び方</text><text x="114.0" y="420.0" font-size="16" fill="#14181d" text-anchor="start">規則正しく並ぶ</text><text x="64.0" y="450.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">動き</text><text x="114.0" y="450.0" font-size="16" fill="#14181d" text-anchor="start">その場でふるえる（振動）</text><text x="64.0" y="480.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">間隔</text><text x="114.0" y="480.0" font-size="16" fill="#14181d" text-anchor="start">間隔はせまい</text><text x="469.0" y="420.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">並び方</text><text x="519.0" y="420.0" font-size="16" fill="#14181d" text-anchor="start">並び方がくずれる</text><text x="469.0" y="450.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">動き</text><text x="519.0" y="450.0" font-size="16" fill="#14181d" text-anchor="start">位置を入れかえて動き回る</text><text x="469.0" y="480.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">間隔</text><text x="519.0" y="480.0" font-size="16" fill="#14181d" text-anchor="start">間隔は固体とあまり変わらない</text><text x="874.0" y="420.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">並び方</text><text x="924.0" y="420.0" font-size="16" fill="#14181d" text-anchor="start">ばらばらに離れる</text><text x="874.0" y="450.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">動き</text><text x="924.0" y="450.0" font-size="16" fill="#14181d" text-anchor="start">空間を自由に飛び回る</text><text x="874.0" y="480.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">間隔</text><text x="924.0" y="480.0" font-size="16" fill="#14181d" text-anchor="start">間隔はとても広い</text><text x="64.0" y="512.0" font-size="15" fill="#1b4a63" text-anchor="start" font-weight="700">水が氷になると体積は約1.1倍</text><text x="469.0" y="512.0" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">粒子の数はどれも18個（同じ）</text><text x="874.0" y="512.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">水が水蒸気になると約1,700倍（100℃）</text><rect x="60.0" y="538.0" width="1080.0" height="64.0" rx="10" fill="#fbeae6" stroke="#fbeae6" stroke-width="1.2"/><text x="600.0" y="566.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">状態が変わっても、粒子の数（＝質量）は変わらない。</text><text x="600.0" y="590.0" font-size="16" fill="#3d434b" text-anchor="middle">変わるのは、粒子の並び方・間隔・動き。だから体積が変わる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">粒子の大きさ・数は模式的。温度が高いほど粒子の動きは激しくなる。体積の倍率は液体の水を1としたとき。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>