<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">同じ大きさでも、物によって重さはちがう</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="60.0" y="130.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">どれも同じ大きさ</text><path d="M110,175 l26,-26 h86 l-26,26z" fill="#efe9dc" stroke="#3d434b" stroke-width="1.6"/><path d="M196,175 l26,-26 v86 l-26,26z" fill="#ddd5c4" stroke="#3d434b" stroke-width="1.6"/><rect x="110" y="175" width="86" height="86" fill="#f6f1e6" stroke="#3d434b" stroke-width="1.6"/><text x="153.0" y="285.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">3cm</text><text x="100.0" y="224.0" font-size="16" fill="#14181d" text-anchor="end" font-weight="700">3cm</text><text x="232.0" y="184.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">3cm</text><text x="60.0" y="318.0" font-size="16" fill="#3d434b" text-anchor="start">1辺3cmの立方体</text><text x="60.0" y="360.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">てんびんでくらべる</text><rect x="125" y="536" width="160" height="10" rx="4" fill="#3d434b"/><rect x="199" y="470" width="12" height="66" fill="#6b6f76"/><line x1="88.5" y1="451.2" x2="321.5" y2="488.8" stroke="#14181d" stroke-width="7"/><rect x="85.50718056167602" y="429.20045161951896" width="6" height="22" fill="#6b6f76"/><rect x="46.5" y="423.2" width="84.0" height="7.0" rx="3" fill="#d9d5cc" stroke="#3d434b" stroke-width="1.2"/><rect x="66.5" y="379.2" width="44.0" height="44.0" rx="3" fill="#e7c08a" stroke="#3d434b" stroke-width="1.4"/><text x="88.5" y="408.2" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">木</text><rect x="318.492819438324" y="466.79954838048104" width="6" height="22" fill="#6b6f76"/><rect x="279.5" y="460.8" width="84.0" height="7.0" rx="3" fill="#d9d5cc" stroke="#3d434b" stroke-width="1.2"/><rect x="299.5" y="416.8" width="44.0" height="44.0" rx="3" fill="#8a9099" stroke="#3d434b" stroke-width="1.4"/><text x="321.5" y="445.8" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">鉄</text><circle cx="205.0" cy="470.0" r="5.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="60.0" y="588.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">鉄の方が下がる → 鉄の方が重い</text><text x="430.0" y="130.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">1辺3cmの立方体の重さ（重いじゅん）</text><text x="588.0" y="177.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">どう</text><rect x="600.0" y="156.0" width="435.4" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="1045.4" y="178.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">241.9 g</text><text x="588.0" y="227.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">鉄</text><rect x="600.0" y="206.0" width="382.5" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="992.5" y="228.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">212.5 g</text><text x="588.0" y="277.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">アルミニウム</text><rect x="600.0" y="256.0" width="131.2" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="741.2" y="278.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">72.9 g</text><text x="588.0" y="327.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">ガラス</text><rect x="600.0" y="306.0" width="121.5" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="731.5" y="328.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">67.5 g</text><text x="588.0" y="377.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">ゴム</text><rect x="600.0" y="356.0" width="63.2" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="673.2" y="378.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">35.1 g</text><text x="588.0" y="427.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">プラスチック</text><rect x="600.0" y="406.0" width="57.8" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="667.8" y="428.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">32.1 g</text><text x="588.0" y="477.0" font-size="17" fill="#14181d" text-anchor="end" font-weight="700">木</text><rect x="600.0" y="456.0" width="24.3" height="30.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="634.3" y="478.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">13.5 g</text><line x1="600.0" y1="150.0" x2="600.0" y2="504.0" stroke="#14181d" stroke-width="1.6"/><line x1="600.0" y1="504.0" x2="1060.0" y2="504.0" stroke="#14181d" stroke-width="1.6"/><line x1="600.0" y1="504.0" x2="600.0" y2="510.0" stroke="#14181d" stroke-width="1.4"/><text x="600.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="middle">0</text><line x1="690.0" y1="504.0" x2="690.0" y2="510.0" stroke="#14181d" stroke-width="1.4"/><text x="690.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="middle">50</text><line x1="780.0" y1="504.0" x2="780.0" y2="510.0" stroke="#14181d" stroke-width="1.4"/><text x="780.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="middle">100</text><line x1="870.0" y1="504.0" x2="870.0" y2="510.0" stroke="#14181d" stroke-width="1.4"/><text x="870.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="middle">150</text><line x1="960.0" y1="504.0" x2="960.0" y2="510.0" stroke="#14181d" stroke-width="1.4"/><text x="960.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="middle">200</text><line x1="1050.0" y1="504.0" x2="1050.0" y2="510.0" stroke="#14181d" stroke-width="1.4"/><text x="1050.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="middle">250</text><text x="1066.0" y="528.0" font-size="14" fill="#3d434b" text-anchor="start">g</text><text x="430.0" y="570.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">どうは木の約18倍、鉄は木の約16倍の重さ。</text><text x="430.0" y="600.0" font-size="15.5" fill="#3d434b" text-anchor="start">プラスチックとゴム、ガラスとアルミニウムは手で持つとわかりにくい → てんびんやはかりで。</text><text x="48" y="650" font-size="15" fill="#6b6f76">重さは、1cm³あたりの重さ（理科年表など）から計算しためやす。木は種類によってちがう（ここでは0.5 g）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>