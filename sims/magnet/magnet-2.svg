.1 L447.8,289.5 L438.3,296.2Z" fill="#ffffff" stroke="#3d434b" stroke-width="1"/><line x1="461.7" y1="263.8" x2="483.7" y2="237.8" stroke="#6b6f76" stroke-width="1.2"/><text x="487.7" y="211.8" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">日本の方位磁針</text><text x="487.7" y="233.8" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">N極は北をさす</text><text x="720.0" y="132.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">地球は大きな磁石</text><text x="720.0" y="172.0" font-size="16" fill="#14181d" text-anchor="start">方位磁針のN極が北をさすのは、</text><text x="720.0" y="196.8" font-size="16" fill="#14181d" text-anchor="start">地球の北極の近くに、磁石としての</text><text x="720.0" y="221.6" font-size="16" fill="#14181d" text-anchor="start">S極があるから（N極とS極は引き合う）。</text><rect x="720.0" y="270.0" width="432.0" height="166.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="738.0" y="304.0" font-size="15.5" fill="#3d434b" text-anchor="start">・磁石の向きは、地軸から少しかたむいている。</text><text x="738.0" y="329.6" font-size="15.5" fill="#3d434b" text-anchor="start">・日本では、方位磁針の北が真北から</text><text x="738.0" y="355.1" font-size="15.5" fill="#3d434b" text-anchor="start">　西へ約7〜9°ずれる（偏角）。</text><text x="738.0" y="380.7" font-size="15.5" fill="#3d434b" text-anchor="start">・磁極は毎年少しずつ動き、数十万年</text><text x="738.0" y="406.3" font-size="15.5" fill="#3d434b" text-anchor="start">　ごとに南北が入れかわることもある。</text><text x="720.0" y="478.0" font-size="15.5" fill="#14181d" text-anchor="start">地球のまわりの磁力線も、</text><text x="720.0" y="502.0" font-size="15.5" fill="#14181d" text-anchor="start">南極側（磁石のN極）から出て、</text><text x="720.0" y="526.0" font-size="15.5" fill="#14181d" text-anchor="start">北極側（磁石のS極）に入る。</text><text x="48" y="650" font-size="15" fill="#6b6f76">地球の中の棒磁石は、磁界の向きを表す模式図（大きさ・かたむきは実際とちがう）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>