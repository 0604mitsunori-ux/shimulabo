="458.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">1代前（父・母）</text><text x="48.0" y="486.0" font-size="24" fill="#c4442b" text-anchor="start" font-weight="700">2人</text><text x="48.0" y="352.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">2代前（祖父母）</text><text x="48.0" y="380.0" font-size="24" fill="#c4442b" text-anchor="start" font-weight="700">4人</text><text x="48.0" y="246.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">3代前（曾祖父母）</text><text x="48.0" y="274.0" font-size="24" fill="#c4442b" text-anchor="start" font-weight="700">8人</text><text x="48.0" y="142.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">4代前（高祖父母）</text><text x="48.0" y="170.0" font-size="24" fill="#c4442b" text-anchor="start" font-weight="700">16人</text><text x="565.0" y="110.0" font-size="15" fill="#6b6f76" text-anchor="middle">↑ さらにさかのぼると、1代ごとに2倍に増えていく</text><rect x="880.0" y="104.0" width="272.0" height="492.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="902.0" y="140.0" font-size="17" fill="#3d434b" text-anchor="start" font-weight="700">n代前のご先祖</text><text x="902.0" y="190.0" font-size="38" fill="#c4442b" text-anchor="start" font-weight="700"><tspan>＝ 2</tspan><tspan dy="-16.0" font-size="23.6">n</tspan><tspan dy="16.0" font-size="38"> 人</tspan></text><text x="902.0" y="220.0" font-size="15" fill="#6b6f76" text-anchor="start">（2をn回かけた数）</text><line x1="900.0" y1="244.0" x2="1132.0" y2="244.0" stroke="#e2ded4" stroke-width="1.4"/><text x="902.0" y="276.0" font-size="17" fill="#3d434b" text-anchor="start" font-weight="700">1代前〜n代前の合計</text><text x="902.0" y="320.0" font-size="30" fill="#2c6b86" text-anchor="start" font-weight="700"><tspan>＝ 2</tspan><tspan dy="-12.6" font-size="18.6">n+1</tspan><tspan dy="12.6" font-size="30"> − 2 人</tspan></text><line x1="900.0" y1="346.0" x2="1132.0" y2="346.0" stroke="#e2ded4" stroke-width="1.4"/><text x="902.0" y="380.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">例：10代前（約300年前）</text><text x="902.0" y="418.0" font-size="16" fill="#3d434b" text-anchor="start">その代</text><text x="1130.0" y="418.0" font-size="22" fill="#c4442b" text-anchor="end" font-weight="700">1,024人</text><text x="902.0" y="454.0" font-size="16" fill="#3d434b" text-anchor="start">1〜10代前の合計</text><text x="1130.0" y="454.0" font-size="22" fill="#2c6b86" text-anchor="end" font-weight="700">2,046人</text><text x="902.0" y="490.0" font-size="16" fill="#3d434b" text-anchor="start">あなたを入れると</text><text x="1130.0" y="490.0" font-size="22" fill="#14181d" text-anchor="end" font-weight="700">2,047人</text><line x1="900.0" y1="514.0" x2="1132.0" y2="514.0" stroke="#e2ded4" stroke-width="1.4"/><text x="902.0" y="544.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">20代前 → 約104万人</text><text x="902.0" y="576.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">30代前 → 約10.7億人</text><rect x="692.0" y="558.0" width="16" height="16" rx="3" fill="#2c6b86"/><text x="714.0" y="571.0" font-size="14" fill="#3d434b" text-anchor="start">男性</text><circle cx="770.0" cy="566.0" r="8.0" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="784.0" y="571.0" font-size="14" fill="#3d434b" text-anchor="start">女性</text><text x="48" y="650" font-size="15" fill="#6b6f76">理論上の数。実際は同じ人が何度も登場する（祖先の共有）ため、ご先祖はもっと少なくなる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>