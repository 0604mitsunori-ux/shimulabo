<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">ご先祖の人数 早見表（5代前〜30代前）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="50.0" y="104.0" width="1100.0" height="468.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="50" y="104" width="1100" height="48" rx="10" fill="#eef3f6"/><text x="120.0" y="135.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">世代</text><text x="335.0" y="135.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">その代のご先祖</text><text x="605.0" y="135.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">1代前からの合計</text><text x="865.0" y="135.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">何年前（1世代30年）</text><text x="1075.0" y="135.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">時代の目安</text><line x1="50.0" y1="152.0" x2="1150.0" y2="152.0" stroke="#e2ded4" stroke-width="1"/><text x="120.0" y="195.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">5代前</text><text x="335.0" y="196.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">32人</text><text x="605.0" y="195.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">62人</text><text x="865.0" y="189.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">約150年前</text><text x="865.0" y="212.0" font-size="15" fill="#3d434b" text-anchor="middle">（西暦1876年ごろ）</text><text x="1075.0" y="195.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">幕末〜明治</text><rect x="51" y="222" width="1098" height="70" fill="#f7f5ef"/><line x1="50.0" y1="222.0" x2="1150.0" y2="222.0" stroke="#e2ded4" stroke-width="1"/><text x="120.0" y="265.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">10代前</text><text x="335.0" y="266.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">1,024人</text><text x="605.0" y="265.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">2,046人</text><text x="865.0" y="259.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">約300年前</text><text x="865.0" y="282.0" font-size="15" fill="#3d434b" text-anchor="middle">（西暦1726年ごろ）</text><text x="1075.0" y="265.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">江戸中期</text><line x1="50.0" y1="292.0" x2="1150.0" y2="292.0" stroke="#e2ded4" stroke-width="1"/><text x="120.0" y="335.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">15代前</text><text x="335.0" y="336.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">32,768人</text><text x="605.0" y="335.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">65,534人</text><text x="865.0" y="329.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">約450年前</text><text x="865.0" y="352.0" font-size="15" fill="#3d434b" text-anchor="middle">（西暦1576年ごろ）</text><text x="1075.0" y="335.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">戦国</text><rect x="51" y="362" width="1098" height="70" fill="#f7f5ef"/><line x1="50.0" y1="362.0" x2="1150.0" y2="362.0" stroke="#e2ded4" stroke-width="1"/><text x="120.0" y="405.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">20代前</text><text x="335.0" y="399.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">約104万人</text><text x="335.0" y="422.0" font-size="14" fill="#6b6f76" text-anchor="middle">（1,048,576人）</text><text x="605.0" y="399.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">約209万人</text><text x="605.0" y="422.0" font-size="14" fill="#6b6f76" text-anchor="middle">（2,097,150人）</text><text x="865.0" y="399.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">約600年前</text><text x="865.0" y="422.0" font-size="15" fill="#3d434b" text-anchor="middle">（西暦1426年ごろ）</text><text x="1075.0" y="405.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">室町</text><line x1="50.0" y1="432.0" x2="1150.0" y2="432.0" stroke="#e2ded4" stroke-width="1"/><text x="120.0" y="475.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">25代前</text><text x="335.0" y="469.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">約3,355万人</text><text x="335.0" y="492.0" font-size="14" fill="#6b6f76" text-anchor="middle">（33,554,432人）</text><text x="605.0" y="469.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">約6,710万人</text><text x="605.0" y="492.0" font-size="14" fill="#6b6f76" text-anchor="middle">（67,108,862人）</text><text x="865.0" y="469.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">約750年前</text><text x="865.0" y="492.0" font-size="15" fill="#3d434b" text-anchor="middle">（西暦1276年ごろ）</text><text x="1075.0" y="475.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">鎌倉</text><rect x="51" y="502" width="1098" height="70" fill="#f7f5ef"/><line x1="50.0" y1="502.0" x2="1150.0" y2="502.0" stroke="#e2ded4" stroke-width="1"/><text x="120.0" y="545.0" font-size="22" fill="#14181d" text-anchor="middle" font-weight="700">30代前</text><text x="335.0" y="539.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">約10.7億人</text><text x="335.0" y="562.0" font-size="14" fill="#6b6f76" text-anchor="middle">（1,073,741,824人）</text><text x="605.0" y="539.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">約21.5億人</text><text x="605.0" y="562.0" font-size="14" fill="#6b6f76" text-anchor="middle">（2,147,483,646人）</text><text x="865.0" y="539.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">約900年前</text><text x="865.0" y="562.0" font-size="15" fill="#3d434b" text-anchor="middle">（西暦1126年ごろ）</text><text x="1075.0" y="545.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">平安</text><text x="50.0" y="608.0" font-size="16" fill="#3d434b" text-anchor="start">さかのぼるほど当時の人口を超えるのは、同じ人が何度もご先祖として登場する（祖先の共有）ため。</text><text x="48" y="650" font-size="15" fill="#6b6f76">その代＝2のn乗。合計＝1代前からその代までの全員。年数は1世代30年の目安（25年なら少し近くなる）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>