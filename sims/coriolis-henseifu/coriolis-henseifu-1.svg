ize="15" fill="#6a5c82" text-anchor="middle" font-weight="700">玉は進む向きの右へ曲がって見える</text><line x1="516.0" y1="368.0" x2="516.0" y2="244.0" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M516.0,283.7 A84.32000000000001,84.32000000000001 0 0 1 589.0,325.8" fill="none" stroke="#6a5c82" stroke-width="2.4"/><text x="574.1" y="283.8" font-size="17" fill="#6a5c82" text-anchor="middle" font-weight="700">60°</text><text x="516.0" y="232.0" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">受ける人</text><text x="48.0" y="548.0" font-size="15" fill="#14181d" text-anchor="start">1分間に10回転（反時計回り）の円盤（半径1 m）の中心から、秒速1 mで玉を投げる。</text><text x="48.0" y="571.2" font-size="15" fill="#14181d" text-anchor="start">ふちに届くまで1秒 → その間に円盤は 60° 回る → 円盤の上からは右へ60°それて見える。</text><text x="48.0" y="612.0" font-size="15" fill="#6a5c82" text-anchor="start" font-weight="700">円盤の上で見える見かけの力＝コリオリの力（転向力）。</text><rect x="700.0" y="116.0" width="452.0" height="186.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="716.0" y="144.0" font-size="17" fill="#1b4a63" text-anchor="start" font-weight="700">地球の上では</text><text x="716.0" y="172.0" font-size="16" fill="#14181d" text-anchor="start">・北半球：進む向きの右へ曲げる</text><text x="716.0" y="196.8" font-size="16" fill="#14181d" text-anchor="start">・南半球：進む向きの左へ曲げる</text><text x="716.0" y="221.6" font-size="16" fill="#14181d" text-anchor="start">・赤道：0　極：いちばん大きい</text><text x="716.0" y="278.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">C ＝ 2mΩv sinφ ＝ m f v</text><text x="700.0" y="334.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">f ＝ 2Ω sinφ（Ω ＝ 7.29×10⁻⁵ rad/s）</text><rect x="700.0" y="348.0" width="452.0" height="228.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="700" y="348" width="452" height="38" rx="8" fill="#eef3f6"/><text x="775.0" y="372.3" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">緯度φ</text><text x="905.0" y="372.3" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">sinφ</text><text x="1056.0" y="372.3" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">f</text><line x1="700.0" y1="386.0" x2="1152.0" y2="386.0" stroke="#e2ded4" stroke-width="1"/><text x="775.0" y="410.3" font-size="15.5" fill="#14181d" text-anchor="middle">0°（赤道）</text><text x="905.0" y="410.3" font-size="15.5" fill="#14181d" text-anchor="middle">0.000</text><text x="1056.0" y="410.3" font-size="15.5" fill="#14181d" text-anchor="middle">0 /s</text><rect x="701" y="424" width="450" height="38" fill="#f7f5ef"/><line x1="700.0" y1="424.0" x2="1152.0" y2="424.0" stroke="#e2ded4" stroke-width="1"/><text x="775.0" y="448.3" font-size="15.5" fill="#14181d" text-anchor="middle">30°</text><text x="905.0" y="448.3" font-size="15.5" fill="#14181d" text-anchor="middle">0.500</text><text x="1056.0" y="448.3" font-size="15.5" fill="#14181d" text-anchor="middle">7.29×10⁻⁵ /s</text><line x1="700.0" y1="462.0" x2="1152.0" y2="462.0" stroke="#e2ded4" stroke-width="1"/><text x="775.0" y="486.3" font-size="15.5" fill="#14181d" text-anchor="middle">35°</text><text x="905.0" y="486.3" font-size="15.5" fill="#14181d" text-anchor="middle">0.574</text><text x="1056.0" y="486.3" font-size="15.5" fill="#14181d" text-anchor="middle">8.36×10⁻⁵ /s</text><rect x="701" y="500" width="450" height="38" fill="#f7f5ef"/><line x1="700.0" y1="500.0" x2="1152.0" y2="500.0" stroke="#e2ded4" stroke-width="1"/><text x="775.0" y="524.3" font-size="15.5" fill="#14181d" text-anchor="middle">45°</text><text x="905.0" y="524.3" font-size="15.5" fill="#14181d" text-anchor="middle">0.707</text><text x="1056.0" y="524.3" font-size="15.5" fill="#14181d" text-anchor="middle">1.03×10⁻⁴ /s</text><line x1="700.0" y1="538.0" x2="1152.0" y2="538.0" stroke="#e2ded4" stroke-width="1"/><text x="775.0" y="562.3" font-size="15.5" fill="#14181d" text-anchor="middle">90°（極）</text><text x="905.0" y="562.3" font-size="15.5" fill="#14181d" text-anchor="middle">1.000</text><text x="1056.0" y="562.3" font-size="15.5" fill="#14181d" text-anchor="middle">1.46×10⁻⁴ /s</text><text x="48" y="650" font-size="15" fill="#6b6f76">回る円盤や自転する地球の上から見ると、まっすぐ進むものが曲がって見える。北半球では右、南半球では左へ。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>