9" r="4.6" fill="#ffffff" stroke="#2c6b86" stroke-width="1.8"/><line x1="583.7" y1="262.5" x2="531.7" y2="332.5" stroke="#6b6f76" stroke-width="1.2"/><text x="391.7" y="354.5" font-size="15" fill="#3d434b" text-anchor="start">渋滞する一番広い間隔</text><text x="391.7" y="377.7" font-size="15" fill="#3d434b" text-anchor="start">平均74%・渋滞中の車9台</text><text x="609.9" y="259.8" font-size="17" fill="#1b4a63" text-anchor="start" font-weight="700">渋滞しない</text><text x="609.9" y="287.8" font-size="15" fill="#3d434b" text-anchor="start">少し広げただけで</text><text x="609.9" y="311.1" font-size="15" fill="#3d434b" text-anchor="start">平均85%・渋滞中の車0台</text><line x1="292.3" y1="353.8" x2="308.3" y2="389.8" stroke="#6b6f76" stroke-width="1.2"/><text x="312.3" y="405.8" font-size="15" fill="#3d434b" text-anchor="start">はじめの設定：平均48%</text><rect x="830.0" y="108.0" width="322.0" height="300.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="848.0" y="140.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">自然渋滞を防ぐコツ</text><circle cx="858.0" cy="174.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="858.0" y="179.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="880.0" y="180.0" font-size="16.5" fill="#14181d" text-anchor="start" font-weight="700">車間距離を広めにとる</text><text x="880.0" y="206.0" font-size="15" fill="#3d434b" text-anchor="start">ブレーキの連鎖を吸収できる</text><circle cx="858.0" cy="243.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="858.0" y="248.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="880.0" y="249.0" font-size="16.5" fill="#14181d" text-anchor="start" font-weight="700">一定の速度を保つ</text><text x="880.0" y="275.0" font-size="15" fill="#3d434b" text-anchor="start">加減速が少ないほど</text><text x="880.0" y="297.5" font-size="15" fill="#3d434b" text-anchor="start">後ろへ伝わる波が小さい</text><circle cx="858.0" cy="335.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="858.0" y="340.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="880.0" y="341.0" font-size="16.5" fill="#14181d" text-anchor="start" font-weight="700">合流はゆずり合う</text><text x="880.0" y="367.0" font-size="15" fill="#3d434b" text-anchor="start">つめすぎない方が</text><text x="880.0" y="389.5" font-size="15" fill="#3d434b" text-anchor="start">全体の流れは速くなる</text><rect x="830.0" y="424.0" width="322.0" height="104.0" rx="10" fill="#f6eedc" stroke="#a97a24" stroke-width="1.2"/><text x="848.0" y="456.0" font-size="15" fill="#14181d" text-anchor="start">実際の高速道路では、1車線あたり</text><text x="848.0" y="479.2" font-size="15" fill="#14181d" text-anchor="start">1kmに約25台（車間およそ40m）を</text><text x="848.0" y="502.5" font-size="15" fill="#14181d" text-anchor="start">こえると起きやすいとされる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">平均速度は最高速度に対する%（シミュの表示と同じ）。十分に走らせたあとの平均。帯の言葉はスライダー横の表示。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>