 y="549.0" font-size="14.5" fill="#3d434b" text-anchor="middle" font-weight="700">ゆとりがある</text><rect x="636.9" y="528" width="123.1" height="30" fill="#f6f3ec"/><text x="698.5" y="549.0" font-size="14.5" fill="#3d434b" text-anchor="middle" font-weight="700">かなりゆとり</text><text x="440.0" y="588.0" font-size="15" fill="#14181d" text-anchor="middle">スライダー「混雑度（車の間隔）」の位置　　せまい ← → 広い</text><rect x="120" y="160" width="475.9" height="360" fill="#fbeae6" opacity=".55"/><line x1="595.9" y1="160.0" x2="595.9" y2="520.0" stroke="#c4442b" stroke-width="1.6" stroke-dasharray="6 5"/><text x="134.0" y="186.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">渋滞の波ができる</text><polyline points="128.2,396.6 144.6,392.2 161.0,386.5 177.4,381.4 193.8,376.3 210.3,371.2 226.7,366.1 243.1,361.1 259.5,356.0 275.9,350.9 292.3,345.8 308.7,340.8 325.1,335.7 341.5,330.6 357.9,325.5 374.4,320.5 390.8,315.4 407.2,310.3 423.6,305.2 440.0,300.1 456.4,295.0 472.8,289.9 489.2,284.7 505.6,278.8 522.1,274.7 538.5,268.9 554.9,264.7 571.3,259.6 587.7,254.5" fill="none" stroke="#c4442b" stroke-width="2.2" stroke-linejoin="round"/><polyline points="604.1,213.8 620.5,209.5 636.9,205.6 653.3,201.9 669.7,198.5 686.2,195.3 702.6,192.4 719.0,189.7 735.4,187.2 751.8,184.9" fill="none" stroke="#2c6b86" stroke-width="2.2" stroke-linejoin="round"/><rect x="123.7" y="392.1" width="9" height="9" fill="#c4442b"/><rect x="140.1" y="387.7" width="9" height="9" fill="#c4442b"/><rect x="156.5" y="382.0" width="9" height="9" fill="#c4442b"/><rect x="172.9" y="376.9" width="9" height="9" fill="#c4442b"/><rect x="189.3" y="371.8" width="9" height="9" fill="#c4442b"/><rect x="205.8" y="366.7" width="9" height="9" fill="#c4442b"/><rect x="222.2" y="361.6" width="9" height="9" fill="#c4442b"/><rect x="238.6" y="356.6" width="9" height="9" fill="#c4442b"/><rect x="255.0" y="351.5" width="9" height="9" fill="#c4442b"/><rect x="271.4" y="346.4" width="9" height="9" fill="#c4442b"/><rect x="287.8" y="341.3" width="9