e="#e2ded4" stroke-width="1"/><text x="150.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle">カレー・シチュー</text><text x="390.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle"></text><text x="595.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle">60%</text><text x="711.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle">約12分</text><text x="833.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle">約24分</text><text x="955.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle">約36分</text><text x="1077.0" y="396.6" font-size="18" fill="#14181d" text-anchor="middle">約48分</text><rect x="61" y="424" width="1076" height="76" fill="#f7f5ef"/><line x1="60.0" y1="424.0" x2="1138.0" y2="424.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle">魚の骨まで</text><text x="390.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle"></text><text x="595.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle">70%</text><text x="711.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle">約9分</text><text x="833.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle">約18分</text><text x="955.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle">約27分</text><text x="1077.0" y="472.6" font-size="18" fill="#14181d" text-anchor="middle">約36分</text><rect x="260.0" y="218.0" width="260.0" height="30.0" rx="4" fill="#e9e5da" stroke="#e9e5da" stroke-width="1.2"/><rect x="260.0" y="218.0" width="85.8" height="30.0" rx="4" fill="#c4442b" stroke="#c4442b" stroke-width="1.2"/><text x="355.8" y="240.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">×0.33</text><rect x="260.0" y="294.0" width="260.0" height="30.0" rx="4" fill="#e9e5da" stroke="#e9e5da" stroke-width="1.2"/><rect x="260.0" y="294.0" width="65.0" height="30.0" rx="4" fill="#c4442b" stroke="#c4442b" stroke-width="1.2"/><text x="335.0" y="316.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">×0.25</text><rect x="260.0" y="370.0" width="260.0" height="30.0" rx="4" fill="#e9e5da" stroke="#e9e5da" stroke-width="1.2"/><rect x="260.0" y="370.0" width="104.0" height="30.0" rx="4" fill="#c4442b" stroke="#c4442b" stroke-width="1.2"/><text x="374.0" y="392.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">×0.4</text><rect x="260.0" y="446.0" width="260.0" height="30.0" rx="4" fill="#e9e5da" stroke="#e9e5da" stroke-width="1.2"/><rect x="260.0" y="446.0" width="78.0" height="30.0" rx="4" fill="#c4442b" stroke="#c4442b" stroke-width="1.2"/><text x="348.0" y="468.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">×0.3</text><text x="520.0" y="526.0" font-size="14" fill="#6b6f76" text-anchor="end">灰色＝通常の時間、赤＝加圧時間</text><rect x="48.0" y="548.0" width="1104.0" height="64.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="72.0" y="574.0" font-size="16" fill="#3d434b" text-anchor="start">表の時間は「加圧時間」。このほかに、加圧までの加熱と、火を止めたあとの自然放置（余熱）の時間がかかる。</text><text x="72.0" y="598.8" font-size="16" fill="#3d434b" text-anchor="start">仕上がりはレシピや製品の説明書の指示に合わせる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">加圧時間＝通常の調理時間×係数（シミュと同じ）。一般的な目安で、食材の量や大きさで変わる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>