法線</text><text x="818.0" y="196.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">空気</text><text x="818.0" y="364.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">水</text><g opacity="1"><line x1="837.4" y1="410.0" x2="906.7" y2="370.0" stroke="#c4442b" stroke-width="3.2" marker-end="url(#ah-acc)"/><line x1="906.7" y1="370.0" x2="976.0" y2="330.0" stroke="#c4442b" stroke-width="3.2"/></g><path d="M976.0,392.0 A62,62 0 0 1 922.3,361.0" fill="none" stroke="#c4442b" stroke-width="2.4"/><text x="914.0" y="433.4" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke">入射角</text><text x="914.0" y="452.4" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke">60°</text><g opacity="1"><line x1="976.0" y1="330.0" x2="1061.9" y2="379.6" stroke="#c4442b" stroke-width="3.2" marker-end="url(#ah-acc)"/><line x1="1061.9" y1="379.6" x2="1114.6" y2="410.0" stroke="#c4442b" stroke-width="3.2"/></g><path d="M1019.3,355.0 A50,50 0 0 1 976.0,380.0" fill="none" stroke="#6a5c82" stroke-width="2.4"/><text x="1038.0" y="433.4" font-size="15" fill="#6a5c82" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke">反射角</text><text x="1038.0" y="452.4" font-size="15" fill="#6a5c82" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="4" paint-order="stroke">60°</text><text x="976.0" y="270.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700" stroke="#ffffff" stroke-width="5" paint-order="stroke">空気へ出ていく光はない</text><text x="820.0" y="548.0" font-size="17" fill="#14181d" text-anchor="start">入射角が臨界角（約48.8°）より</text><text x="820.0" y="573.5" font-size="17" fill="#14181d" text-anchor="start">大きいと、すべて反射する</text><text x="48" y="650" font-size="15" fill="#6b6f76">角度は境界面に垂直な線（法線）からはかる。うすい線は境界面で一部だけ反射した光。反射角＝入射角。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>