c6b86" stroke-width="0"/><text x="668.0" y="413.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="690.0" y="414.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">0.1秒間の平均の速さ ＝ テープの長さ ÷ 0.1秒</text><text x="690.0" y="439.0" font-size="15.5" fill="#3d434b" text-anchor="start">例：③ 6.34cm ÷ 0.1秒 ≒ 63cm/s</text><circle cx="668.0" cy="476.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="668.0" y="481.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="690.0" y="482.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">1本ごとに 2.54cm ずつ長くなる</text><text x="690.0" y="507.0" font-size="15.5" fill="#3d434b" text-anchor="start">→ 速さが一定の割合で増える運動</text><circle cx="668.0" cy="544.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="668.0" y="549.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="690.0" y="550.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">上の端をつなぐと、速さ－時間のグラフと同じ形</text><text x="690.0" y="575.0" font-size="15.5" fill="#3d434b" text-anchor="start">斜面を下る台車は右上がりの直線になる</text><text x="48" y="650" font-size="15" fill="#6b6f76">斜面の角度15°・1秒間に50回打点の記録（シミュレーションのはじめの設定）。摩擦と空気の抵抗は考えない。斜面の図は模式図。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>