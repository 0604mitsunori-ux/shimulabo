150.0" x2="916.0" y2="150.0" stroke="#b9b3a5" stroke-width="4"/><line x1="890.0" y1="152.0" x2="851.1" y2="235.4" stroke="#3d434b" stroke-width="2"/><circle cx="851.1" cy="235.4" r="10.0" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><circle cx="847.9" cy="232.2" r="2.8" fill="#8a9099" stroke="#8a9099" stroke-width="0"/><circle cx="890.0" cy="282.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="890.0" y="287.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">ウ</text><line x1="910.0" y1="282.0" x2="972.0" y2="282.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><line x1="964.0" y1="150.0" x2="1016.0" y2="150.0" stroke="#b9b3a5" stroke-width="4"/><line x1="990.0" y1="152.0" x2="990.0" y2="244.0" stroke="#3d434b" stroke-width="2"/><circle cx="990.0" cy="244.0" r="10.0" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><circle cx="986.8" cy="240.8" r="2.8" fill="#8a9099" stroke="#8a9099" stroke-width="0"/><circle cx="990.0" cy="282.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="990.0" y="287.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">イ</text><line x1="1010.0" y1="282.0" x2="1072.0" y2="282.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><line x1="1064.0" y1="150.0" x2="1116.0" y2="150.0" stroke="#b9b3a5" stroke-width="4"/><line x1="1090.0" y1="152.0" x2="1128.9" y2="235.4" stroke="#3d434b" stroke-width="2"/><circle cx="1128.9" cy="235.4" r="10.0" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><circle cx="1125.7" cy="232.2" r="2.8" fill="#8a9099" stroke="#8a9099" stroke-width="0"/><circle cx="1090.0" cy="282.0" r="12.8" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="1090.0" y="287.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">ア</text><text x="660.0" y="326.0" font-size="16" fill="#3d434b" text-anchor="start">手をはなした所（ア）から反対側（ウ）まで行き、</text><text x="660.0" y="350.0" font-size="16" fill="#3d434b" text-anchor="start">またアにもどってくるまでが「1往復」。</text><text x="660.0" y="400.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">1往復の時間の求め方</text><rect x="650.0" y="414.0" width="496.0" height="200.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="670.0" y="450.0" font-size="21" fill="#c4442b" text-anchor="start" font-weight="700">1往復の時間 ＝ 10往復の時間 ÷ 10</text><text x="670.0" y="482.0" font-size="16" fill="#14181d" text-anchor="start">例（長さ50cm）：10往復が14.19秒なら、</text><text x="670.0" y="507.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">14.19 ÷ 10 ＝ 1.419 → 1往復は約1.42秒</text><text x="670.0" y="545.0" font-size="16" fill="#3d434b" text-anchor="start">1往復は短いので、10往復を計って10でわると、</text><text x="670.0" y="570.6" font-size="16" fill="#3d434b" text-anchor="start">計るときのずれが10分の1になる。</text><text x="670.0" y="596.2" font-size="16" fill="#3d434b" text-anchor="start">同じ条件で3回計って平均をとると、より正しくなる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">振り子の長さは、支点からおもりの中心まで。振れ幅は大きくしすぎないようにする。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>