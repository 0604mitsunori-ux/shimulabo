-size="17" fill="#14181d" text-anchor="middle" font-weight="700">35人学級</text><text x="383.0" y="176.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">1クラス平均</text><text x="533.0" y="176.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">40人学級</text><text x="683.0" y="176.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">1クラス平均</text><line x1="48.0" y1="196.0" x2="758.0" y2="196.0" stroke="#e2ded4" stroke-width="1"/><text x="103.0" y="230.6" font-size="17" fill="#14181d" text-anchor="middle">1クラス</text><text x="233.0" y="230.6" font-size="17" fill="#14181d" text-anchor="middle">1〜35人</text><text x="383.0" y="230.6" font-size="17" fill="#14181d" text-anchor="middle">〜35人</text><text x="533.0" y="230.6" font-size="17" fill="#14181d" text-anchor="middle">1〜40人</text><text x="683.0" y="230.6" font-size="17" fill="#14181d" text-anchor="middle">〜40人</text><rect x="49" y="250" width="708" height="54" fill="#f7f5ef"/><line x1="48.0" y1="250.0" x2="758.0" y2="250.0" stroke="#e2ded4" stroke-width="1"/><text x="103.0" y="284.6" font-size="17" fill="#14181d" text-anchor="middle">2クラス</text><text x="233.0" y="284.6" font-size="17" fill="#14181d" text-anchor="middle">36〜70人</text><text x="383.0" y="284.6" font-size="17" fill="#14181d" text-anchor="middle">18.0〜35人</text><text x="533.0" y="284.6" font-size="17" fill="#14181d" text-anchor="middle">41〜80人</text><text x="683.0" y="284.6" font-size="17" fill="#14181d" text-anchor="middle">20.5〜40人</text><line x1="48.0" y1="304.0" x2="758.0" y2="304.0" stroke="#e2ded4" stroke-width="1"/><text x="103.0" y="338.6" font-size="17" fill="#14181d" text-anchor="middle">3クラス</text><text x="233.0" y="338.6" font-size="17" fill="#14181d" text-anchor="middle">71〜105人</text><text x="383.0" y="338.6" font-size="17" fill="#14181d" text-anchor="middle">23.7〜35人</text><text x="533.0" y="338.6" font-size="17" fill="#14181d" text-anchor="middle">81〜120人</text><text x="683.0" y="338.6" font-size="17" fill="#14181d" text-anchor="middle">27.0〜40人</text><rect x="49" y="358" width="708" height="54" fill="#f7f5ef"/><line x1="48.0" y1="358.0" x2="758.0" y2="358.0" stroke="#e2ded4" stroke-width="1"/><text x="103.0" y="392.6" font-size="17" fill="#14181d" text-anchor="middle">4クラス</text><text x="233.0" y="392.6" font-size="17" fill="#14181d" text-anchor="middle">106〜140人</text><text x="383.0" y="392.6" font-size="17" fill="#14181d" text-anchor="middle">26.5〜35人</text><text x="533.0" y="392.6" font-size="17" fill="#14181d" text-anchor="middle">121〜160人</text><text x="683.0" y="392.6" font-size="17" fill="#14181d" text-anchor="middle">30.3〜40人</text><line x1="48.0" y1="412.0" x2="758.0" y2="412.0" stroke="#e2ded4" stroke-width="1"/><text x="103.0" y="446.6" font-size="17" fill="#14181d" text-anchor="middle">5クラス</text><text x="233.0" y="446.6" font-size="17" fill="#14181d" text-anchor="middle">141〜175人</text><text x="383.0" y="446.6" font-size="17" fill="#14181d" text-anchor="middle">28.2〜35人</text><text x="533.0" y="446.6" font-size="17" fill="#14181d" text-anchor="middle">161〜200人</text><text x="683.0" y="446.6" font-size="17" fill="#14181d" text-anchor="middle">32.2〜40人</text><rect x="49" y="466" width="708" height="54" fill="#f7f5ef"/><line x1="48.0" y1="466.0" x2="758.0" y2="466.0" stroke="#e2ded4" stroke-width="1"/><text x="103.0" y="500.6" font-size="17" fill="#14181d" text-anchor="middle">6クラス</text><text x="233.0" y="500.6" font-size="17" fill="#14181d" text-anchor="middle">176〜210人</text><text x="383.0" y="500.6" font-size="17" fill="#14181d" text-anchor="middle">29.3〜35人</text><text x="533.0" y="500.6" font-size="17" fill="#14181d" text-anchor="middle">201〜240人</text><text x="683.0" y="500.6" font-size="17" fill="#14181d" text-anchor="middle">33.5〜40人</text><rect x="158" y="186" width="300" height="4" fill="#2c6b86"/><rect x="458" y="186" width="300" height="4" fill="#a97a24"/><text x="48.0" y="560.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">あと何人で＋1クラス ＝ クラス数 × 上限 − 人数 ＋ 1</text><text x="48.0" y="592.0" font-size="16" fill="#3d434b" text-anchor="start">例）72人・35人学級 → 3クラス（平均24.0人）、あと34人で4クラス</text><rect x="790.0" y="104.0" width="362.0" height="420.0" rx="10" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="810.0" y="140.0" font-size="18" fill="#1b4a63" text-anchor="start" font-weight="700">学級編制の標準（公立小中学校）</text><text x="810.0" y="186.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">小学校</text><text x="1132.0" y="186.0" font-size="21" fill="#1b4a63" text-anchor="end" font-weight="700">35人</text><text x="810.0" y="216.0" font-size="15.5" fill="#3d434b" text-anchor="start">2021年度から学年ごとに引き下げ、</text><text x="810.0" y="240.8" font-size="15.5" fill="#3d434b" text-anchor="start">2025年度に全学年が35人に</text><line x1="810.0" y1="270.0" x2="1132.0" y2="270.0" stroke="#d3e1e8" stroke-width="1"/><text x="810.0" y="296.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">中学校</text><text x="1132.0" y="296.0" font-size="21" fill="#1b4a63" text-anchor="end" font-weight="700">40人 → 35人</text><text x="810.0" y="326.0" font-size="15.5" fill="#3d434b" text-anchor="start">2026年度の中1から順に引き下げ、</text><text x="810.0" y="350.8" font-size="15.5" fill="#3d434b" text-anchor="start">2028年度に全学年が35人に</text><line x1="810.0" y1="380.0" x2="1132.0" y2="380.0" stroke="#d3e1e8" stroke-width="1"/><text x="810.0" y="406.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">特別支援学級</text><text x="1132.0" y="406.0" font-size="21" fill="#1b4a63" text-anchor="end" font-weight="700">8人</text><line x1="810.0" y1="440.0" x2="1132.0" y2="440.0" stroke="#d3e1e8" stroke-width="1"/><text x="810.0" y="470.0" font-size="15.5" fill="#3d434b" text-anchor="start">都道府県の基準で、標準より少ない</text><text x="810.0" y="494.8" font-size="15.5" fill="#3d434b" text-anchor="start">人数で編制することもある。</text><text x="48" y="650" font-size="15" fill="#6b6f76">1クラス平均の幅：その学級数になる人数のうち、いちばん少ないとき〜上限いっぱいのとき。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>