<text x="1100.0" y="213.6" font-size="17" fill="#14181d" text-anchor="middle">ゆるむ</text><rect x="833" y="228" width="318" height="40" fill="#f7f5ef"/><line x1="832.0" y1="228.0" x2="1152.0" y2="228.0" stroke="#e2ded4" stroke-width="1"/><text x="888.0" y="253.6" font-size="17" fill="#14181d" text-anchor="middle">のばす</text><text x="996.0" y="253.6" font-size="17" fill="#14181d" text-anchor="middle">ゆるむ</text><text x="1100.0" y="253.6" font-size="17" fill="#14181d" text-anchor="middle">ちぢむ</text><text x="832.0" y="300.0" font-size="16" fill="#14181d" text-anchor="start">きん肉は、ちぢんでほねを</text><text x="832.0" y="324.0" font-size="16" fill="#14181d" text-anchor="start">引っぱり、体を動かす。</text><text x="832.0" y="348.0" font-size="16" fill="#14181d" text-anchor="start">きん肉は、ほねをおすことは</text><text x="832.0" y="372.0" font-size="16" fill="#14181d" text-anchor="start">できない。だから、曲げるときと</text><text x="832.0" y="396.0" font-size="16" fill="#14181d" text-anchor="start">のばすときで、はたらくきん肉が</text><text x="832.0" y="420.0" font-size="16" fill="#14181d" text-anchor="start">入れかわる。</text><ellipse cx="846" cy="470" rx="14" ry="8" fill="#c4442b"/><text x="870.0" y="476.0" font-size="15" fill="#3d434b" text-anchor="start">ちぢむ＝短く太くなる（かたい）</text><ellipse cx="846" cy="504" rx="14" ry="5" fill="#f3c2b8" stroke="#7f1d1d" stroke-opacity=".4"/><text x="870.0" y="510.0" font-size="15" fill="#3d434b" text-anchor="start">ゆるむ＝のばされる（やわらかい）</text><circle cx="846" cy="538" r="11" fill="none" stroke="#3f8a5a" stroke-width="2.4" stroke-dasharray="5 4"/><text x="870.0" y="544.0" font-size="15" fill="#3d434b" text-anchor="start">関節＝ほねとほねのつなぎ目</text><text x="832.0" y="590.0" font-size="15" fill="#6b6f76" text-anchor="start">きん肉のはしの白い部分＝けん</text><text x="48" y="650" font-size="15" fill="#6b6f76">曲げるときは内側、のばすときは外側のきん肉がちぢむ。図は、ほねときん肉を見やすくした模式図。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>