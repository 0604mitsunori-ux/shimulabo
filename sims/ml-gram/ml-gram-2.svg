.0" y="461.7" font-size="20" fill="#14181d" text-anchor="middle">700g</text><rect x="61" y="484" width="1078" height="62" fill="#f7f5ef"/><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="#e2ded4" stroke-width="1"/><text x="145.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">小麦粉</text><text x="305.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">約3g</text><text x="455.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">約8g</text><text x="605.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">55g</text><text x="755.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">99g</text><text x="910.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">110g</text><text x="1065.0" y="523.7" font-size="20" fill="#14181d" text-anchor="middle">275g</text><text x="145.0" y="151.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">食材</text><text x="305.0" y="139.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">小さじ1</text><text x="305.0" y="162.0" font-size="15" fill="#3d434b" text-anchor="middle">（5ml）</text><text x="455.0" y="139.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">大さじ1</text><text x="455.0" y="162.0" font-size="15" fill="#3d434b" text-anchor="middle">（15ml）</text><text x="605.0" y="151.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">100ml</text><text x="755.0" y="139.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">1合</text><text x="755.0" y="162.0" font-size="15" fill="#3d434b" text-anchor="middle">（180ml）</text><text x="910.0" y="139.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">1カップ</text><text x="910.0" y="162.0" font-size="15" fill="#3d434b" text-anchor="middle">（200ml）</text><text x="1065.0" y="151.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">500ml</text><text x="60.0" y="576.0" font-size="16" fill="#3d434b" text-anchor="start">重さ＝ml×比重（水1・牛乳1.03・サラダ油0.92・醤油1.15・はちみつ1.4・小麦粉0.55）で計算。</text><text x="60.0" y="600.8" font-size="16" fill="#3d434b" text-anchor="start">小さじ・大さじは1g単位に丸めた目安。お菓子づくりなど正確さが必要なときは、はかりで量る。</text><text x="48" y="650" font-size="15" fill="#6b6f76">小さじ1＝5ml、大さじ1＝15ml、1カップ＝200ml、米1合＝180ml。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>