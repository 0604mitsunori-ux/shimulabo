 text-anchor="middle">1.00 N</text><line x1="700.0" y1="296.0" x2="1140.0" y2="296.0" stroke="#e2ded4" stroke-width="1"/><text x="800.0" y="325.4" font-size="16.5" fill="#14181d" text-anchor="middle">大（高さ8cm）</text><text x="960.0" y="325.4" font-size="16.5" fill="#14181d" text-anchor="middle">200 cm³</text><text x="1080.0" y="325.4" font-size="16.5" fill="#14181d" text-anchor="middle">2.00 N</text><circle cx="708.0" cy="404.0" r="4.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="722.0" y="410.0" font-size="16.5" fill="#14181d" text-anchor="start">浮力は、水中にある部分の体積で決まる。</text><circle cx="708.0" cy="438.0" r="4.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="722.0" y="444.0" font-size="16.5" fill="#14181d" text-anchor="start">物体の質量（重さ）や材質には関係しない。</text><circle cx="708.0" cy="472.0" r="4.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="722.0" y="478.0" font-size="16.5" fill="#c4442b" text-anchor="start" font-weight="700">浮力 ＝ 空気中の値 － 水中の値</text><circle cx="708.0" cy="506.0" r="4.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="722.0" y="512.0" font-size="16.5" fill="#14181d" text-anchor="start">物体の密度が水（1 g/cm³）より小さいと、</text><text x="722.0" y="546.0" font-size="16.5" fill="#14181d" text-anchor="start">　全部沈む前に浮力と重力がつり合って浮く。</text><text x="48" y="650" font-size="15" fill="#6b6f76">底面の深さ＝水面から物体の底面までの深さ。物体は底面5cm×5cm。100 gに働く重力を1 Nとして計算。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>