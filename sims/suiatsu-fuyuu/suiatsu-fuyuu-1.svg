<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">水中の物体に働く力（水圧と浮力のしくみ）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="100" y="250" width="370" height="270" fill="#dcebf3"/><polyline points="100.0,200.0 100.0,520.0 470.0,520.0 470.0,200.0" fill="none" stroke="#3d434b" stroke-width="3" stroke-linejoin="round"/><line x1="100.0" y1="250.0" x2="470.0" y2="250.0" stroke="#2c6b86" stroke-width="2"/><text x="462.0" y="242.0" font-size="15" fill="#2c6b86" text-anchor="end" font-weight="700">水面</text><line x1="90.0" y1="250.0" x2="100.0" y2="250.0" stroke="#3d434b" stroke-width="1.4"/><line x1="90.0" y1="280.0" x2="100.0" y2="280.0" stroke="#3d434b" stroke-width="1.4"/><line x1="90.0" y1="310.0" x2="100.0" y2="310.0" stroke="#3d434b" stroke-width="1.4"/><text x="86.0" y="315.0" font-size="14" fill="#3d434b" text-anchor="end">2cm</text><line x1="90.0" y1="340.0" x2="100.0" y2="340.0" stroke="#3d434b" stroke-width="1.4"/><line x1="90.0" y1="370.0" x2="100.0" y2="370.0" stroke="#3d434b" stroke-width="1.4"/><text x="86.0" y="375.0" font-size="14" fill="#3d434b" text-anchor="end">4cm</text><line x1="90.0" y1="400.0" x2="100.0" y2="400.0" stroke="#3d434b" stroke-width="1.4"/><line x1="90.0" y1="430.0" x2="100.0" y2="430.0" stroke="#3d434b" stroke-width="1.4"/><text x="86.0" y="435.0" font-size="14" fill="#3d434b" text-anchor="end">6cm</text><line x1="90.0" y1="460.0" x2="100.0" y2="460.0" stroke="#3d434b" stroke-width="1.4"/><line x1="90.0" y1="490.0" x2="100.0" y2="490.0" stroke="#3d434b" stroke-width="1.4"/><text x="86.0" y="495.0" font-size="14" fill="#3d434b" text-anchor="end">8cm</text><line x1="90.0" y1="520.0" x2="100.0" y2="520.0" stroke="#3d434b" stroke-width="1.4"/><text x="86.0" y="255.0" font-size="14" fill="#3d434b" text-anchor="end">0</text><text x="86.0" y="236.0" font-size="14" fill="#3d434b" text-anchor="end" font-weight="700">深さ</text><line x1="215.0" y1="108.0" x2="355.0" y2="108.0" stroke="#3d434b" stroke-width="5"/><line x1="285.0" y1="108.0" x2="285.0" y2="120.0" stroke="#3d434b" stroke-width="2"/><rect x="267.0" y="120.0" width="36.0" height="82.0" rx="6" fill="#ffffff" stroke="#3d434b" stroke-width="1.6"/><line x1="289.0" y1="130.0" x2="299.0" y2="130.0" stroke="#6b6f76" stroke-width="1.2"/><line x1="289.0" y1="142.0" x2="299.0" y2="142.0" stroke="#6b6f76" stroke-width="1.2"/><line x1="289.0" y1="154.0" x2="299.0" y2="154.0" stroke="#6b6f76" stroke-width="1.2"/><line x1="289.0" y1="166.0" x2="299.0" y2="166.0" stroke="#6b6f76" stroke-width="1.2"/><line x1="289.0" y1="178.0" x2="299.0" y2="178.0" stroke="#6b6f76" stroke-width="1.2"/><line x1="289.0" y1="190.0" x2="299.0" y2="190.0" stroke="#6b6f76" stroke-width="1.2"/><line x1="273.0" y1="172.0" x2="297.0" y2="172.0" stroke="#c4442b" stroke-width="3"/><line x1="285.0" y1="202.0" x2="285.0" y2="310.0" stroke="#14181d" stroke-width="1.8"/><text x="317.0" y="146.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">ばねばかり</text><text x="317.0" y="176.0" font-size="22" fill="#14181d" text-anchor="start" font-weight="700">2.00 N</text><text x="317.0" y="200.0" font-size="14" fill="#6b6f76" text-anchor="start">（空気中では 3.00 N）</text><rect x="210.0" y="310.0" width="150.0" height="120.0" rx="2" fill="#c9ced6" stroke="#14181d" stroke-width="2"/><text x="285.0" y="366.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">100 cm³</text><text x="285.0" y="390.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">300 g</text><line x1="233.0" y1="284.0" x2="233.0" y2="308.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="233.0" y1="504.0" x2="233.0" y2="432.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="267.0" y1="284.0" x2="267.0" y2="308.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="267.0" y1="504.0" x2="267.0" y2="432.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="303.0" y1="284.0" x2="303.0" y2="308.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="303.0" y1="504.0" x2="303.0" y2="432.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="337.0" y1="284.0" x2="337.0" y2="308.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="337.0" y1="504.0" x2="337.0" y2="432.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="172.0" y1="340.0" x2="208.0" y2="340.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="398.0" y1="340.0" x2="362.0" y2="340.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="160.0" y1="370.0" x2="208.0" y2="370.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="410.0" y1="370.0" x2="362.0" y2="370.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="148.0" y1="400.0" x2="208.0" y2="400.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="422.0" y1="400.0" x2="362.0" y2="400.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><text x="368.0" y="300.0" font-size="15" fill="#2c6b86" text-anchor="start" font-weight="700">上の面</text><text x="347.0" y="474.0" font-size="15" fill="#2c6b86" text-anchor="start" font-weight="700">下の面</text><text x="285.0" y="550.0" font-size="15" fill="#2c6b86" text-anchor="middle" font-weight="700">青い矢印＝水圧（深いほど大きい）</text><text x="620.0" y="122.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">水圧の差が、浮力になる</text><text x="620.0" y="160.0" font-size="16" fill="#3d434b" text-anchor="start">上の面（深さ2cm）を押す力：下向き</text><text x="644.0" y="188.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">0.02 N/cm² × 25 cm² ＝ 0.50 N</text><text x="620.0" y="226.0" font-size="16" fill="#3d434b" text-anchor="start">下の面（深さ6cm）を押す力：上向き</text><text x="644.0" y="254.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">0.06 N/cm² × 25 cm² ＝ 1.50 N</text><rect x="620.0" y="274.0" width="520.0" height="46.0" rx="8" fill="#fbeae6" stroke="#fbeae6" stroke-width="1.2"/><text x="634.0" y="305.0" font-size="19" fill="#c4442b" text-anchor="start" font-weight="700">浮力 ＝ 1.50 N － 0.50 N ＝ 1.00 N（上向き）</text><text x="620.0" y="350.0" font-size="16" fill="#3d434b" text-anchor="start">横から押す力は、左右で同じ大きさ → 打ち消し合う</text><text x="620.0" y="400.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">力のつり合い（物体は止まっている）</text><text x="620.0" y="444.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">下向きの力</text><rect x="730.0" y="418.0" width="360.0" height="40.0" rx="4" fill="#e7e3da" stroke="#3d434b" stroke-width="1.4"/><text x="910.0" y="444.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">重力 3.00 N</text><text x="620.0" y="500.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">上向きの力</text><rect x="730.0" y="474.0" width="120.0" height="40.0" rx="4" fill="#fbeae6" stroke="#c4442b" stroke-width="1.4"/><text x="790.0" y="500.0" font-size="16" fill="#c4442b" text-anchor="middle" font-weight="700">浮力 1.00 N</text><rect x="850.0" y="474.0" width="240.0" height="40.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="970.0" y="500.0" font-size="16" fill="#1b4a63" text-anchor="middle" font-weight="700">ばねばかりが引く力 2.00 N</text><text x="620.0" y="550.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">浮力 ＝ 空気中の値 － 水中の値 ＝ 3.00 － 2.00 ＝ 1.00 N</text><text x="620.0" y="580.0" font-size="15" fill="#6b6f76" text-anchor="start">（水圧の差から求めた値と同じになる）</text><text x="48" y="650" font-size="15" fill="#6b6f76">物体は底面5cm×5cm・高さ4cm。100 gの物体に働く重力を1 Nとして計算。矢印は見やすく強調。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>