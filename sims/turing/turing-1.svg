><text x="102.0" y="512.0" font-size="15.5" fill="#14181d" text-anchor="start">v が少しふえた所で、</text><text x="102.0" y="535.2" font-size="15.5" fill="#14181d" text-anchor="start">まわりの u がどんどん使われる</text><line x1="402.0" y1="521.0" x2="420.0" y2="521.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><rect x="424.0" y="478.0" width="352.0" height="86.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="452.0" cy="521.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="452.0" y="526.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="478.0" y="512.0" font-size="15.5" fill="#14181d" text-anchor="start">u は速く広がるので、</text><text x="478.0" y="535.2" font-size="15.5" fill="#14181d" text-anchor="start">まわりの広い範囲で u が足りなくなる</text><line x1="778.0" y1="521.0" x2="796.0" y2="521.0" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><rect x="800.0" y="478.0" width="352.0" height="86.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="828.0" cy="521.0" r="13.6" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="828.0" y="526.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="854.0" y="512.0" font-size="15.5" fill="#14181d" text-anchor="start">すぐとなりでは v がふえられず、</text><text x="854.0" y="535.2" font-size="15.5" fill="#14181d" text-anchor="start">少しはなれた所に次の v の山ができる</text><text x="600.0" y="600.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">→ 近くでふえ、はなれた所ではおさえられる。これがくり返されて、間かくのそろった模様になる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">式：∂u/∂t＝Dᵤ∇²u − uv² ＋ F(1−u)、∂v/∂t＝Dᵥ∇²v ＋ uv² − (F＋k)v（グレイ・スコット模型）</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>