<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">模様が生まれるしくみ（反応拡散）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="104.0" width="476.0" height="122.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.6"/><text x="72.0" y="140.0" font-size="30" fill="#c4442b" text-anchor="start" font-weight="700">v</text><text x="104.0" y="138.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">ふえる物質</text><text x="72.0" y="168.0" font-size="15.5" fill="#3d434b" text-anchor="start">u を使って、自分をふやす（式の uv²）</text><text x="72.0" y="189.7" font-size="15.5" fill="#3d434b" text-anchor="start">ゆっくり広がる（Dᵥ＝0.08）</text><text x="72.0" y="211.4" font-size="15.5" fill="#3d434b" text-anchor="start">少しずつ取りのぞかれる（除去率 k）</text><rect x="48.0" y="234.0" width="476.0" height="122.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="72.0" y="270.0" font-size="30" fill="#2c6b86" text-anchor="start" font-weight="700">u</text><text x="104.0" y="268.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">材料</text><text x="72.0" y="298.0" font-size="15.5" fill="#3d434b" text-anchor="start">外から少しずつ補給される（補給率 F）</text><text x="72.0" y="319.7" font-size="15.5" fill="#3d434b" text-anchor="start">速く広がる（Dᵤ＝0.16・v の2倍）</text><text x="72.0" y="341.4" font-size="15.5" fill="#3d434b" text-anchor="start">v がふえる所で使われて減る</text><rect x="48.0" y="366.0" width="476.0" height="94.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="68.0" y="394.0" font-size="15" fill="#3d434b" text-anchor="start">一般には「活性因子（自分をふやす）」と「抑制因子</text><text x="68.0" y="415.8" font-size="15" fill="#3d434b" text-anchor="start">（それをおさえる・速く広がる）」の組で説明される。</text><text x="68.0" y="437.5" font-size="15" fill="#3d434b" text-anchor="start">この式では v が活性因子、速く広がる u の不足が抑えの役。</text><text x="560.0" y="126.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">水玉模様を横に切った断面（16,000ステップ後）</text><line x1="600.0" y1="430.0" x2="1134.0" y2="430.0" stroke="#14181d" stroke-width="1.8" marker-end="url(#ah-ink)"/><line x1="600.0" y1="430.0" x2="600.0" y2="188.0" stroke="#14181d" stroke-width="1.8" marker-end="url(#ah-ink)"/><line x1="594.0" y1="430.0" x2="600.0" y2="430.0" stroke="#14181d" stroke-width="1.4"/><text x="590.0" y="435.0" font-size="14" fill="#3d434b" text-anchor="end">0.0</text><line x1="600.0" y1="430.0" x2="1120.0" y2="430.0" stroke="#e2ded4" stroke-width="1"/><line x1="594.0" y1="316.0" x2="600.0" y2="316.0" stroke="#14181d" stroke-width="1.4"/><text x="590.0" y="321.0" font-size="14" fill="#3d434b" text-anchor="end">0.5</text><line x1="600.0" y1="316.0" x2="1120.0" y2="316.0" stroke="#e2ded4" stroke-width="1"/><line x1="594.0" y1="202.0" x2="600.0" y2="202.0" stroke="#14181d" stroke-width="1.4"/><text x="590.0" y="207.0" font-size="14" fill="#3d434b" text-anchor="end">1.0</text><line x1="600.0" y1="202.0" x2="1120.0" y2="202.0" stroke="#e2ded4" stroke-width="1"/><text x="1138.0" y="436.0" font-size="14" fill="#14181d" text-anchor="start">位置</text><text x="588.0" y="184.0" font-size="14" fill="#14181d" text-anchor="end">濃さ</text><line x1="820.0" y1="160.0" x2="856.0" y2="160.0" stroke="#c4442b" stroke-width="3.2"/><text x="864.0" y="166.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">v（ふえる物質）</text><line x1="1000.0" y1="160.0" x2="1036.0" y2="160.0" stroke="#2c6b86" stroke-width="2.6" stroke-dasharray="7 5"/><text x="1044.0" y="166.0" font-size="15" fill="#1b4a63" text-anchor="start" font-weight="700">u（材料）</text><polyline points="600.0,215.9 605.3,212.2 610.5,210.3 615.8,209.5 621.0,209.6 626.3,210.3 631.5,211.7 636.8,214.2 642.0,218.6 647.3,226.2 652.5,239.7 657.8,262.8 663.0,298.3 668.3,335.9 673.5,357.8 678.8,365.7 684.0,364.8 689.3,354.8 694.5,330.7 699.8,293.9 705.1,262.0 710.3,243.2 715.6,235.7 720.8,237.5 726.1,249.2 731.3,273.5 736.6,309.8 741.8,343.2 747.1,360.7 752.3,365.9 757.6,362.0 762.8,346.6 768.1,315.2 773.3,277.9 778.6,251.7 783.8,238.3 789.1,235.1 794.3,241.2 799.6,258.2 804.8,288.9 810.1,327.3 815.4,354.0 820.6,365.3 825.9,366.7 831.1,359.2 836.4,338.0 841.6,301.4 846.9,266.6 852.1,245.2 857.4,235.7 862.6,235.7 867.9,245.2 873.1,266.6 878.4,301.4 883.6,338.0 888.9,359.2 894.1,366.7 899.4,365.3 904.6,354.0 909.9,327.3 915.2,288.9 920.4,258.2 925.7,241.2 930.9,235.1 936.2,238.3 941.4,251.7 946.7,277.9 951.9,315.2 957.2,346.6 962.4,362.0 967.7,365.9 972.9,360.7 978.2,343.2 983.4,309.8 988.7,273.5 993.9,249.2 999.2,237.5 1004.4,235.7 1009.7,243.2 1014.9,262.0 1020.2,293.9 1025.5,330.7 1030.7,354.8 1036.0,364.8 1041.2,365.7 104