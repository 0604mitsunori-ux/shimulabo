"1062.4" y1="304.0" x2="1050.0" y2="402.0" stroke="#a97a24" stroke-width="1.4" marker-end="url(#ah-gold)"/><line x1="1114.4" y1="304.0" x2="1102.0" y2="402.0" stroke="#a97a24" stroke-width="1.4" marker-end="url(#ah-gold)"/><line x1="1140.4" y1="304.0" x2="1128.0" y2="402.0" stroke="#a97a24" stroke-width="1.4" marker-end="url(#ah-gold)"/><line x1="1076.0" y1="402.0" x2="1065.4" y2="402.0" stroke="#14181d" stroke-width="5"/><line x1="1076.0" y1="402.0" x2="1076.0" y2="318.0" stroke="#c4442b" stroke-width="4"/><line x1="1076.0" y1="318.0" x2="1076.0" y2="284.0" stroke="#c4442b" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="1076.0" y1="318.0" x2="1077.8" y2="304.0" stroke="#a97a24" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M1076,288 A30,30 0 0 1 1079.8,288.2" fill="none" stroke="#c4442b" stroke-width="2"/><text x="1092.0" y="288.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">7.2°</text><text x="852.0" y="300.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">アレクサンドリア</text><text x="852.0" y="324.0" font-size="14" fill="#3d434b" text-anchor="start">高さ1 mの棒の影</text><text x="852.0" y="344.0" font-size="14" fill="#3d434b" text-anchor="start">＝ 12.6 cm</text><text x="852.0" y="366.0" font-size="14" fill="#3d434b" text-anchor="start">tan θ ＝ 0.126</text><rect x="840.0" y="438.0" width="312.0" height="176.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="854.0" y="466.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">360° : 7.2° ＝ 地球一周 : 925 km</text><text x="854.0" y="496.0" font-size="16" fill="#14181d" text-anchor="start">地球一周 ＝ 925 × 360 ÷ 7.2</text><text x="854.0" y="534.0" font-size="26" fill="#1b4a63" text-anchor="start" font-weight="700">＝ 46,250 km</text><text x="854.0" y="566.0" font-size="14.5" fill="#3d434b" text-anchor="start">実際（子午線の一周）40,008 km</text><text x="854.0" y="588.0" font-size="14" fill="#3d434b" text-anchor="start">との差 +16%（925 kmは5,000スタディア）</text><text x="48" y="650" font-size="15" fill="#6b6f76">太陽の光は平行なので、影から測った角度が地球の中心角になる。2地点の距離から地球一周がわかる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>