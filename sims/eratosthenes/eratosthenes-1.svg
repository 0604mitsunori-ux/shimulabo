<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">エラトステネスの方法（地球の大きさの求め方）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">地球の断面（夏至の日の正午）</text><path d="M120,520 L517.8,561.8 A400,400 0 0 0 366.3,204.8Z" fill="#dbeafe" stroke="#2c6b86" stroke-width="2"/><line x1="800.0" y1="236.0" x2="407.7" y2="236.0" stroke="#a97a24" stroke-width="2" marker-end="url(#ah-gold)"/><line x1="800.0" y1="400.0" x2="507.6" y2="400.0" stroke="#a97a24" stroke-width="2" marker-end="url(#ah-gold)"/><line x1="800.0" y1="450.0" x2="519.8" y2="450.0" stroke="#a97a24" stroke-width="2" marker-end="url(#ah-gold)"/><line x1="800.0" y1="486.0" x2="524.6" y2="486.0" stroke="#a97a24" stroke-width="2" marker-end="url(#ah-gold)"/><line x1="800.0" y1="520.0" x2="590.0" y2="520.0" stroke="#a97a24" stroke-width="2" marker-end="url(#ah-gold)"/><text x="800.0" y="220.0" font-size="15" fill="#a97a24" text-anchor="end" font-weight="700">太陽の光（平行）</text><line x1="120.0" y1="520.0" x2="590.0" y2="520.0" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="120.0" y1="520.0" x2="543.9" y2="331.3" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M190,520 A70,70 0 0 0 183.9,491.5" fill="none" stroke="#c4442b" stroke-width="2.4"/><text x="204.0" y="506.0" font-size="20" fill="#c4442b" text-anchor="start" font-weight="700">θ</text><text x="140.0" y="550.0" font-size="15" fill="#3d434b" text-anchor="start">地球の中心</text><circle cx="120.0" cy="520.0" r="4.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><path d="M520.0,520.0 A400,400 0 0 0 485.4,357.3" fill="none" stroke="#c4442b" stroke-width="5"/><text x="487.7" y="446.6" font-size="17" fill="#c4442b" text-anchor="end" font-weight="700">925 km</text><line x1="520.0" y1="520.0" x2="584.0" y2="520.0" stroke="#2563eb" stroke-width="4"/><circle cx="520.0" cy="520.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="526.0" y="550.0" font-size="17" fill="#2563eb" text-anchor="start" font-weight="700">シエネ</text><text x="526.0" y="570.0" font-size="14" fill="#2563eb" text-anchor="start">影ができない</text><line x1="485.4" y1="357.3" x2="543.9" y2="331.3" stroke="#c4442b" stroke-width="4"/><circle cx="485.4" cy="357.3" r="4.0" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><line x1="800.0" y1="331.3" x2="545.9" y2="331.3" stroke="#a97a24" stroke-width="2.4" marker-end="url(#ah-gold)"/><line x1="543.9" y1="331.3" x2="472.7" y2="331.3" stroke="#a97a24" stroke-width="2" stroke-dasharray="4 