<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">地球一周の求め方と日本の2都市での計算</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="112.0" width="560.0" height="128.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="64.0" y="140.0" font-size="17" fill="#1b4a63" text-anchor="start" font-weight="700">地球一周を求める式</text><text x="64.0" y="172.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">360° : θ ＝ 地球一周 L : 2地点の距離 d</text><text x="64.0" y="202.0" font-size="17" fill="#14181d" text-anchor="start">L ＝ d × 360° ÷ θ　　地球の半径 ＝ L ÷ 2π</text><text x="64.0" y="228.0" font-size="15" fill="#3d434b" text-anchor="start">θ：影の角度（棒と光の角）＝ 2地点の緯度の差</text><rect x="624.0" y="112.0" width="528.0" height="128.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="640.0" y="140.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">影の長さから角度を求める</text><text x="640.0" y="172.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">tan θ ＝ 影の長さ ÷ 棒の高さ</text><text x="640.0" y="202.0" font-size="16" fill="#14181d" text-anchor="start">例：1 mの棒の影が12.6 cm → tanθ＝0.126</text><text x="640.0" y="228.0" font-size="16" fill="#14181d" text-anchor="start">→ θ ≒ 7.2°（下の表で読む）</text><rect x="48.0" y="256.0" width="1104.0" height="99.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="256" width="1104" height="33" rx="8" fill="#eef3f6"/><text x="128.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">棒と光の角θ</text><text x="267.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">5°</text><text x="385.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">7.2°</text><text x="503.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">10°</text><text x="621.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">20°</text><text x="739.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">30°</text><text x="857.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">35°</text><text x="975.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">40°</text><text x="1093.0" y="277.1" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">45°</text><line x1="48.0" y1="289.0" x2="1152.0" y2="289.0" stroke="#e2ded4" stroke-width="1"/><text x="128.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">tan θ</text><text x="267.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.087</text><text x="385.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.126</text><text x="503.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.176</text><text x="621.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.364</text><text x="739.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.577</text><text x="857.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.700</text><text x="975.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">0.839</text><text x="1093.0" y="310.1" font-size="15.5" fill="#14181d" text-anchor="middle">1.000</text><rect x="49" y="322" width="1102" height="33" fill="#f7f5ef"/><line x1="48.0" y1="322.0" x2="1152.0" y2="322.0" stroke="#e2ded4" stroke-width="1"/><text x="128.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">1 mの棒の影</text><text x="267.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">8.7 cm</text><text x="385.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">12.6 cm</text><text x="503.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">17.6 cm</text><text x="621.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">36.4 cm</text><text x="739.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">57.7 cm</text><text x="857.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">70.0 cm</text><text x="975.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">83.9 cm</text><text x="1093.0" y="343.1" font-size="15.5" fill="#14181d" text-anchor="middle">100.0 cm</text><text x="48.0" y="384.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">日本の2都市（都道府県庁）で計算した地球一周</text><rect x="48.0" y="394.0" width="1104.0" height="224.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="394" width="1104" hei