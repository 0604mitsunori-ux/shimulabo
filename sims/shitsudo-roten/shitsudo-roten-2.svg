<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker><clipPath id="sr-cloud"><rect x="860" y="156.0" width="290" height="118.4"/></clipPath></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">湿度・露点・雲のできる高さの求め方</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="104.0" width="712.0" height="78.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="78.0" cy="143.0" r="15.3" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="78.0" y="149.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="108.0" y="137.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">湿度［％］＝ 水蒸気量 ÷ 飽和水蒸気量 × 100</text><text x="108.0" y="166.0" font-size="16" fill="#3d434b" text-anchor="start">例：25℃・水蒸気量 12.8 g/m³ → 12.8 ÷ 23.1 × 100 ≒ 55.4％</text><rect x="48.0" y="192.0" width="712.0" height="78.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="78.0" cy="231.0" r="15.3" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="78.0" y="237.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="108.0" y="225.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">露点 ＝ 飽和水蒸気量が、水蒸気量と等しくなる温度</text><text x="108.0" y="254.0" font-size="16" fill="#3d434b" text-anchor="start">例：水蒸気量 12.8 g/m³ → 飽和水蒸気量が 12.8 g になるのは 15℃</text><rect x="48.0" y="280.0" width="712.0" height="78.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="78.0" cy="319.0" r="15.3" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="78.0" y="325.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="108.0" y="313.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">水滴の量 ＝ 水蒸気量 − 冷やした温度の飽和水蒸気量</text><text x="108.0" y="342.0" font-size="16" fill="#3d434b" text-anchor="start">例：10℃まで冷やす → 12.8 − 9.4 ＝ 3.4 g（空気1 m³あたり）</text><rect x="48.0" y="368.0" width="712.0" height="78.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="78.0" cy="407.0" r="15.3" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="78.0" y="413.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="108.0" y="401.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">雲ができ始める高さ ＝（地上の気温 − 露点）× 100 m</text><text x="108.0" y="430.0" font-size="16" fill="#3d434b" text-anchor="start">例：28℃・湿度50％ → 水蒸気量 27.2×0.5＝13.6 g → 露点 16℃ → 1200 m</text><text x="800.0" y="122.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">上昇する空気と雲（例：④）</text><rect x="860" y="156.0" width="290" height="296.0" fill="#eef3f6"/><rect x="860" y="452" width="290" height="10" fill="#d8cfb8"/><line x1="860.0" y1="150.0" x2="860.0" y2="452.0" stroke="#14181d" stroke-width="1.6"/><line x1="854.0" y1="452.0" x2="860.0" y2="452.0" stroke="#14181d" stroke-width="1.4"/><text x="850.0" y="457.0" font-size="14" fill="#3d434b" text-anchor="end">0 m</text><line x1="854.0" y1="378.0" x2="860.0" y2="378.0" stroke="#14181d" stroke-width="1.4"/><text x="850.0" y="383.0" font-size="14" fill="#3d434b" text-anchor="end">500 m</text><line x1="854.0" y1="304.0" x2="860.0" y2="304.0" stroke="#14181d" stroke-width="1.4"/><text x="850.0" y="309.0" font-size="14" fill="#3d434b" text-anchor="end">1000 m</text><line x1="854.0" y1="230.0" x2="860.0" y2="230.0" stroke="#14181d" stroke-width="1.4"/><text x="850.0" y="235.0" font-size="14" fill="#3d434b" text-anchor="end">1500 m</text><line x1="854.0" y1="156.0" x2="860.0" y2="156.0" stroke="#14181d" stroke-width="1.4"/><text x="850.0" y="161.0" font-size="14" fill="#3d434b" text-anchor="end">2000 m</text><g clip-path="url(#sr-cloud)"><circle cx="930" cy="248.4" r="30" fill="#fff" stroke="#6b6f76" stroke-width="2"/><circle cx="966" cy="230.4" r="36" fill="#fff" stroke="#6b6f76" stroke-width="2"/><circle cx="1006" cy="246.4" r="30" fill="#fff" stroke="#6b6f76" stroke-width="2"/><circle cx="1036" cy="254.4" r="22" fill="#fff" stroke="#6b6f76" stroke-width="2"/><circle cx="904" cy="256.4" r="20" fill="#fff" stroke="#6b6f76" stroke-width="2"/><circle cx="930" cy="248.4" r="28" fill="#fff"/><circle cx="966" cy="230.4" r="34" fill="#fff"/><circle cx="1006" cy="246.4" r="28" fill="#fff"/><circle cx="1036" cy="254.4" r="20" fill="#fff"/><circle cx="904" cy="256.4" r="18" fill="#fff"/><rect x="900" y="250.4" width="140" height="24" fill="#fff"/></g><text x="970.0" y="240.4" font-size="18" fill="#3d434b" text-anchor="middle" font-weight="700">雲</text><line x1="860.0" y1="274.4" x2="1150.0" y2="274.4" stroke="#1b4a63" stroke-width="