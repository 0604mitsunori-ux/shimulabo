<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">海抜の目安と、ハザードマップの浸水の色</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="124.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">土地の高さ（海抜）ごとの目安</text><text x="48.0" y="148.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">海抜だけで安全かどうかは決まらない</text><rect x="48.0" y="162.0" width="548.0" height="108.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="162" width="124" height="108" rx="10" fill="#eef3f6"/><text x="110.0" y="224.0" font-size="21" fill="#1b4a63" text-anchor="middle" font-weight="700">20m以上</text><text x="186.0" y="188.0" font-size="15.5" fill="#14181d" text-anchor="start">津波・高潮の影響は受けにくい高さ。</text><text x="186.0" y="209.7" font-size="15.5" fill="#14181d" text-anchor="start">ただし、がけ崩れ・土石流の区域は</text><text x="186.0" y="231.4" font-size="15.5" fill="#14181d" text-anchor="start">高い所に多い</text><text x="186.0" y="255.1" font-size="15.5" fill="#2c6b86" text-anchor="start" font-weight="700">→「土砂災害」を確認</text><rect x="48.0" y="276.0" width="548.0" height="108.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="276" width="124" height="108" rx="10" fill="#eef3f6"/><text x="110.0" y="338.0" font-size="21" fill="#1b4a63" text-anchor="middle" font-weight="700">5〜20m</text><text x="186.0" y="302.0" font-size="15.5" fill="#14181d" text-anchor="start">海抜だけでは安全とも危険とも</text><text x="186.0" y="323.7" font-size="15.5" fill="#14181d" text-anchor="start">言えない。近くの川があふれるか、</text><text x="186.0" y="345.4" font-size="15.5" fill="#14181d" text-anchor="start">水が集まる地形かどうか</text><text x="186.0" y="369.1" font-size="15.5" fill="#2c6b86" text-anchor="start" font-weight="700">→「洪水」の浸水の深さを確認</text><rect x="48.0" y="390.0" width="548.0" height="108.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="390" width="124" height="108" rx="10" fill="#eef3f6"/><text x="110.0" y="452.0" font-size="21" fill="#1b4a63" text-anchor="middle" font-weight="700">0〜5m</text><text x="186.0" y="416.0" font-size="15.5" fill="#14181d" text-anchor="start">海や川に近いと、高潮・津波・洪水の</text><text x="186.0" y="437.7" font-size="15.5" fill="#14181d" text-anchor="start">想定区域に入っていることがある</text><text x="186.0" y="461.4" font-size="15.5" fill="#2c6b86" text-anchor="start" font-weight="700">→ 浸水の深さを確認</text><rect x="48.0" y="504.0" width="548.0" height="108.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="504" width="124" height="108" rx="10" fill="#eef3f6"/><text x="110.0" y="566.0" font-size="21" fill="#1b4a63" text-anchor="middle" font-weight="700">0m未満</text><text x="186.0" y="530.0" font-size="15.5" fill="#14181d" text-anchor="start">海抜ゼロメートル地帯の可能性。</text><text x="186.0" y="551.7" font-size="15.5" fill="#14181d" text-anchor="start">大雨や高潮のとき水が引きにくい</text><text x="186.0" y="575.4" font-size="15.5" fill="#2c6b86" text-anchor="start" font-weight="700">→ 浸水の深さと避難先を必ず確認</text><text x="630.0" y="124.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">浸水の深さ（地面から水面まで）の色</text><text x="630.0" y="148.0" font-size="15" fill="#6b6f76" text-anchor="start">ハザードマップの国の標準の色分け</text><text x="630.0" y="181.0" font-size="15.5" fill="#3d434b" text-anchor="start">さらに深い区分：</text><rect x="764.0" y="162.0" width="34.0" height="26.0" rx="4" fill="rgb(242,133,201)" stroke="#9a8f8f" stroke-width="1"/><text x="808.0" y="181.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">10〜20m</text><rect x="934.0" y="162.0" width="34.0" height="26.0" rx="4" fill="rgb(220,122,220)" stroke="#9a8f8f" stroke-width="1"/><text x="978.0" y="181.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">20m以上</text><rect x="630" y="556.5" width="522" height="33.5" fill="rgb(247,245,169)"/><rect x="630" y="389.0" width="522" height="167.5" fill="rgb(255,216,192)"/><rect x="630" y="255.0" width="522" height="134.0" fill="rgb(255,183,183)"/><rect x="630" y="198.1" width="522" height="56.9" fill="rgb(255,145,145)"/><line x1="630.0" y1="556.5" x2="1152.0" y2="556.5" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1146.0" y="550.5" font-size="15" fill="#14181d" text-anchor="end" font-weight="700">0.5m</text><line x1="630.0" y1="389.0" x2="1152.0" y2="389.0" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1146.0" y="383.0" font-size="15" fill="#14181d" text-anchor="end" font-weight="700">3m</text><line x1="630.0" y1="255.0" x2="1152.0" y2="255.0" stroke="#3d434b" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1146.0" y="249.0" font-size="15" fill="#14181d" text-anchor="end" font-weight="700">5m</text><line x1="630.0" y1="590.0" x2="1152.0" y2="590.0" stroke="#14181d" stroke-width="2.4"/><text x="1146.0" y="612.0" font-size="14" fill="#3d434b" text-anchor="end">地面（0m）</text><rect x="670.0" y="556.5" width="124.0" height="33.5" rx="0" fill="#b8b1a4" stroke="#14181d" stroke-width="1.4"/><rect x="664" y="255.0" width="136" height="301.5" fill="none" stroke="#14181d" stroke-width="2.4"/><line x1="664.0" y1="389.0" x2="800.0" y2="389.0" stroke="#14181d" stroke-width="4"/><line x1="664.0" y1="556.5" x2="800.0" y2="556.5" stroke="#14181d" stroke-width="4"/><path d="M652,255.0 L732.0,201.4 L812,255.0Z" fill="none" stroke="#14181d" stroke-width="2.4" stroke-linejoin="round"/><rect x="680.0" y="442.6" width="36.0" height="40.0" rx="0" fill="none" stroke="#14181d" stroke-width="1.6"/><rect x="748.0" y="442.6" width="36.0" height="40.0" rx="0" fill="none" stroke="#14181d" stroke-width="1.6"/><rect x="680.0" y="275.1" width="36.0" height="40.0" rx="0" fill="none" stroke="#14181d" stroke-width="1.6"/><rect x="748.0" y="275.1" width="36.0" height="40.0" rx="0" fill="none" stroke="#14181d" stroke-width="1.6"/><text x="732.0" y="546.5" font-size="14" fill="#14181d" text-anchor="middle" font-weight="700">1階の床</text><text x="732.0" y="379.0" font-size="14" fill="#14181d" text-anchor="middle" font-weight="700">2階の床</text><text x="826.0" y="241.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">5〜10m：2階が水没する深さ</text><text x="826.0" y="324.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">3〜5m</text><text x="826.0" y="348.0" font-size="16" fill="#14181d" text-anchor="start">2階の床より上まで</text><text x="826.0" y="468.8" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">0.5〜3m</text><text x="826.0" y="492.8" font-size="16" fill="#14181d" text-anchor="start">1階の床より上まで</text><text x="826.0" y="514.8" font-size="16" fill="#14181d" text-anchor="start">（床上浸水）</text><text x="826.0" y="579.2" font-size="15.5" fill="#14181d" text-anchor="start" font-weight="700">0.5m未満：床下浸水ていど</text><text x="48" y="650" font-size="15" fill="#6b6f76">浸水の色は国土交通省「水害ハザードマップ作成の手引き」の標準。家の高さは一般的な2階建ての目安。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>