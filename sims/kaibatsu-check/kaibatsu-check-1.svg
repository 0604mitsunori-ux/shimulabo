/text><text x="958.0" y="185.0" font-size="15" fill="#3d434b" text-anchor="start">てっぺんの標高は</text><text x="958.0" y="207.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">15m＋30m＝45m</text><rect x="48.0" y="104.0" width="296.0" height="160.0" rx="10" fill="#ffffff" stroke="#2c6b86" stroke-width="1.6"/><text x="64.0" y="134.0" font-size="19" fill="#2c6b86" text-anchor="start" font-weight="700">海抜と標高は同じ高さ</text><text x="64.0" y="164.0" font-size="15.5" fill="#14181d" text-anchor="start">日本ではどちらも、東京湾の</text><text x="64.0" y="188.8" font-size="15.5" fill="#14181d" text-anchor="start">平均海面（T.P.）を0mとして測る。</text><text x="64.0" y="213.6" font-size="15.5" fill="#14181d" text-anchor="start">地図・登山では「標高」、</text><text x="64.0" y="238.4" font-size="15.5" fill="#14181d" text-anchor="start">海辺の看板や防災では「海抜」</text><text x="48" y="650" font-size="15" fill="#6b6f76">模式図（高さ・きょりは実際とちがう／数字は例）。海抜は「土地の高さ」で、浸水の危険そのものではない。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>