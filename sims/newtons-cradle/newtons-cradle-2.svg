<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">なぜ同じ数だけ跳ねるのか（2つの保存則）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="126.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">2個をぶつけたとき、反対側の玉はどう跳ねる？</text><text x="48.0" y="154.0" font-size="15" fill="#3d434b" text-anchor="start">玉1個の質量を1、ぶつける速さを1とする。運動量とエネルギーの合計が、ぶつける前と同じになるものだけが起こる。</text><rect x="48.0" y="172.0" width="1104.0" height="384.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="172" width="1104" height="54" rx="8" fill="#eef3f6"/><text x="169.0" y="206.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">飛び出す玉</text><text x="405.0" y="196.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">運動量の合計</text><text x="405.0" y="216.0" font-size="14" fill="#3d434b" text-anchor="middle">（質量×速さ）</text><text x="680.0" y="196.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">運動エネルギーの合計</text><text x="680.0" y="216.0" font-size="14" fill="#3d434b" text-anchor="middle">（½×質量×速さ²）</text><text x="996.0" y="206.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">起こる？</text><rect x="49" y="226" width="1102" height="66" fill="#f6eedc"/><line x1="48.0" y1="226.0" x2="1152.0" y2="226.0" stroke="#e2ded4" stroke-width="1"/><circle cx="74.0" cy="251.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="96.0" cy="251.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><line x1="111.0" y1="251.0" x2="141.0" y2="251.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="63.0" y="283.0" font-size="14.5" fill="#14181d" text-anchor="start" font-weight="700">ぶつける前：2個が速さ1</text><text x="405.0" y="266.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">2×1＝2</text><text x="680.0" y="266.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">2×½×1²＝1</text><text x="996.0" y="266.0" font-size="15" fill="#3d434b" text-anchor="middle">これと同じになればよい</text><line x1="48.0" y1="292.0" x2="1152.0" y2="292.0" stroke="#e2ded4" stroke-width="1"/><circle cx="74.0" cy="317.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><line x1="89.0" y1="317.0" x2="149.0" y2="317.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="63.0" y="349.0" font-size="14.5" fill="#14181d" text-anchor="start">1個が速さ2</text><text x="405.0" y="332.0" font-size="17" fill="#14181d" text-anchor="middle">1×2＝2　○</text><text x="680.0" y="332.0" font-size="17" fill="#c4442b" text-anchor="middle" font-weight="700">1×½×2²＝2　×</text><text x="996.0" y="332.0" font-size="16" fill="#6b6f76" text-anchor="middle" font-weight="700">起こらない（エネルギーがふえる）</text><rect x="49" y="358" width="1102" height="66" fill="#e3eef3"/><line x1="48.0" y1="358.0" x2="1152.0" y2="358.0" stroke="#e2ded4" stroke-width="1"/><circle cx="74.0" cy="383.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="96.0" cy="383.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><line x1="111.0" y1="383.0" x2="141.0" y2="383.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="63.0" y="415.0" font-size="14.5" fill="#14181d" text-anchor="start" font-weight="700">2個が速さ1</text><text x="405.0" y="398.0" font-size="17" fill="#14181d" text-anchor="middle">2×1＝2　○</text><text x="680.0" y="398.0" font-size="17" fill="#14181d" text-anchor="middle">2×½×1²＝1　○</text><text x="996.0" y="398.0" font-size="16" fill="#1b4a63" text-anchor="middle" font-weight="700">起こる（両方とも同じ）</text><line x1="48.0" y1="424.0" x2="1152.0" y2="424.0" stroke="#e2ded4" stroke-width="1"/><circle cx="74.0" cy="449.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="96.0" cy="449.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="118.0" cy="449.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><line x1="133.0" y1="449.0" x2="153.0" y2="449.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="63.0" y="481.0" font-size="14.5" fill="#14181d" text-anchor="start">3個が速さ2/3</text><text x="405.0" y="464.0" font-size="17" fill="#14181d" text-anchor="middle">3×2/3＝2　○</text><text x="680.0" y="464.0" font-size="17" fill="#c4442b" text-anchor="middle" font-weight="700">3×½×(2/3)²＝2/3　×</text><text x="996.0" y="464.0" font-size="16" fill="#6b6f76" text-anchor="middle" font-weight="700">起こらない（エネルギーがへる）</text><line x1="48.0" y1="490.0" x2="1152.0" y2="490.0" stroke="#e2ded4" stroke-width="1"/><circle cx="74.0" cy="515.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="96.0" cy="515.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="118.0" cy="515.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><circle cx="140.0" cy="515.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><line x1="155.0" y1="515.0" x2="170.0" y2="515.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="63.0" y="547.0" font-size="14.5" fill="#14181d" text-anchor="start">4個が速さ1/2</text><text x="405.0" y="530.0" font-size="17" fill="#14181d" text-anchor="middle">4×1/2＝2　○</text><text x="680.0" y="530.0" font-size="17" fill="#c4442b" text-anchor="middle" font-weight="700">4×½×(1/2)²＝1/2　×</text><text x="996.0" y="530.0" font-size="16" fill="#6b6f76" text-anchor="middle" font-weight="700">起こらない（エネルギーがへる）</text><line x1="290.0" y1="172.0" x2="290.0" y2="556.0" stroke="#e2ded4" stroke-width="1"/><line x1="520.0" y1="172.0" x2="520.0" y2="556.0" stroke="#e2ded4" stroke-width="1"/><line x1="840.0" y1="172.0" x2="840.0" y2="556.0" stroke="#e2ded4" stroke-width="1"/><text x="48.0" y="612.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">運動量だけならどれも同じ。エネルギーも同じになるのは「同じ数・同じ速さ」だけ。</text><text x="48" y="650" font-size="15" fill="#6b6f76">○＝ぶつける前と同じ　×＝ちがう。玉どうしの衝突でエネルギーがほとんど失われない（弾性衝突）とした場合。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>