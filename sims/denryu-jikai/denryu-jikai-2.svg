="1.6" stroke-dasharray="4 3"/><path d="M360.0,272 A9,40 0 0 0 360.0,192" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M369.0,228.0 L374.2,238.4 L363.8,238.4Z" fill="#c4442b"/><path d="M385.0,192 A9,40 0 0 0 385.0,272" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M385.0,272 A9,40 0 0 0 385.0,192" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M410.0,192 A9,40 0 0 0 410.0,272" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M410.0,272 A9,40 0 0 0 410.0,192" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M419.0,228.0 L424.2,238.4 L413.8,238.4Z" fill="#c4442b"/><line x1="380.0" y1="232.0" x2="240.0" y2="232.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><text x="180.0" y="240.0" font-size="26" fill="#c4442b" text-anchor="end" font-weight="700">N</text><text x="440.0" y="240.0" font-size="26" fill="#2c6b86" text-anchor="start" font-weight="700">S</text><text x="68.0" y="326.0" font-size="15.5" fill="#14181d" text-anchor="start">右手の4本の指を電流の向きに合わせてにぎると、親指の側がN極。</text><text x="68.0" y="348.5" font-size="15.5" fill="#14181d" text-anchor="start">（朱の矢印＝手前側の導線を流れる電流の向き）</text><text x="612.0" y="126.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">電流が受ける力の向き（電気ぶらんこ・モーター）</text><rect x="612.0" y="140.0" width="540.0" height="210.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="612" y="140" width="540" height="42" rx="8" fill="#eef3f6"/><text x="702.0" y="166.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">電流の向き</text><text x="882.0" y="166.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">磁界の向き</text><text x="1062.0" y="166.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">力の向き</text><line x1="612.0" y1="182.0" x2="1152.0" y2="182.0" stroke="#e2ded4" stroke-width="1"/><text x="702.0" y="208.9" font-size="16" fill="#14181d" text-anchor="middle">もとのまま</text><text x="882.0" y="208.9" font-size="16" fill="#14181d" text-anchor="middle">もとのまま</text><text x="1062.0" y="208.9" font-size="16" fill="#14181d" text-anchor="middle">もとの向き</text><rect x="613" y="224" width="538" height="42" fill="#f7f5ef"/><line x1="612.0" y1="224.0" x2="1152.0" y2="224.0" stroke="#e2ded4" stroke-width="1"/><text x="702.0" y="250.9" font-size="16" fill="#14181d" text-anchor="middle">反対</text><text x="882.0" y="250.9" font-size="16" fill="#14181d" text-anchor="middle">もとのまま</text><text x="1062.0" y="250.9" font-size="16" fill="#14181d" text-anchor="middle">反対の向き</text><line x1="612.0" y1="266.0" x2="1152.0" y2="266.0" stroke="#e2ded4" stroke-width="1"/><text x="702.0" y="292.9" font-size="16" fill="#14181d" text-anchor="middle">もとのまま</text><text x="882.0" y="292.9" font-size="16" fill="#14181d" text-anchor="middle">反対</text><text x="1062.0" y="292.9" font-size="16" fill="#14181d" text-anchor="middle">反対の向き</text><rect x="613" y="308" width="538" height="42" fill="#f7f5ef"/><line x1="612.0" y1="308.0" x2="1152.0" y2="308.0" stroke="#e2ded4" stroke-width="1"/><text x="702.0" y="334.9" font-size="16" fill="#14181d" text-anchor="middle">反対</text><text x="882.0" y="334.9" font-size="16" fill="#14181d" text-anchor="middle">反対</text><text x="1062.0" y="334.9" font-size="16" fill="#14181d" text-anchor="middle">もとの向き</text><text x="48.0" y="392.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">電磁誘導（コイルに磁石を出し入れする）</text><rect x="48.0" y="406.0" width="540.0" height="204.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="406" width="540" height="34" rx="8" fill="#eef3f6"/><text x="133.0" y="427.8" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">操作</text><text x="308.0" y="427.8" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">検流計の針</text><text x="493.0" y="427.8" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">コイルの左はし</text><line x1="48.0" y1="440.0" x2="588.0" y2="440.0" stroke="#e2ded4" stroke-width="1"/><text x="133.0" y="461.8" font-size="15.5" fill="#14181d" text-anchor="middle">N極を入れる</text><text x="308.0" y="461.8" font-size="15.5" fill="#14181d" text-anchor="middle">右にふれる</text><text x="493.0" y="461.8" font-size="15.5" fill="#14181d" text-anchor="middle">N極</text><rect x="49" y="474" width="538" height="34" fill="#f7f5ef"/><line x1="48.0" y1="474.0" x2="588.0" y2="474.0" stroke="#e2ded4" stroke-width="1"/><text x="133.0" y="495.8" font-size="15.5" fill="#14181d" text-anchor="middle">N極を出す</text><text x="308.0" y="495.8" font-size="15.5" fill="#14181d" text-anchor="middle">左にふれる</text><text x="493.0" y="495.8" font-size="15.5" fill="#14181d" text-anchor="middle">S極</text><line x1="48.0" y1="508.0" x2="588.0" y2="508.0" stroke="#e2ded4" stroke-width="1"/><text x="133.0" y="529.8" font-size="15.5" fill="#14181d" text-anchor="middle">S極を入れる</text><text x="308.0" y="529.8" font-size="15.5" fill="#14181d" text-anchor="middle">左にふれる</text><text x="493.0" y="529.8" font-size="15.5" fill="#14181d" text-anchor="middle">S極</text><rect x="49" y="542" width="538" height="34" fill="#f7f5ef"/><line x1="48.0" y1="542.0" x2="588.0" y2="542.0" stroke="#e2ded4" stroke-width="1"/><text x="133.0" y="563.8" font-size="15.5" fill="#14181d" text-anchor="middle">S極を出す</text><text x="308.0" y="563.8" font-size="15.5" fill="#14181d" text-anchor="middle">右にふれる</text><text x="493.0" y="563.8" font-size="15.5" fill="#14181d" text-anchor="middle">N極</text><line x1="48.0" y1="576.0" x2="588.0" y2="576.0" stroke="#e2ded4" stroke-width="1"/><text x="133.0" y="597.8" font-size="15.5" fill="#14181d" text-anchor="middle">磁石を止める</text><text x="308.0" y="597.8" font-size="15.5" fill="#14181d" text-anchor="middle">ふれない</text><text x="493.0" y="597.8" font-size="15.5" fill="#14181d" text-anchor="middle">—</text><rect x="612.0" y="362.0" width="540.0" height="252.0" rx="12" fill="#f6eedc" stroke="#e2ded4" stroke-width="1.2"/><text x="632.0" y="394.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">強くする・大きくするには</text><text x="632.0" y="428.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">電磁石</text><text x="724.0" y="428.0" font-size="16" fill="#14181d" text-anchor="start">電流を大きく・巻き数をふやす・鉄しんを入れる</text><text x="632.0" y="460.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">力</text><text x="724.0" y="460.0" font-size="16" fill="#14181d" text-anchor="start">電流を大きく・磁石を強く</text><text x="632.0" y="492.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">誘導電流</text><text x="724.0" y="492.0" font-size="16" fill="#14181d" text-anchor="start">磁石を速く動かす・強い磁石・巻き数をふやす</text><line x1="632.0" y1="512.0" x2="1132.0" y2="512.0" stroke="#e2ded4" stroke-width="1.2"/><text x="632.0" y="540.0" font-size="15.5" fill="#3d434b" text-anchor="start">モーター：整流子で半回転ごとに電流の向きを切りかえ、</text><text x="632.0" y="563.2" font-size="15.5" fill="#3d434b" text-anchor="start">　　　　　同じ向きに回り続ける。</text><text x="632.0" y="586.5" font-size="15.5" fill="#3d434b" text-anchor="start">発電機：回し続けると向きが変わる電流（交流）ができる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">検流計は、N極を入れたときに右へふれるようにつないだ場合（シミュの図と同じ）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>