<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">電流と磁界のしくみ（3つの関係）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="100.0" width="352.0" height="512.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="76.0" cy="132.0" r="14.4" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="76.0" y="138.1" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="100.0" y="139.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">電流がつくる磁界</text><text x="68.0" y="170.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">右ねじの法則</text><text x="224.0" y="204.0" font-size="15" fill="#6b6f76" text-anchor="middle">上から見た図</text><circle cx="224.0" cy="330.0" r="42.0" fill="none" stroke="#2c6b86" stroke-width="2"/><path d="M258.4,305.9 L268.6,311.4 L260.1,317.4Z" fill="#2c6b86"/><path d="M189.6,354.1 L179.4,348.6 L187.9,342.6Z" fill="#2c6b86"/><circle cx="224.0" cy="330.0" r="78.0" fill="none" stroke="#2c6b86" stroke-width="2"/><path d="M287.9,285.3 L298.1,290.8 L289.6,296.8Z" fill="#2c6b86"/><path d="M160.1,374.7 L149.9,369.2 L158.4,363.2Z" fill="#2c6b86"/><circle cx="224.0" cy="330.0" r="112.0" fill="none" stroke="#2c6b86" stroke-width="2"/><path d="M315.7,265.8 L326.0,271.3 L317.5,277.3Z" fill="#2c6b86"/><path d="M132.3,394.2 L122.0,388.7 L130.5,382.7Z" fill="#2c6b86"/><circle cx="302.0" cy="330.0" r="18.0" fill="#ffffff" stroke="#6b6f76" stroke-width="1.4"/><polygon points="302.0,316.0 306.6,330.0 297.4,330.0" fill="#c4442b"/><polygon points="302.0,344.0 306.6,330.0 297.4,330.0" fill="#d6d0c2" stroke="#6b6f76" stroke-width="0.8"/><circle cx="302.0" cy="330.0" r="2.4" fill="#14181d" stroke="#14181d" stroke-width="0"/><circle cx="224.0" cy="252.0" r="18.0" fill="#ffffff" stroke="#6b6f76" stroke-width="1.4"/><polygon points="210.0,252.0 224.0,247.4 224.0,256.6" fill="#c4442b"/><polygon points="238.0,252.0 224.0,247.4 224.0,256.6" fill="#d6d0c2" stroke="#6b6f76" stroke-width="0.8"/><circle cx="224.0" cy="252.0" r="2.4" fill="#14181d" stroke="#14181d" stroke-width="0"/><circle cx="146.0" cy="330.0" r="18.0" fill="#ffffff" stroke="#6b6f76" stroke-width="1.4"/><polygon points="146.0,344.0 141.4,330.0 150.6,330.0" fill="#c4442b"/><polygon points="146.0,316.0 141.4,330.0 150.6,330.0" fill="#d6d0c2" stroke="#6b6f76" stroke-width="0.8"/><circle cx="146.0" cy="330.0" r="2.4" fill="#14181d" stroke="#14181d" stroke-width="0"/><circle cx="224.0" cy="408.0" r="18.0" fill="#ffffff" stroke="#6b6f76" stroke-width="1.4"/><polygon points="238.0,408.0 224.0,412.6 224.0,403.4" fill="#c4442b"/><polygon points="210.0,408.0 224.0,412.6 224.0,403.4" fill="#d6d0c2" stroke="#6b6f76" stroke-width="0.8"/><circle cx="224.0" cy="408.0" r="2.4" fill="#14181d" stroke="#14181d" stroke-width="0"/><circle cx="224.0" cy="330.0" r="17.0" fill="#ffffff" stroke="#c4442b" stroke-width="2.6"/><circle cx="224.0" cy="330.0" r="4.5" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="364.0" y="426.0" font-size="16" fill="#2c6b86" text-anchor="end" font-weight="700">磁界</text><text x="68.0" y="476.0" font-size="15.5" fill="#14181d" text-anchor="start">⊙＝電流が上向き（見ている人の方へ）</text><text x="68.0" y="500.0" font-size="15.5" fill="#14181d" text-anchor="start">→ 磁界は上から見て反時計回り</text><text x="68.0" y="524.0" font-size="15.5" fill="#14181d" text-anchor="start">右ねじを電流の向きに進めるとき、</text><text x="68.0" y="548.1" font-size="15.5" fill="#14181d" text-anchor="start">ねじを回す向き＝磁界の向き</text><rect x="424.0" y="100.0" width="352.0" height="512.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="452.0" cy="132.0" r="14.4" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="452.0" y="138.1" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="476.0" y="139.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">電流が磁界から受ける力</text><text x="444.0" y="170.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">フレミングの左手の法則</text><rect x="444.0" y="230.0" width="54.0" height="116.0" rx="4" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="471.0" y="297.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">N</text><rect x="702.0" y="230.0" width="54.0" height="116.0" rx="4" fill="#eef3f6" stroke="#2c6b86" stroke-width="2"/><text x="729.0" y="297.0" font-size="26" fill="#2c6b86" text-anchor="middle" font-weight="700">S</text><line x1="506.0" y1="250.0" x2="692.0" y2="250.0" stroke="#2c6b86" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="506.0" y1="326.0" x2="692.0" y2="326.0" stroke="#2c6b86" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="506.0" y1="288.0" x2="574.0" y2="288.0" stroke="#2c6b86" stroke-width="2.2" marker-end="url(#ah-teal)"/><line x1="622.0" y1="288.0" x2="692.0" y2="288.0" stroke="#2c6b86" stroke-width="2.2" marker-end="url(#ah-teal)"/><circle cx="600.0" cy="288.0" r="17.0" fill="#ffffff" stroke="#c4442b" stroke-width="2.6"/><line x1="589.5" y1="277.5" x2="610.5" y2="298.5" stroke="#c4442b" stroke-width="2.6"/><line x1="610.5" y1="277.5" x2="589.5" y2="298.5" stroke="#c4442b" stroke-width="2.6"/><line x1="600.0" y1="310.0" x2="600.0" y2="388.0" stroke="#3f8a5a" stroke-width="4" marker-end="url(#ah-green)"/><text x="614.0" y="382.0" font-size="20" fill="#3f8a5a" text-anchor="start" font-weight="700">力</text><text x="600.0" y="216.0" font-size="15" fill="#2c6b86" text-anchor="middle" font-weight="700">磁界（N極 → S極）</text><text x="444.0" y="370.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">⊗＝電流が</text><text x="444.0" y="392.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">紙の裏へ</text><text x="444.0" y="440.0" font-size="15.5" fill="#14181d" text-anchor="start">左手の3本の指を直角に開くと</text><text x="460.0" y="466.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">中指 ＝ 電流</text><text x="460.0" y="491.0" font-size="16" fill="#2c6b86" text-anchor="start" font-weight="700">人差し指 ＝ 磁界</text><text x="460.0" y="516.0" font-size="16" fill="#3f8a5a" text-anchor="start" font-weight="700">親指 ＝ 力</text><text x="554.0" y="516.0" font-size="15" fill="#3d434b" text-anchor="start">（中指から「電・磁・力」）</text><text x="444.0" y="562.0" font-size="15.5" fill="#3d434b" text-anchor="start">電流か磁界の一方を反対にすると、</text><text x="444.0" y="586.0" font-size="15.5" fill="#3d434b" text-anchor="start">力も反対の向きになる。</text><rect x="800.0" y="100.0" width="352.0" height="512.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="828.0" cy="132.0" r="14.4" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="828.0" y="138.1" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="852.0" y="139.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">電磁誘導</text><text x="820.0" y="170.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">磁界が変わると電流が流れる</text><rect x="818.0" y="245.0" width="42.0" height="34.0" rx="3" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.8"/><rect x="860.0" y="245.0" width="42.0" height="34.0" rx="3" fill="#fbeae6" stroke="#c4442b" stroke-width="1.8"/><text x="839.0" y="269.0" font-size="19" fill="#2c6b86" text-anchor="middle" font-weight="700">S</text><text x="881.0" y="269.0" font-size="19" fill="#c4442b" text-anchor="middle" font-weight="700">N</text><line x1="828.0" y1="222.0" x2="900.0" y2="222.0" stroke="#14181d" stroke-width="2.6" marker-end="url(#ah-ink)"/><text x="822.0" y="210.0" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">N極を近づける</text><path d="M950.0,218 A9,44 0 0 0 950.0,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M950.0,306 A9,44 0 0 0 950.0,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M959.0,258.0 L964.2,268.4 L953.8,268.4Z" fill="#c4442b"/><path d="M971.4,218 A9,44 0 0 0 971.4,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M971.4,306 A9,44 0 0 0 971.4,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M992.9,218 A9,44 0 0 0 992.9,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M992.9,306 A9,44 0 0 0 992.9,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M1001.9,258.0 L1007.1,268.4 L996.7,268.4Z" fill="#c4442b"/><path d="M1014.3,218 A9,44 0 0 0 1014.3,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M1014.3,306 A9,44 0 0 0 1014.3,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M1035.7,218 A9,44 0 0 0 1035.7,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M1035.7,306 A9,44 0 0 0 1035.7,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M1044.7,258.0 L1049.9,268.4 L1039.5,268.4Z" fill="#c4442b"/><path d="M1057.1,218 A9,44 0 0 0 1057.1,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M1057.1,306 A9,44 0 0 0 1057.1,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M1078.6,218 A9,44 0 0 0 1078.6,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M1078.6,306 A9,44 0 0 0 1078.6,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><path d="M1087.6,258.0 L1092.8,268.4 L1082.4,268.4Z" fill="#c4442b"/><path d="M1100.0,218 A9,44 0 0 0 1100.0,306" fill="none" stroke="#6b6f76" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M1100.0,306 A9,44 0 0 0 1100.0,218" fill="none" stroke="#9a6a1c" stroke-width="3.6"/><text x="946.0" y="206.0" font-size="22" fill="#c4442b" text-anchor="middle" font-weight="700">N</text><text x="1108.0" y="206.0" font-size="22" fill="#2c6b86" text-anchor="middle" font-weight="700">S</text><line x1="1060.0" y1="262.0" x2="980.0" y2="262.0" stroke="#2c6b86" stroke-width="2.2" marker-end="url(#ah-teal)"/><polyline points="950.0,306.0 950.0,400.0 980.0,400.0" fill="none" stroke="#14181d" stroke-width="2" stroke-linejoin="round"/><polyline points="1100.0,306.0 1100.0,400.0 1072.0,400.0" fill="none" stroke="#14181d" stroke-width="2" stroke-linejoin="round"/><rect x="980.0" y="370.0" width="92.0" height="56.0" rx="8" fill="#ffffff" stroke="#3d434b" stroke-width="1.6"/><path d="M996,408 A34,34 0 0 1 1056,408" fill="none" stroke="#6b6f76" stroke-width="1.4"/><line x1="1026.0" y1="418.0" x2="1045.3" y2="395.0" stroke="#c4442b" stroke-width="2.6"/><circle cx="1026.0" cy="418.0" r="3.5" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="1026.0" y="450.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">検流計（針がふれる）</text><text x="820.0" y="476.0" font-size="15.5" fill="#14181d" text-anchor="start">コイルの左はしがN極になり、</text><text x="820.0" y="500.0" font-size="15.5" fill="#14181d" text-anchor="start">近づくN極をしりぞける</text><text x="820.0" y="524.0" font-size="15.5" fill="#14181d" text-anchor="start">向きに誘導電流が流れる。</text><text x="820.0" y="548.1" font-size="15.5" fill="#14181d" text-anchor="start">磁石を止めると電流は流れない。</text><text x="48" y="650" font-size="15" fill="#6b6f76">朱＝電流、藍＝磁界（磁力線）、緑＝力。方位磁針は色のついた方がN極。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>