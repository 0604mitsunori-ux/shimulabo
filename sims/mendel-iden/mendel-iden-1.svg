#14181d" text-anchor="start" font-weight="700">生殖細胞</text><text x="60.0" y="438.0" font-size="14" fill="#6b6f76" text-anchor="start">（減数分裂）</text><text x="60.0" y="518.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">孫</text><line x1="186.0" y1="104.0" x2="186.0" y2="592.0" stroke="#e2ded4" stroke-width="1.4"/><circle cx="300.0" cy="140.0" r="26.0" fill="#d4e05c" stroke="#71801c" stroke-width="3.25"/><ellipse cx="290.9" cy="130.1" rx="7.8" ry="5.2" transform="rotate(-34 290.9 130.1)" fill="#fff" fill-opacity=".55"/><text x="338.0" y="137.0" font-size="24" fill="#14181d" text-anchor="start" font-weight="700">AA</text><text x="338.0" y="161.0" font-size="16" fill="#3d434b" text-anchor="start">丸い種子</text><text x="452.0" y="151.0" font-size="30" fill="#6b6f76" text-anchor="middle" font-weight="700">×</text><polygon points="565.5,140.0 564.5,145.6 559.1,149.2 555.6,152.4 554.5,158.1 551.3,163.4 545.3,163.3 540.0,160.3 535.4,160.1 529.4,162.1 523.9,160.2 522.4,154.1 522.2,148.6 518.7,144.9 514.5,140.0 515.5,134.4 520.9,130.8 524.4,127.6 525.5,121.9 528.7,116.6 534.7,116.7 540.0,119.7 544.6,119.9 550.6,117.9 556.1,119.8 557.6,125.9 557.8,131.4 561.3,135.1" fill="#b9bf5a" stroke="#5f6420" stroke-width="3.2" stroke-linejoin="round"/><path d="M539.8,131.5 A11.7,11.7 0 0 1 540.8,150.5" fill="none" stroke="#505418" stroke-opacity=".8" stroke-width="2.4"/><path d="M542.4,144.8 A9.1,9.1 0 0 1 541.9,130.5" fill="none" stroke="#505418" stroke-opacity=".8" stroke-width="2.4"/><text x="578.0" y="137.0" font-size="24" fill="#14181d" text-anchor="start" font-weight="700">aa</text><text x="578.0" y="161.0" font-size="16" fill="#3d434b" text-anchor="start">しわのある種子</text><line x1="300.0" y1="170.0" x2="300.0" y2="206.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><line x1="540.0" y1="170.0" x2="540.0" y2="206.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><circle cx="300.0" cy="228.0" r="18.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="300.0" y="235.0" font-size="20" fill="#c4442b" text-anchor="middle" font-weight="700">A</text><circle cx="540.0" cy="228.0" r="18.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="2"/><text x="540.0" y="235.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">a</text><line x1="312.0" y1="244.0" x2="396.0" y2="296.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><line x1="528.0" y1="244.0" x2="438.0" y2="296.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><text x="420.0" y="268.0" font-size="15" fill="#6b6f76" text-anchor="middle" font-weight="700">受精</text><circle cx="418.0" cy="318.0" r="26.0" fill="#d4e05c" stroke="#71801c" stroke-width="3.25"/><ellipse cx="408.9" cy="308.1" rx="7.8" ry="5.2" transform="rotate(-34 408.9 308.1)" fill="#fff" fill-opacity=".55"/><text x="456.0" y="314.0" font-size="24" fill="#14181d" text-anchor="start" font-weight="700">Aa</text><text x="456.0" y="338.0" font-size="16" fill="#3d434b" text-anchor="start">すべて丸（顕性の形質）</text><line x1="404.0" y1="346.0" x2="368.0" y2="390.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><line x1="432.0" y1="346.0" x2="468.0" y2="390.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><circle cx="358.0" cy="410.0" r="18.0" fill="#fbeae6" stroke="#c4442b" stroke-width="2"/><text x="358.0" y="417.0" font-size="20" fill="#c4442b" text-anchor="middle" font-weight="700">A</text><circle cx="478.0" cy="410.0" r="18.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="2"/><text x="478.0" y="417.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">a</text><text x="512.0" y="406.0" font-size="18" fill="#c4442b" text-anchor="start" font-weight="700">A：a＝1：1</text><text x="512.0" y="430.0" font-size="15" fill="#3d434b" text-anchor="start">Aとaが分かれて入る</text><line x1="418.0" y1="434.0" x2="418.0" y2="474.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><text x="406.0" y="462.0" font-size="15" fill="#6b6f76" text-anchor="end" font-weight="700">自家受粉（子どうし）</text><circle cx="283.0" cy="512.0" r="24.0" fill="#d4e05c" stroke="#71801c" stroke-width="3.0"/><ellipse cx="274.6" cy="502.9" rx="7.2" ry="4.8" transform="rotate(-34 274.6 502.9)" fill="#fff" fill-opacity=".55"/><text x="283.0" y="560.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">AA</text><text x="283.0" y="584.0" font-size="16" fill="#3d434b" text-anchor="middle">丸</text><circle cx="373.0" cy="512.0" r="24.0" fill="#d4e05c" stroke="#71801c" stroke-width="3.0"/><ellipse cx="364.6" cy="502.9" rx="7.2" ry="4.8" transform="rotate(-34 364.6 502.9)" fill="#fff" fill-opacity=".55"/><text x="373.0" y="560.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">Aa</text><text x="373.0" y="584.0" font-size="16" fill="#3d434b" text-anchor="middle">丸</text><circle cx="463.0" cy="512.0" r="24.0" fill="#d4e05c" stroke="#71801c" stroke-width="3.0"/><ellipse cx="454.6" cy="502.9" rx="7.2" ry="4.8" transform="rotate(-34 454.6 502.9)" fill="#fff" fill-opacity=".55"/><text x="463.0" y="560.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">Aa</text><text x="463.0" y="584.0" font-size="16" fill="#3d434b" text-anchor="middle">丸</text><polygon points="574.5,512.0 571.0,516.1 570.6,520.5 571.1,526.4 567.7,530.5 561.8,530.2 557.1,529.8 553.0,532.7 547.7,535.2 543.1,532.5 541.1,527.0 538.4,523.6 533.2,521.5 529.6,517.3 531.5,512.0 535.0,507.9 535.4,503.5 534.9,497.6 538.3,493.5 544.2,493.8 548.9,494.2 553.0,491.3 558.3,488.8 562.9,491.5 564.9,497.0 567.6,500.4 572.8,502.5 576.4,506.7" fill="#b9bf5a" stroke="#5f6420" stroke-width="3.0" stroke-linejoin="round"/><path d="M552.8,504.1 A10.8,10.8 0 0 1 553.7,521.7" fill="none" stroke="#505418" stroke-opacity=".8" stroke-width="2.2"/><path d="M555.3,516.4 A8.4,8.4 0 0 1 554.7,503.2" fill="none" stroke="#505418" stroke-opacity=".8" stroke-width="2.2"/><text x="553.0" y="560.0" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">aa</text><text x="553.0" y="584.0" font-size="16" fill="#c4442b" text-anchor="middle" font-weight="700">しわ</text><text x="598.0" y="506.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">丸：しわ</text><text x="598.0" y="540.0" font-size="28" fill="#c4442b" text-anchor="start" font-weight="700">＝3：1</text><text x="230.0" y="614.0" font-size="15" fill="#6b6f76" text-anchor="start">4つの組み合わせは、どれも同じ確率（1/4ずつ）で起こる</text><rect x="740.0" y="104.0" width="412.0" height="152.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="740" y="104" width="6" height="152" rx="3" fill="#2c6b86"/><text x="762.0" y="136.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">顕性の形質と潜性の形質</text><text x="762.0" y="164.0" font-size="16" fill="#3d434b" text-anchor="start">純系どうしをかけ合わせたとき、</text><text x="762.0" y="188.8" font-size="16" fill="#3d434b" text-anchor="start">子に現れる形質（丸）＝顕性の形質</text><text x="762.0" y="213.6" font-size="16" fill="#3d434b" text-anchor="start">子に現れない形質（しわ）＝潜性の形質</text><text x="762.0" y="238.4" font-size="16" fill="#3d434b" text-anchor="start">Aは丸の遺伝子、aはしわの遺伝子。</text><rect x="740.0" y="270.0" width="412.0" height="127.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="740" y="270" width="6" height="127" rx="3" fill="#c4442b"/><text x="762.0" y="302.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">分離の法則</text><text x="762.0" y="330.0" font-size="16" fill="#3d434b" text-anchor="start">対になっている遺伝子（Aとa）は、</text><text x="762.0" y="354.8" font-size="16" fill="#3d434b" text-anchor="start">生殖細胞がつくられるとき（減数分裂）</text><text x="762.0" y="379.6" font-size="16" fill="#3d434b" text-anchor="start">に分かれて、別々の生殖細胞に入る。</text><rect x="740.0" y="411.0" width="412.0" height="127.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="740" y="411" width="6" height="127" rx="3" fill="#a97a24"/><text x="762.0" y="443.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">しわの遺伝子は消えていない</text><text x="762.0" y="471.0" font-size="16" fill="#3d434b" text-anchor="start">子（Aa）の中に、aは受けつがれている。</text><text x="762.0" y="495.8" font-size="16" fill="#3d434b" text-anchor="start">aをもつ生殖細胞どうしが受精した孫</text><text x="762.0" y="520.6" font-size="16" fill="#3d434b" text-anchor="start">（aa）で、しわが再び現れる。</text><text x="48" y="650" font-size="15" fill="#6b6f76">A＝丸（顕性）の遺伝子、a＝しわ（潜性）の遺伝子。種子の絵は模式図。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>