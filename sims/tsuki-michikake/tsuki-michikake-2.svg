<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">月の形と見える時刻・方角</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="60.0" y="104.0" width="540.0" height="470.0" rx="12" fill="#eef3f6" stroke="#e2ded4" stroke-width="1.2"/><path d="M100,520 A230.0,300 0 0 1 560,520" fill="none" stroke="#6b6f76" stroke-dasharray="5 6" stroke-width="1.6"/><rect x="60" y="520" width="540" height="54" fill="#d8cfb8"/><text x="100.0" y="556.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">東</text><text x="330.0" y="556.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">南</text><text x="560.0" y="556.0" font-size="20" fill="#14181d" text-anchor="middle" font-weight="700">西</text><text x="80.0" y="138.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">夕方6時ごろ、南を向いて見た空</text><circle cx="138.0" cy="474.0" r="26.0" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><circle cx="138.0" cy="474.0" r="26.0" fill="#f4d35e" stroke="#f4d35e" stroke-width="0"/><text x="172.0" y="480.0" font-size="14.5" fill="#14181d" text-anchor="start" font-weight="700">満月（東からのぼってくる）</text><circle cx="330.0" cy="228.0" r="26.0" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><path d="M330.0,202.0 A26,26 0 0 1 330.0,254.0 A0.00,26 0 0 0 330.0,202.0Z" fill="#f4d35e"/><text x="330.0" y="278.0" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">上弦の月（南の空）</text><circle cx="520.0" cy="450.0" r="26.0" fill="#3b3f46" stroke="#3b3f46" stroke-width="0"/><path d="M520.0,424.0 A26,26 0 0 1 520.0,476.0 A19.92,26 0 0 0 520.0,424.0Z" fill="#f4d35e"/><text x="520.0" y="500.0" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">三日月（西の空の低い所）</text><text x="330.0" y="400.0" font-size="14" fill="#6b6f76" text-anchor="middle">← 東からのぼり、南を通って、西へしずむ →</text><text x="640.0" y="138.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">形ごとの見えやすい時刻と方角（目安）</text><rect x="640.0" y="156.0" width="512.0" height="260.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="640" y="156" width="512" height="52" rx="8" fill="#eef3f6"/><text x="700.0" y="189.3" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">形</text><text x="855.0" y="189.3" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">南の空に来る時刻</text><text x="1051.0" y="189.3" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">見えやすい時間</text><line x1="640.0" y1="208.0" x2="1152.0" y2="208.0" stroke="#e2ded4" stroke-width="1"/><text x="700.0" y="241.3" font-size="16" fill="#14181d" text-anchor="middle">三日月</text><text x="855.0" y="241.3" font-size="16" fill="#14181d" text-anchor="middle">午後3時ごろ</text><text x="1051.0" y="241.3" font-size="16" fill="#14181d" text-anchor="middle">夕方の西の空</text><rect x="641" y="260" width="510" height="52" fill="#f7f5ef"/><line x1="640.0" y1="260.0" x2="1152.0" y2="260.0" stroke="#e2ded4" stroke-width="1"/><text x="700.0" y="293.3" font-size="16" fill="#14181d" text-anchor="middle">上弦の月</text><text x="855.0" y="293.3" font-size="16" fill="#14181d" text-anchor="middle">夕方6時ごろ</text><text x="1051.0" y="293.3" font-size="16" fill="#14181d" text-anchor="middle">夕方〜真夜中</text><line x1="640.0" y1="312.0" x2="1152.0" y2="312.0" stroke="#e2ded4" stroke-width="1"/><text x="700.0" y="345.3" font-size="16" fill="#14181d" text-anchor="middle">満月</text><text x="855.0" y="345.3" font-size="16" fill="#14181d" text-anchor="middle">真夜中0時ごろ</text><text x="1051.0" y="345.3" font-size="16" fill="#14181d" text-anchor="middle">一晩中</text><rect x="641" y="364" width="510" height="52" fill="#f7f5ef"/><line x1="640.0" y1="364.0" x2="1152.0" y2="364.0" stroke="#e2ded4" stroke-width="1"/><text x="700.0" y="397.3" font-size="16" fill="#14181d" text-anchor="middle">下弦の月</text><text x="855.0" y="397.3" font-size="16" fill="#14181d" text-anchor="middle">明け方6時ごろ</text><text x="1051.0" y="397.3" font-size="16" fill="#14181d" text-anchor="middle">真夜中〜朝</text><text x="640.0" y="452.0" font-size="15.5" fill="#3d434b" text-anchor="start">・新月は正午ごろ南の空に来る。そこから1日に約50分ずつおそくなる。</text><text x="640.0" y="476.0" font-size="15.5" fill="#3d434b" text-anchor="start">・どの月も、東からのぼって南を通り、西へしずむ</text><text x="640.0" y="500.1" font-size="15.5" fill="#3d434b" text-anchor="start">　（太陽と同じ動き方）。</text><text x="48" y="650" font-size="15" fill="#6b6f76">時刻は東京あたりの目安。季節や場所で少しずれる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>