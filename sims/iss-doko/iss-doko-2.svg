<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">ISSが見えるしくみと、見上げる高さ</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="56.0" y="124.0" font-size="16" fill="#a97a24" text-anchor="start" font-weight="700">太陽の光</text><line x1="52.0" y1="150.0" x2="112.0" y2="150.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="202.0" x2="112.0" y2="202.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="254.0" x2="112.0" y2="254.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="306.0" x2="112.0" y2="306.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="358.0" x2="112.0" y2="358.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="410.0" x2="112.0" y2="410.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="462.0" x2="112.0" y2="462.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="514.0" x2="112.0" y2="514.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="566.0" x2="112.0" y2="566.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><line x1="52.0" y1="618.0" x2="112.0" y2="618.0" stroke="#a97a24" stroke-width="2.2" marker-end="url(#ah-gold)"/><rect x="340" y="182" width="310" height="320" fill="#3a4656" opacity=".16"/><text x="600.0" y="282.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">地球の影</text><circle cx="340" cy="342" r="222" fill="none" stroke="#6b6f76" stroke-width="1.4" stroke-dasharray="6 5"/><circle cx="340.0" cy="342.0" r="160.0" fill="#d3e6f1" stroke="#5f8fae" stroke-width="1.8"/><path d="M340,182 A160,160 0 0 1 340,502Z" fill="#33495e"/><text x="276.0" y="348.0" font-size="20" fill="#1b4a63" text-anchor="middle" font-weight="700">昼</text><text x="404.0" y="348.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="700">夜</text><path d="M273.0,226.0 A134,134 0 0 0 224.0,275.0" fill="none" stroke="#14181d" stroke-width="2.2" marker-end="url(#ah-ink)"/><text x="280.0" y="272.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">自転</text><text x="332.0" y="212.0" font-size="14" fill="#1b4a63" text-anchor="end" font-weight="700">日の出のころ</text><text x="332.0" y="484.0" font-size="14" fill="#1b4a63" text-anchor="end" font-weight="700">日の入りのころ</text><line x1="378.7" y1="497.2" x2="309.1" y2="561.8" stroke="#c4442b" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="378.7" cy="497.2" r="6.0" fill="#14181d" stroke="#fff" stroke-width="1.4"/><circle cx="309.1" cy="561.8" r="28.0" fill="none" stroke="#f4d35e" stroke-width="3"/><rect x="305.1" y="558.6" width="8.0" height="6.4" rx="1" fill="#14181d" stroke="none" stroke-width="0"/><rect x="291.5" y="554.6" width="10.4" height="14.4" rx="1" fill="#4a78a8" stroke="#14181d" stroke-width="1"/><rect x="316.3" y="554.6" width="10.4" height="14.4" rx="1" fill="#4a78a8" stroke="#14181d" stroke-width="1"/><text x="273.1" y="567.8" font-size="15" fill="#c4442b" text-anchor="end" font-weight="700">日が当たって光るISS</text><text x="392.7" y="489.2" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">日没後の人</text><text x="392.7" y="509.2" font-size="14" fill="#14181d" text-anchor="start">（空は暗い）</text><rect x="541.8" y="422.0" width="8.0" height="6.4" rx="1" fill="#6b6f76" stroke="none" stroke-width="0"/><rect x="528.2" y="418.0" width="10.4" height="14.4" rx="1" fill="#4a78a8" stroke="#6b6f76" stroke-width="1"/><rect x="553.0" y="418.0" width="10.4" height="14.4" rx="1" fill="#4a78a8" stroke="#6b6f76" stroke-width="1"/><text x="571.8" y="411.2" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">夜おそくは</text><text x="571.8" y="431.2" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">影の中で見えない</text><text x="380.0" y="616.0" font-size="14" fill="#6b6f76" text-anchor="middle">北極の上から見た模式図（ISSの高さは大きくかいている）</text><text x="700.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">ページの距離と、見上げる高さ（目安）</text><rect x="700.0" y="146.0" width="452.0" height="240.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="700" y="146" width="452" height="48" rx="8" fill="#eef3f6"/><text x="770.0" y="176.7" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">ISSまでの距離</text><text x="900.0" y="176.7" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">見上げる高さ</text><text x="1056.0" y="176.7" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">見え方</text><line x1="700.0" y1="194.0" x2="1152.0" y2="194.0" stroke="#e2ded4" stroke-width="1"/><text x="770.0" y="224.7" font-size="16" fill="#14181d" text-anchor="middle">500km</text><text x="900.0" y="224.7" font-size="16" fill="#14181d" text-anchor="middle">約50°</text><text x="1056.0" y="224.7" font-size="16" fill="#14181d" text-anchor="middle">高い空</text><rect x="701" y="242" width="450" height="48" fill="#f7f5ef"/><line x1="700.0" y1="242.0" x2="1152.0" y2="242.0" stroke="#e2ded4" stroke-width="1"/><text x="770.0" y="272.7" font-size="16" fill="#14181d" text-anchor="middle">1,000km</text><text x="900.0" y="272.7" font-size="16" fill="#14181d" text-anchor="middle">約20°</text><text x="1056.0" y="272.7" font-size="16" fill="#14181d" text-anchor="middle">見やすい</text><line x1="700.0" y1="290.0" x2="1152.0" y2="290.0" stroke="#e2ded4" stroke-width="1"/><text x="770.0" y="320.7" font-size="16" fill="#14181d" text-anchor="middle">1,500km</text><text x="900.0" y="320.7" font-size="16" fill="#14181d" text-anchor="middle">約10°</text><text x="1056.0" y="320.7" font-size="16" fill="#14181d" text-anchor="middle">建物や山にかくれやすい</text><rect x="701" y="338" width="450" height="48" fill="#f7f5ef"/><line x1="700.0" y1="338.0" x2="1152.0" y2="338.0" stroke="#e2ded4" stroke-width="1"/><text x="770.0" y="368.7" font-size="16" fill="#14181d" text-anchor="middle">2,000km</text><text x="900.0" y="368.7" font-size="16" fill="#14181d" text-anchor="middle">ほぼ地平線</text><text x="1056.0" y="368.7" font-size="16" fill="#14181d" text-anchor="middle">見えにくい</text><text x="700.0" y="420.0" font-size="16" fill="#14181d" text-anchor="start">見えるのは、日の出前・日没後の暗い空で、</text><text x="700.0" y="444.8" font-size="16" fill="#14181d" text-anchor="start">ISSに太陽の光が当たっているとき。</text><text x="700.0" y="469.6" font-size="16" fill="#14181d" text-anchor="start">飛行機より速く、数分かけて空を横切る。</text><text x="700.0" y="534.0" font-size="14" fill="#3d434b" text-anchor="start">見上げる高さ＝地平線から何度の高さか（真上＝90°）</text><text x="700.0" y="558.0" font-size="14" fill="#3d434b" text-anchor="start">見える日時はJAXA「#きぼうを見よう」で調べられる</text><text x="48" y="650" font-size="15" fill="#6b6f76">距離はこのページの表示（ISSまでの直線距離）。高度400kmとして計算した目安で、天気や明るさでも変わる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>