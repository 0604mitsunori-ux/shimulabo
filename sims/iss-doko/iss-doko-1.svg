ll="#c4442b" text-anchor="start" font-weight="700">ISS 約400km</text><line x1="620.0" y1="551.0" x2="690.0" y2="551.0" stroke="#3d434b" stroke-width="1.4"/><line x1="620.0" y1="556.6" x2="690.0" y2="556.6" stroke="#3d434b" stroke-width="1.4"/><text x="712.0" y="547.0" font-size="15" fill="#14181d" text-anchor="start">飛行機 約10km</text><text x="712.0" y="567.0" font-size="15" fill="#14181d" text-anchor="start">富士山 3.8km</text><text x="712.0" y="330.0" font-size="15" fill="#3d434b" text-anchor="start">東京〜大阪の</text><text x="712.0" y="352.0" font-size="15" fill="#3d434b" text-anchor="start">直線距離（約400km）</text><text x="712.0" y="374.0" font-size="15" fill="#3d434b" text-anchor="start">と同じくらいの高さ</text><rect x="868.0" y="112.0" width="284.0" height="92.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="884.0" y="140.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">高さ</text><text x="884.0" y="172.0" font-size="23" fill="#c4442b" text-anchor="start" font-weight="700">約400km</text><text x="884.0" y="194.0" font-size="14" fill="#3d434b" text-anchor="start">地上から</text><rect x="868.0" y="212.0" width="284.0" height="92.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="884.0" y="240.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">速さ</text><text x="884.0" y="272.0" font-size="23" fill="#c4442b" text-anchor="start" font-weight="700">秒速 約7.7km</text><text x="884.0" y="294.0" font-size="14" fill="#3d434b" text-anchor="start">時速 約2万7,600km</text><rect x="868.0" y="312.0" width="284.0" height="92.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="884.0" y="340.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">1周</text><text x="884.0" y="372.0" font-size="23" fill="#c4442b" text-anchor="start" font-weight="700">約92分</text><text x="884.0" y="394.0" font-size="14" fill="#3d434b" text-anchor="start">（約90分）</text><rect x="868.0" y="412.0" width="284.0" height="92.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="884.0" y="440.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">1日に</text><text x="884.0" y="472.0" font-size="23" fill="#c4442b" text-anchor="start" font-weight="700">約15.6周</text><text x="884.0" y="494.0" font-size="14" fill="#3d434b" text-anchor="start">ISSでは1日に16回ほど日の出</text><rect x="868.0" y="512.0" width="284.0" height="92.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="884.0" y="540.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">1周ごとに</text><text x="884.0" y="572.0" font-size="23" fill="#c4442b" text-anchor="start" font-weight="700">西へ約23°ずれる</text><text x="884.0" y="594.0" font-size="14" fill="#3d434b" text-anchor="start">その間に地球が自転するため</text><text x="48" y="650" font-size="15" fill="#6b6f76">高度400kmの円軌道として計算（実際の高度は日によって少し変わる）。東京〜大阪を約52秒で飛ぶ速さ。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>