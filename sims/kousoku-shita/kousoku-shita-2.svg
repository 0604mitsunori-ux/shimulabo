<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">何kmなら高速？ 距離ごとの時短と料金の目安</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="640.0" y="120.0" width="498.0" height="40.0" rx="8" fill="#fbeae6" stroke="#fbeae6" stroke-width="1.2"/><text x="889.0" y="147.0" font-size="18" fill="#c4442b" text-anchor="middle" font-weight="700">この料金までなら高速のほうが得</text><rect x="60.0" y="168.0" width="1078.0" height="360.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="60" y="168" width="1078" height="60" rx="8" fill="#eef3f6"/><text x="115.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">距離</text><text x="245.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">高速の所要</text><text x="395.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">下道の所要</text><text x="555.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">短縮できる時間</text><text x="723.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">時給1,000円の人</text><text x="889.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">時給2,000円の人</text><text x="1055.0" y="206.4" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">時給3,000円の人</text><line x1="60.0" y1="228.0" x2="1138.0" y2="228.0" stroke="#e2ded4" stroke-width="1"/><text x="115.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">50km</text><text x="245.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">38分</text><text x="395.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">1時間26分</text><text x="555.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">48分</text><text x="723.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">約800円</text><text x="889.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">約1,600円</text><text x="1055.0" y="266.4" font-size="18" fill="#14181d" text-anchor="middle">約2,400円</text><rect x="61" y="288" width="1076" height="60" fill="#f7f5ef"/><line x1="60.0" y1="288.0" x2="1138.0" y2="288.0" stroke="#e2ded4" stroke-width="1"/><text x="115.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">100km</text><text x="245.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">1時間15分</text><text x="395.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">2時間51分</text><text x="555.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">1時間36分</text><text x="723.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">約1,600円</text><text x="889.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">約3,200円</text><text x="1055.0" y="326.4" font-size="18" fill="#14181d" text-anchor="middle">約4,800円</text><line x1="60.0" y1="348.0" x2="1138.0" y2="348.0" stroke="#e2ded4" stroke-width="1"/><text x="115.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">200km</text><text x="245.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">2時間30分</text><text x="395.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">5時間43分</text><text x="555.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">3時間13分</text><text x="723.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">約3,200円</text><text x="889.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">約6,400円</text><text x="1055.0" y="386.4" font-size="18" fill="#14181d" text-anchor="middle">約9,600円</text><rect x="61" y="408" width="1076" height="60" fill="#f7f5ef"/><line x1="60.0" y1="408.0" x2="1138.0" y2="408.0" stroke="#e2ded4" stroke-width="1"/><text x="115.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">300km</text><text x="245.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">3時間45分</text><text x="395.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">8時間34分</text><text x="555.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">4時間49分</text><text x="723.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">約4,800円</text><text x="889.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">約9,600円</text><text x="1055.0" y="446.4" font-size="18" fill="#14181d" text-anchor="middle">約14,500円</text><line x1="60.0" y1="468.0" x2="1138.0" y2="468.0" stroke="#e2ded4" stroke-width="1"/><text x="115.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">500km</text><text x="245.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">6時間15分</text><text x="395.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">14時間17分</text><text x="555.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">8時間2分</text><text x="723.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">約8,000円</text><text x="889.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">約16,100円</text><text x="1055.0" y="506.4" font-size="18" fill="#14181d" text-anchor="middle">約24,100円</text><text x="60.0" y="556.0" font-size="16" fill="#3d434b" text-anchor="start">高速の平均80km/h・下道の平均35km/h（シミュの初期値）で計算。100円単位で四捨五入。</text><text x="60.0" y="581.6" font-size="16" fill="#3d434b" text-anchor="start">料金が表の額より安ければ「時短1時間あたりの費用」が時給より安い＝高速のほうが得。</text><text x="48" y="650" font-size="15" fill="#6b6f76">例：300kmで高速料金6,000円なら、時短1時間あたり約1,244円。時給がこれより高い人には高速が得。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>