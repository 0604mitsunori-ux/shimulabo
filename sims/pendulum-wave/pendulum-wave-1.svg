<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">振り子の長さと、1往復する時間</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><line x1="66.0" y1="150.0" x2="686.0" y2="150.0" stroke="#14181d" stroke-width="6"/><line x1="96.0" y1="150.0" x2="96.0" y2="510.0" stroke="#6b6f76" stroke-width="1.4"/><circle cx="96.0" cy="510.0" r="11.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="1.6"/><text x="96.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">51</text><line x1="136.0" y1="150.0" x2="136.0" y2="496.3" stroke="#6b6f76" stroke-width="1.4"/><circle cx="136.0" cy="496.3" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="136.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">52</text><line x1="176.0" y1="150.0" x2="176.0" y2="483.3" stroke="#6b6f76" stroke-width="1.4"/><circle cx="176.0" cy="483.3" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="176.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">53</text><line x1="216.0" y1="150.0" x2="216.0" y2="471.1" stroke="#6b6f76" stroke-width="1.4"/><circle cx="216.0" cy="471.1" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="216.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">54</text><line x1="256.0" y1="150.0" x2="256.0" y2="459.5" stroke="#6b6f76" stroke-width="1.4"/><circle cx="256.0" cy="459.5" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="256.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">55</text><line x1="296.0" y1="150.0" x2="296.0" y2="448.6" stroke="#6b6f76" stroke-width="1.4"/><circle cx="296.0" cy="448.6" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="296.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">56</text><line x1="336.0" y1="150.0" x2="336.0" y2="438.2" stroke="#6b6f76" stroke-width="1.4"/><circle cx="336.0" cy="438.2" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="336.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">57</text><line x1="376.0" y1="150.0" x2="376.0" y2="428.3" stroke="#6b6f76" stroke-width="1.4"/><circle cx="376.0" cy="428.3" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="376.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">58</text><line x1="416.0" y1="150.0" x2="416.0" y2="419.0" stroke="#6b6f76" stroke-width="1.4"/><circle cx="416.0" cy="419.0" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="416.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">59</text><line x1="456.0" y1="150.0" x2="456.0" y2="410.1" stroke="#6b6f76" stroke-width="1.4"/><circle cx="456.0" cy="410.1" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="456.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">60</text><line x1="496.0" y1="150.0" x2="496.0" y2="401.6" stroke="#6b6f76" stroke-width="1.4"/><circle cx="496.0" cy="401.6" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="496.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">61</text><line x1="536.0" y1="150.0" x2="536.0" y2="393.6" stroke="#6b6f76" stroke-width="1.4"/><circle cx="536.0" cy="393.6" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="536.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">62</text><line x1="576.0" y1="150.0" x2="576.0" y2="385.9" stroke="#6b6f76" stroke-width="1.4"/><circle cx="576.0" cy="385.9" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="576.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">63</text><line x1="616.0" y1="150.0" x2="616.0" y2="378.6" stroke="#6b6f76" stroke-width="1.4"/><circle cx="616.0" cy="378.6" r="11.0" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="616.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">64</text><line x1="656.0" y1="150.0" x2="656.0" y2="371.6" stroke="#6b6f76" stroke-width="1.4"/><circle cx="656.0" cy="371.6" r="11.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="1.6"/><text x="656.0" y="606.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">65</text><text x="96.0" y="544.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">34.4cm</text><text x="376.0" y="462.3" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">26.6cm</text><text x="656.0" y="405.6" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">21.2cm</text><text x="66.0" y="580.0" font-size="15" fill="#3d434b" text-anchor="start">60秒間に往復する回数</text><text x="66.0" y="128.0" font-size="15" fill="#3d434b" text-anchor="start">長い（ゆっくり）</text><text x="686.0" y="128.0" font-size="15" fill="#3d434b" text-anchor="end">短い（速い）</text><rect x="724.0" y="112.0" width="428.0" height="168.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.2"/><text x="744.0" y="146.0" font-size="17" fill="#1b4a63" text-anchor="start" font-weight="700">1往復する時間（周期）は長さで決まる</text><text x="938.0" y="192.0" font-size="26" fill="#14181d" text-anchor="middle" font-weight="700" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif">T ＝ 2π√(L ÷ g)</text><text x="744.0" y="228.0" font-size="15" fill="#3d434b" text-anchor="start">T：周期（秒）　L：長さ（m）　g＝9.8 m/s²</text><text x="744.0" y="251.2" font-size="15" fill="#3d434b" text-anchor="start">おもりの重さやふれはばでは変わらない</text><text x="724.0" y="318.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">長さを4倍にすると、周期は2倍になる</text><rect x="724.0" y="336.0" width="428.0" height="176.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="724" y="336" width="428" height="44" rx="8" fill="#eef3f6"/><text x="776.0" y="364.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700"></text><text x="888.0" y="364.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">回数（60秒）</text><text x="996.0" y="364.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">1往復</text><text x="1098.0" y="364.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">長さ</text><line x1="724.0" y1="380.0" x2="1152.0" y2="380.0" stroke="#e2ded4" stroke-width="1"/><text x="776.0" y="408.2" font-size="16" fill="#14181d" text-anchor="middle">一番長い</text><text x="888.0" y="408.2" font-size="16" fill="#14181d" text-anchor="middle">51回</text><text x="996.0" y="408.2" font-size="16" fill="#14181d" text-anchor="middle">1.18秒</text><text x="1098.0" y="408.2" font-size="16" fill="#14181d" text-anchor="middle">34.4cm</text><rect x="725" y="424" width="426" height="44" fill="#f7f5ef"/><line x1="724.0" y1="424.0" x2="1152.0" y2="424.0" stroke="#e2ded4" stroke-width="1"/><text x="776.0" y="452.2" font-size="16" fill="#14181d" text-anchor="middle">まん中</text><text x="888.0" y="452.2" font-size="16" fill="#14181d" text-anchor="middle">58回</text><text x="996.0" y="452.2" font-size="16" fill="#14181d" text-anchor="middle">1.03秒</text><text x="1098.0" y="452.2" font-size="16" fill="#14181d" text-anchor="middle">26.6cm</text><line x1="724.0" y1="468.0" x2="1152.0" y2="468.0" stroke="#e2ded4" stroke-width="1"/><text x="776.0" y="496.2" font-size="16" fill="#14181d" text-anchor="middle">一番短い</text><text x="888.0" y="496.2" font-size="16" fill="#14181d" text-anchor="middle">65回</text><text x="996.0" y="496.2" font-size="16" fill="#14181d" text-anchor="middle">0.92秒</text><text x="1098.0" y="496.2" font-size="16" fill="#14181d" text-anchor="middle">21.2cm</text><text x="724.0" y="548.0" font-size="15.5" fill="#3d434b" text-anchor="start">長さの比は (51÷65)² ＝ 0.616。一番長い糸を</text><text x="724.0" y="572.0" font-size="15.5" fill="#3d434b" text-anchor="start">1mにすると、一番短い糸は約61.6cm。</text><text x="48" y="650" font-size="15" fill="#6b6f76">長さは本文の装置（60秒でそろう・g＝9.8m/s²）で計算。長い振り子ほど1往復に時間がかかる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>