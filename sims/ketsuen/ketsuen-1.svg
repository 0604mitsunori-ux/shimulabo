 fill="#3d434b" text-anchor="start">　1/4（25%）・4親等</text><text x="960.0" y="600.0" font-size="14" fill="#6b6f76" text-anchor="start">点線の箱は通り道</text><text x="48" y="650" font-size="15" fill="#6b6f76">父方・母方とも同じ割合。「父母」「祖父母」の箱は2人分をまとめて表す。孫・ひ孫は祖父母・曾祖父母と同じ割合。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>