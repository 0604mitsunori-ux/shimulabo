<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">鳥の群れ（ボイド）の3つのルール</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="104.0" width="352.0" height="424.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="80.0" cy="140.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="80.0" y="145.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="104.0" y="149.0" font-size="25" fill="#14181d" text-anchor="start" font-weight="700">分離</text><text x="164.0" y="148.0" font-size="16" fill="#3d434b" text-anchor="start">近づきすぎたら離れる</text><circle cx="224.0" cy="300.0" r="104.0" fill="none" stroke="#6b6f76" stroke-width="1.8" stroke-dasharray="6 5"/><text x="224.0" y="184.0" font-size="14" fill="#6b6f76" text-anchor="middle">見える範囲（半径40）</text><circle cx="224.0" cy="300.0" r="41.9" fill="#fbeae6" stroke="#c4442b" stroke-width="1.8" stroke-dasharray="4 4"/><text x="224.0" y="250.1" font-size="14" fill="#c4442b" text-anchor="middle">近すぎる範囲（約16）</text><polygon points="264.0,279.2 240.9,286.2 240.9,272.2" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="227.6,331.2 204.5,338.2 204.5,324.2" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="241.0,300.0 212.9,308.5 212.9,291.5" fill="#c4442b" stroke="none" stroke-width="1"/><line x1="224.0" y1="300.0" x2="165.8" y2="261.2" stroke="#c4442b" stroke-width="3.4" marker-end="url(#ah-acc)"/><text x="159.8" y="287.2" font-size="15" fill="#c4442b" text-anchor="end" font-weight="700">離れる向き</text><text x="72.0" y="446.0" font-size="16" fill="#3d434b" text-anchor="start">約16より近い仲間がいると、</text><text x="72.0" y="470.0" font-size="16" fill="#3d434b" text-anchor="start">その仲間と反対の向きに押される</text><text x="72.0" y="494.0" font-size="16" fill="#3d434b" text-anchor="start">（強さ 0.02）</text><rect x="424.0" y="104.0" width="352.0" height="424.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="456.0" cy="140.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="456.0" y="145.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="480.0" y="149.0" font-size="25" fill="#14181d" text-anchor="start" font-weight="700">整列</text><text x="540.0" y="148.0" font-size="16" fill="#3d434b" text-anchor="start">まわりと進む向きを合わせる</text><circle cx="600.0" cy="300.0" r="104.0" fill="none" stroke="#6b6f76" stroke-width="1.8" stroke-dasharray="6 5"/><text x="600.0" y="184.0" font-size="14" fill="#6b6f76" text-anchor="middle">見える範囲（半径40）</text><polygon points="543.1,254.6 529.9,274.8 520.9,264.1" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="618.4,202.7 610.9,225.7 599.4,217.6" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="595.9,364.8 581.0,383.8 572.9,372.3" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="677.0,336.4 666.7,358.2 656.3,348.9" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="532.4,321.8 519.9,342.5 510.6,332.1" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="617.0,300.0 589.0,308.5 589.0,291.5" fill="#c4442b" stroke="none" stroke-width="1"/><line x1="604.0" y1="300.0" x2="674.0" y2="300.0" stroke="#6b6f76" stroke-width="2" marker-end="url(#ah-muted)"/><text x="612.0" y="326.0" font-size="14" fill="#6b6f76" text-anchor="start">いまの向き</text><line x1="600.0" y1="300.0" x2="651.8" y2="250.0" stroke="#c4442b" stroke-width="3.4" marker-end="url(#ah-acc)"/><text x="661.8" y="244.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700" stroke="#fff" stroke-width="5" paint-order="stroke">仲間の</text><text x="661.8" y="263.5" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700" stroke="#fff" stroke-width="5" paint-order="stroke">平均の向き</text><text x="448.0" y="446.0" font-size="16" fill="#3d434b" text-anchor="start">見える範囲（半径40）の仲間の</text><text x="448.0" y="470.0" font-size="16" fill="#3d434b" text-anchor="start">平均の速度に、1コマごとに</text><text x="448.0" y="494.0" font-size="16" fill="#3d434b" text-anchor="start">5%ずつ近づける</text><rect x="800.0" y="104.0" width="352.0" height="424.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="832.0" cy="140.0" r="13.6" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="832.0" y="145.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="856.0" y="149.0" font-size="25" fill="#14181d" text-anchor="start" font-weight="700">結合</text><text x="916.0" y="148.0" font-size="16" fill="#3d434b" text-anchor="start">群れの中心へ寄っていく</text><circle cx="976.0" cy="300.0" r="104.0" fill="none" stroke="#6b6f76" stroke-width="1.8" stroke-dasharray="6 5"/><text x="976.0" y="184.0" font-size="14" fill="#6b6f76" text-anchor="middle">見える範囲（半径40）</text><polygon points="901.4,255.6 877.4,258.5 879.9,244.7" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="901.5,345.6 879.1,354.6 877.9,340.6" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="937.2,226.8 913.1,225.5 917.8,212.3" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="938.0,378.0 914.9,385.0 914.9,371.0" fill="#2c6b86" stroke="none" stroke-width="1"/><polygon points="976.0,283.0 984.5,311.1 967.5,311.1" fill="#c4442b" stroke="none" stroke-width="1"/><line x1="898.8" y1="293.0" x2="912.8" y2="307.0" stroke="#14181d" stroke-width="3"/><line x1="898.8" y1="307.0" x2="912.8" y2="293.0" stroke="#14181d" stroke-width="3"/><text x="905.8" y="328.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">重心</text><line x1="976.0" y1="300.0" x2="919.8" y2="300.0" stroke="#c4442b" stroke-width="3.4" marker-end="url(#ah-acc)"/><text x="947.9" y="286.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">重心へ寄る</text><text x="824.0" y="446.0" font-size="16" fill="#3d434b" text-anchor="start">見える範囲の仲間の重心（平均の</text><text x="824.0" y="470.0" font-size="16" fill="#3d434b" text-anchor="start">位置）へ向かう。強さは</text><text x="824.0" y="494.0" font-size="16" fill="#3d434b" text-anchor="start">重心までの距離×0.0008</text><rect x="48.0" y="542.0" width="1104.0" height="74.0" rx="10" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="70.0" y="572.0" font-size="16" fill="#1b4a63" text-anchor="start" font-weight="700">1コマごとの計算</text><text x="70.0" y="601.0" font-size="17" fill="#14181d" text-anchor="start">速度に「整列＋結合＋分離＋小さなゆらぎ」を足す → 速さは最大2.6まで → その速度で位置を動かす</text><text x="48" y="650" font-size="15" fill="#6b6f76">距離・速さはシミュの画面（520×360）の単位。どの鳥も、見える範囲の仲間だけを見て動いている。（大きさは見やすく拡大）</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>