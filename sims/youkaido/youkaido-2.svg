.0,269.3 583.5,266.0 587.0,262.7 590.5,259.4 594.0,256.1 597.5,252.6 601.0,249.1 604.5,245.6 608.0,242.0 611.5,238.5 615.0,235.0 618.5,231.5 622.0,227.9 625.5,224.4 629.0,220.9 632.5,217.4 636.0,213.8 639.5,210.3 643.0,206.8 646.5,203.3 650.0,199.7 653.5,196.2 657.0,192.7 660.5,189.2 664.0,185.6" fill="none" stroke="#c4442b" stroke-width="3.2" stroke-linejoin="round"/><text x="538.0" y="251.6" font-size="17" fill="#c4442b" text-anchor="end" font-weight="700">硝酸カリウム</text><line x1="542.0" y1="246.6" x2="569.5" y2="281.2" stroke="#c4442b" stroke-width="1.4"/><text x="604.5" y="187.5" font-size="17" fill="#6a5c82" text-anchor="end" font-weight="700">ミョウバン</text><text x="604.5" y="209.5" font-size="14" fill="#6a5c82" text-anchor="end">（80℃では321.6 g）</text><text x="412.0" y="473.6" font-size="17" fill="#3d434b" text-anchor="start" font-weight="700">食塩</text><text x="657.0" y="558.3" font-size="17" fill="#2c6b86" text-anchor="end" font-weight="700">ホウ酸</text><circle cx="524.0" cy="322.1" r="6.0" fill="#c4442b" stroke="#fff" stroke-width="1.5"/><line x1="516.0" y1="322.1" x2="248.0" y2="322.1" stroke="#14181d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-ink)"/><text x="384.0" y="312.1" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">60℃ → 20℃に冷やす</text><line x1="244.0" y1="322.1" x2="244.0" y2="499.7" stroke="#c4442b" stroke-width="4"/><circle cx="244.0" cy="499.7" r="6.0" fill="#c4442b" stroke="#fff" stroke-width="1.5"/><text x="234.0" y="398.9" font-size="15" fill="#c4442b" text-anchor="end" font-weight="700">出てくる結晶</text><text x="234.0" y="422.9" font-size="18" fill="#c4442b" text-anchor="end" font-weight="700">77.6 g</text><text x="234.0" y="444.9" font-size="14" fill="#c4442b" text-anchor="end">（109.2−31.6）</text><text x="712.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">溶解度曲線の読み方</text><text x="712.0" y="158.0" font-size="15.5" fill="#3d434b" text-anchor="start">・曲線の上の点＝水100 gに溶ける限度（飽和）</text><text x="712.0" y="182.8" font-size="15.5" fill="#3d434b" text-anchor="start">・曲線より下の点は全部溶ける。上の点は溶け残る</text><text x="712.0" y="207.6" font-size="15.5" fill="#3d434b" text-anchor="start">・水50 gなら、溶ける量はグラフの値の半分</text><text x="712.0" y="232.4" font-size="15.5" fill="#3d434b" text-anchor="start">・冷やして出てくる結晶＝溶けていた量−冷やした</text><text x="712.0" y="257.2" font-size="15.5" fill="#3d434b" text-anchor="start">　温度で溶ける限度</text><text x="712.0" y="318.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">水100 gの飽和水溶液を60℃→20℃に冷やすと</text><rect x="712.0" y="332.0" width="440.0" height="210.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="712" y="332" width="440" height="42" rx="8" fill="#eef3f6"/><text x="777.0" y="358.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700"></text><text x="888.0" y="358.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">60℃</text><text x="980.0" y="358.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">20℃</text><text x="1089.0" y="358.9" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">出てくる結晶</text><line x1="712.0" y1="374.0" x2="1152.0" y2="374.0" stroke="#e2ded4" stroke-width="1"/><text x="777.0" y="400.9" font-size="16" fill="#14181d" text-anchor="middle">硝酸カリウム</text><text x="888.0" y="400.9" font-size="16" fill="#14181d" text-anchor="middle">109.2 g</text><text x="980.0" y="400.9" font-size="16" fill="#14181d" text-anchor="middle">31.6 g</text><text x="1089.0" y="400.9" font-size="16" fill="#14181d" text-anchor="middle">77.6 g</text><rect x="713" y="416" width="438" height="42" fill="#f7f5ef"/><line x1="712.0" y1="416.0" x2="1152.0" y2="416.0" stroke="#e2ded4" stroke-width="1"/><text x="777.0" y="442.9" font-size="16" fill="#14181d" text-anchor="middle">ミョウバン</text><text x="888.0" y="442.9" font-size="16" fill="#14181d" text-anchor="middle">57.4 g</text><text x="980.0" y="442.9" font-size="16" fill="#14181d" text-anchor="middle">11.4 g</text><text x="1089.0" y="442.9" font-size="16" fill="#14181d" text-anchor="middle">46.0 g</text><line x1="712.0" y1="458.0" x2="1152.0" y2="458.0" stroke="#e2ded4" stroke-width="1"/><text x="777.0" y="484.9" font-size="16" fill="#14181d" text-anchor="middle">ホウ酸</text><text x="888.0" y="484.9" font-size="16" fill="#14181d" text-anchor="middle">14.9 g</text><text x="980.0" y="484.9" font-size="16" fill="#14181d" text-anchor="middle">4.9 g</text><text x="1089.0" y="484.9" font-size="16" fill="#14181d" text-anchor="middle">10.0 g</text><rect x="713" y="500" width="438" height="42" fill="#f7f5ef"/><line x1="712.0" y1="500.0" x2="1152.0" y2="500.0" stroke="#e2ded4" stroke-width="1"/><text x="777.0" y="526.9" font-size="16" fill="#14181d" text-anchor="middle">食塩</text><text x="888.0" y="526.9" font-size="16" fill="#14181d" text-anchor="middle">37.1 g</text><text x="980.0" y="526.9" font-size="16" fill="#14181d" text-anchor="middle">35.8 g</text><text x="1089.0" y="526.9" font-size="16" fill="#14181d" text-anchor="middle">1.3 g</text><text x="712.0" y="566.0" font-size="15" fill="#3d434b" text-anchor="start">食塩は温度で溶ける量がほとんど変わらないので、</text><text x="712.0" y="588.5" font-size="15" fill="#3d434b" text-anchor="start">冷やしても少ししか出てこない → 水を蒸発させて取り出す</text><text x="48" y="650" font-size="15" fill="#6b6f76">溶解度は理科年表・教科書で一般的な値（ミョウバンは結晶の質量で表した値）。教科書によって少しちがうことがある。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>