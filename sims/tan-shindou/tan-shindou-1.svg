<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker><marker id="ah-purple" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6a5c82"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">単振動のしくみ（等速円運動の正射影）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="60.0" y="128.0" font-size="17" fill="#2c6b86" text-anchor="start" font-weight="700">等速円運動</text><text x="60.0" y="152.0" font-size="15" fill="#2c6b86" text-anchor="start" font-weight="700">（半径 A・角速度 ω）</text><circle cx="300.0" cy="290.0" r="130.0" fill="none" stroke="#2c6b86" stroke-width="2"/><line x1="146.0" y1="290.0" x2="454.0" y2="290.0" stroke="#6b6f76" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M330,290 A30,30 0 0 0 319.3,267.0" fill="none" stroke="#2c6b86" stroke-width="2"/><text x="343.5" y="275.7" font-size="17" fill="#2c6b86" text-anchor="middle" font-weight="700">ωt</text><line x1="300.0" y1="290.0" x2="383.6" y2="190.4" stroke="#2c6b86" stroke-width="2"/><circle cx="300.0" cy="290.0" r="3.5" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="292.0" y="312.0" font-size="15" fill="#3d434b" text-anchor="end" font-weight="700">O</text><line x1="383.6" y1="190.4" x2="307.0" y2="126.1" stroke="#6a5c82" stroke-width="2.8" marker-end="url(#ah-purple)"/><text x="321.0" y="128.1" font-size="15" fill="#6a5c82" text-anchor="start" font-weight="700">速度（大きさ Aω）</text><line x1="383.6" y1="190.4" x2="332.1" y2="251.7" stroke="#c4442b" stroke-width="2.8" marker-end="url(#ah-acc)"/><text x="318.1" y="227.7" font-size="15" fill="#c4442b" text-anchor="end" font-weight="700">向心加速度</text><text x="318.1" y="247.9" font-size="15" fill="#c4442b" text-anchor="end" font-weight="700">（大きさ Aω²）</text><circle cx="383.6" cy="190.4" r="7.0" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="395.6" y="182.4" font-size="18" fill="#2c6b86" text-anchor="start" font-weight="700">P</text><line x1="383.6" y1="198.4" x2="383.6" y2="510.0" stroke="#2c6b86" stroke-width="1.6" stroke-dasharray="6 5"/><text x="393.6" y="440.0" font-size="15" fill="#2c6b86" text-anchor="start" font-weight="700">真下への影</text><text x="393.6" y="460.0" font-size="15" fill="#2c6b86" text-anchor="start" font-weight="700">（正射影）</text><rect x="56" y="494" width="12" height="66" fill="#e2ded4" stroke="#3d434b" stroke-width="1.2"/><line x1="56.0" y1="560.0" x2="470.0" y2="560.0" stroke="#3d434b" stroke-width="2.4"/><polyline points="68.0,537.0 76.0,537.0 85.7,528.0 105.1,546.0 124.5,528.0 143.9,546.0 163.3,528.0 182.7,546.0 202.1,528.0 221.5,546.0 240.9,528.0 260.3,546.0 279.7,528.0 299.1,546.0 318.5,528.0 337.9,546.0 347.6,537.0 353.6,537.0" fill="none" stroke="#3d434b" stroke-width="2" stroke-linejoin="round"/><rect x="353.6" y="514.0" width="60.0" height="46.0" rx="6" fill="#2c6b86" stroke="#1b4a63" stroke-width="1.4"/><text x="383.6" y="544.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">m</text><line x1="383.6" y1="494.0" x2="307.0" y2="494.0" stroke="#6a5c82" stroke-width="2.8" marker-end="url(#ah-purple)"/><text x="299.0" y="500.0" font-size="18" fill="#6a5c82" text-anchor="end" font-weight="700">v</text><line x1="383.6" y1="470.0" x2="332.1" y2="470.0" stroke="#c4442b" stroke-width="2.8" marker-end="url(#ah-acc)"/><text x="324.1" y="476.0" font-size="18" fill="#c4442b" text-anchor="end" font-weight="700">a</text><line x1="170.0" y1="560.0" x2="170.0" y2="568.0" stroke="#3d434b" stroke-width="1.6"/><text x="170.0" y="588.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">−A</text><line x1="300.0" y1="560.0" x2="300.0" y2="568.0" stroke="#3d434b" stroke-width="1.6"/><text x="300.0" y="588.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">O</text><line x1="430.0" y1="560.0" x2="430.0" y2="568.0" stroke="#3d434b" stroke-width="1.6"/><text x="430.0" y="588.0" font-size="16" fill="#3d434b" text-anchor="middle" font-weight="700">+A</text><line x1="300.0" y1="500.0" x2="300.0" y2="560.0" stroke="#6b6f76" stroke-width="1.2" stroke-dasharray="3 4"/><text x="610.0" y="128.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">円運動を真下に写すと、単振動になる</text><circle cx="622.0" cy="166.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="622.0" y="171.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="644.0" y="172.0" font-size="16.5" fill="#3d434b" text-anchor="start">おもりの位置 x ＝ 点Pの影</text><text x="644.0" y="202.0" font-size="19" fill="#2c6b86" text-anchor="start" font-weight="700">x ＝ A cos ωt</text><circle cx="622.0" cy="242.0" r="12.8" fill="#6a5c82" stroke="#6a5c82" stroke-width="0"/><text x="622.0" y="247.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="644.0" y="248.0" font-size="16.5" fill="#3d434b" text-anchor="start">速度 v ＝ 円運動の速度の影</text><text x="644.0" y="278.0" font-size="19" fill="#6a5c82" text-anchor="start" font-weight="700">v ＝ −Aω sin ωt　（速さの最大値 Aω）</text><circle cx="622.0" cy="318.0" r="12.8" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="622.0" y="323.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="644.0" y="324.0" font-size="16.5" fill="#3d434b" text-anchor="start">加速度 a ＝ 向心加速度の影</text><text x="644.0" y="354.0" font-size="19" fill="#c4442b" text-anchor="start" font-weight="700">a ＝ −Aω² cos ωt ＝ −ω²x</text><circle cx="622.0" cy="394.0" r="12.8" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="622.0" y="399.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="644.0" y="400.0" font-size="16.5" fill="#3d434b" text-anchor="start">運動方程式 ma ＝ −kx とくらべると</text><text x="644.0" y="430.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">ω ＝ √(k/m)　→　T ＝ 2π/ω ＝ 2π√(m/k)</text><rect x="610.0" y="470.0" width="540.0" height="140.0" rx="10" fill="#eef3f6" stroke="#e2ded4" stroke-width="1.2"/><text x="628.0" y="500.0" font-size="15.5" fill="#3d434b" text-anchor="start" font-weight="700">例（シミュの最初の設定）k＝20 N/m、m＝0.50 kg、A＝0.10 m</text><text x="628.0" y="534.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">ω ＝ √(20÷0.50) ＝ 6.32 rad/s　　T ＝ 0.993 s</text><text x="628.0" y="566.0" font-size="17" fill="#6a5c82" text-anchor="start" font-weight="700">速さの最大値 Aω ＝ 0.632 m/s</text><text x="628.0" y="596.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">加速度の大きさの最大値 Aω² ＝ 4.00 m/s²</text><text x="48" y="650" font-size="15" fill="#6b6f76">x＝A cos ωt は、時刻0に端（x＝＋A）ではなしたとき（シミュの動き）。矢印の長さは見やすくかいた。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>