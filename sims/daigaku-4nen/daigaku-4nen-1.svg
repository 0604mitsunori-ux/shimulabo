chor="end" font-weight="700">私立 理系</text><rect x="230.0" y="304.0" width="675.0" height="50.0" rx="6" fill="#c4442b" stroke="#c4442b" stroke-width="1.2"/><text x="919.0" y="328.0" font-size="22" fill="#c4442b" text-anchor="start" font-weight="700" paint-order="stroke" stroke="#faf8f3" stroke-width="6">約540万円</text><text x="919.0" y="350.0" font-size="15" fill="#3d434b" text-anchor="start" paint-order="stroke" stroke="#faf8f3" stroke-width="6">国公立より約300万円高い</text><text x="212.0" y="422.0" font-size="21" fill="#14181d" text-anchor="end" font-weight="700">医歯薬系</text><defs><linearGradient id="fade4" x1="0" x2="1"><stop offset="0" stop-color="#6a5c82"/><stop offset="0.75" stop-color="#6a5c82" stop-opacity="0.55"/><stop offset="1" stop-color="#6a5c82" stop-opacity="0.05"/></linearGradient></defs><rect x="230" y="386" width="875.0" height="50" rx="6" fill="url(#fade4)"/><line x1="1075.0" y1="411.0" x2="1141.0" y2="411.0" stroke="#14181d" stroke-width="2.6" marker-end="url(#ah-ink)"/><text x="250.0" y="419.0" font-size="19" fill="#fff" text-anchor="start" font-weight="700">さらに高額（大学・学部による）</text><text x="230.0" y="112.0" font-size="16" fill="#3d434b" text-anchor="start" font-weight="700">入学金＋授業料など（4年分）の目安</text><text x="60.0" y="516.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">このほかにかかるお金</text><rect x="60.0" y="528.0" width="532.0" height="80.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="80.0" y="560.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">＋ 教科書・PC・通学費・交際費など</text><text x="80.0" y="590.0" font-size="17" fill="#3d434b" text-anchor="start">シミュの初期値では4年で110万円</text><rect x="608.0" y="528.0" width="532.0" height="80.0" rx="10" fill="#f6eedc" stroke="#e8d9b5" stroke-width="1.2"/><text x="628.0" y="560.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">＋ 自宅外通学なら 家賃・生活費</text><text x="628.0" y="590.0" font-size="17" fill="#3d434b" text-anchor="start">4年で300〜500万円ほど上乗せが多い</text><text x="48" y="650" font-size="15" fill="#6b6f76">学費は大学・学部で大きく異なる目安。奨学金・教育ローン・授業料減免などの制度もある。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>