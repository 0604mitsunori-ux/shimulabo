" stroke="#b9b2a3" stroke-width="1"/><text x="1060.5" y="579.2" font-size="14.5" fill="#fff" text-anchor="middle" font-weight="700">6強</text><rect x="1085.0" y="560.2" width="27.0" height="24.6" rx="8" fill="#8e2a1a" stroke="#b9b2a3" stroke-width="1"/><text x="1098.5" y="579.2" font-size="14.5" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="48" y="650" font-size="15" fill="#6b6f76">震度の数字は例。実際の震度は、震源の深さ・距離・地盤によって変わる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>