<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">震度とマグニチュードのちがい</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><defs><clipPath id="under"><rect x="48" y="318" width="650" height="302"/></clipPath></defs><rect x="48" y="318" width="650" height="294" fill="#efe7d6"/><line x1="48.0" y1="318.0" x2="698.0" y2="318.0" stroke="#14181d" stroke-width="2.4"/><circle cx="190" cy="560" r="120" fill="none" stroke="#a97a24" stroke-width="2" stroke-dasharray="8 7" opacity=".75" clip-path="url(#under)"/><circle cx="190" cy="560" r="215" fill="none" stroke="#a97a24" stroke-width="2" stroke-dasharray="8 7" opacity=".75" clip-path="url(#under)"/><circle cx="190" cy="560" r="310" fill="none" stroke="#a97a24" stroke-width="2" stroke-dasharray="8 7" opacity=".75" clip-path="url(#under)"/><circle cx="190" cy="560" r="405" fill="none" stroke="#a97a24" stroke-width="2" stroke-dasharray="8 7" opacity=".75" clip-path="url(#under)"/><circle cx="190" cy="560" r="500" fill="none" stroke="#a97a24" stroke-width="2" stroke-dasharray="8 7" opacity=".75" clip-path="url(#under)"/><line x1="190.0" y1="544.0" x2="190.0" y2="318.0" stroke="#3d434b" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M181,318 l9,-14 l9,14z" fill="#14181d"/><text x="176.0" y="342.0" font-size="15" fill="#14181d" text-anchor="end" font-weight="700">震央</text><text x="178.0" y="445.0" font-size="15" fill="#3d434b" text-anchor="end">深さ</text><polygon points="190.0,538.0 195.3,552.7 210.9,553.2 198.6,562.8 202.9,577.8 190.0,569.0 177.1,577.8 181.4,562.8 169.1,553.2 184.7,552.7" fill="#c4442b" stroke="#fff" stroke-width="1.5"/><rect x="218" y="532" width="372" height="58" rx="6" fill="#efe7d6" opacity=".92"/><text x="224.0" y="554.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">震源（岩盤がずれ始めた所）</text><text x="224.0" y="580.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">マグニチュード M6.8（例）は、この地震に1つ</text><rect x="248.0" y="288.0" width="40.0" height="30.0" rx="0" fill="#ffffff" stroke="#14181d" stroke-width="1.6"/><path d="M243,288 L268.0,268 L293,288Z" fill="#ffffff" stroke="#14181d" stroke-width="1.6" stroke-linejoin="round"/><rect x="210.0" y="217.9" width="116.0" height="32.3" rx="8" fill="#d9744c" stroke="#b9b2a3" stroke-width="1"/><text x="268.0" y="242.8" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">震度6弱</text><text x="268.0" y="196.0" font-size="15" fill="#3d434b" text-anchor="middle">震源に近い町</text><rect x="438.0" y="288.0" width="40.0" height="30.0" rx="0" fill="#ffffff" stroke="#14181d" stroke-width="1.6"/><path d="M433,288 L458.0,268 L483,288Z" fill="#ffffff" stroke="#14181d" stroke-width="1.6" stroke-linejoin="round"/><rect x="400.0" y="217.9" width="116.0" height="32.3" rx="8" fill="#f3e3b5" stroke="#b9b2a3" stroke-width="1"/><text x="458.0" y="242.8" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">震度4</text><text x="458.0" y="196.0" font-size="15" fill="#3d434b" text-anchor="middle">少しはなれた町</text><rect x="620.0" y="288.0" width="40.0" height="30.0" rx="0" fill="#ffffff" stroke="#14181d" stroke-width="1.6"/><path d="M615,288 L640.0,268 L665,288Z" fill="#ffffff" stroke="#14181d" stroke-width="1.6" stroke-linejoin="round"/><rect x="582.0" y="217.9" width="116.0" height="32.3" rx="8" fill="#d3e2ea" stroke="#b9b2a3" stroke-width="1"/><text x="640.0" y="242.8" font-size="19" fill="#14181d" text-anchor="middle" font-weight="700">震度2</text><text x="640.0" y="196.0" font-size="15" fill="#3d434b" text-anchor="middle">遠い町</text><text x="48.0" y="126.0" font-size="17" fill="#1b4a63" text-anchor="start" font-weight="700">震度＝その場所の揺れの強さ。1つの地震でも場所ごとにちがう</text><text x="48.0" y="152.0" font-size="15" fill="#3d434b" text-anchor="start">震源から遠いほど小さくなり、地盤がやわらかい所は大きくなりやすい</text><rect x="730.0" y="104.0" width="422.0" height="300.0" rx="12" fill="#ffffff" stroke="#c4442b" stroke-width="1.6"/><text x="748.0" y="136.0" font-size="21" fill="#c4442b" text-anchor="start" font-weight="700">マグニチュード（M）</text><text x="748.0" y="166.0" font-size="16" fill="#14181d" text-anchor="start">地震そのものの規模（エネルギーの大きさ）。</text><text x="748.0" y="190.0" font-size="16" fill="#14181d" text-anchor="start">1つの地震に、値は1つだけ。</text><text x="748.0" y="228.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">M が 1 大きい → エネルギー約32倍</text><text x="748.0" y="256.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">M が 2 大きい → 約1000倍</text><rect x="752.0" y="280.0" width="15.0" height="15.0" rx="2" fill="#fbeae6" stroke="#c4442b" stroke-width="1"/><rect x="770.0" y="280.0" wi