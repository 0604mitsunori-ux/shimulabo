<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">震度階級の目安（気象庁の10階級）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="100.0" width="1104.0" height="522.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="100" width="1104" height="38" rx="8" fill="#eef3f6"/><text x="94.0" y="125.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">震度</text><text x="154.0" y="125.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">人の感じ方・行動</text><text x="640.0" y="125.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">屋内のようす</text><line x1="48.0" y1="138.0" x2="1152.0" y2="138.0" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="148.0" width="66.0" height="27.2" rx="8" fill="#eef1f3" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="169.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">0</text><text x="154.0" y="167.7" font-size="15" fill="#14181d" text-anchor="start">人は揺れを感じない（地震計には記録される）</text><text x="640.0" y="167.7" font-size="15" fill="#14181d" text-anchor="start">—</text><rect x="49" y="186.4" width="1102" height="48.4" fill="#f7f5ef"/><line x1="48.0" y1="186.4" x2="1152.0" y2="186.4" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="196.4" width="66.0" height="27.2" rx="8" fill="#e3ebf0" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="217.4" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">1</text><text x="154.0" y="216.1" font-size="15" fill="#14181d" text-anchor="start">屋内で静かにしている人の中に、わずかに感じる人がいる</text><text x="640.0" y="216.1" font-size="15" fill="#14181d" text-anchor="start">—</text><line x1="48.0" y1="234.8" x2="1152.0" y2="234.8" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="244.8" width="66.0" height="27.2" rx="8" fill="#d3e2ea" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="265.8" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">2</text><text x="154.0" y="264.5" font-size="15" fill="#14181d" text-anchor="start">屋内で静かにしている人の大半が感じる</text><text x="640.0" y="264.5" font-size="15" fill="#14181d" text-anchor="start">電灯などのつり下げ物がわずかに揺れる</text><rect x="49" y="283.2" width="1102" height="48.4" fill="#f7f5ef"/><line x1="48.0" y1="283.2" x2="1152.0" y2="283.2" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="293.2" width="66.0" height="27.2" rx="8" fill="#bcd3df" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="314.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">3</text><text x="154.0" y="303.4" font-size="15" fill="#14181d" text-anchor="start">屋内にいる人のほとんどが感じる。</text><text x="154.0" y="322.4" font-size="15" fill="#14181d" text-anchor="start">眠っている人の大半が目を覚ます</text><text x="640.0" y="312.9" font-size="15" fill="#14181d" text-anchor="start">棚の食器類が音を立てることがある</text><line x1="48.0" y1="331.6" x2="1152.0" y2="331.6" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="341.6" width="66.0" height="27.2" rx="8" fill="#f3e3b5" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="362.6" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">4</text><text x="154.0" y="361.3" font-size="15" fill="#14181d" text-anchor="start">ほとんどの人が驚く。眠っている人のほとんどが目を覚ます</text><text x="640.0" y="361.3" font-size="15" fill="#14181d" text-anchor="start">つり下げ物が大きく揺れる。座りの悪い置物が倒れることがある</text><rect x="49" y="380.0" width="1102" height="48.4" fill="#f7f5ef"/><line x1="48.0" y1="380.0" x2="1152.0" y2="380.0" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="390.0" width="66.0" height="27.2" rx="8" fill="#f2c98f" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="411.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">5弱</text><text x="154.0" y="409.7" font-size="15" fill="#14181d" text-anchor="start">大半の人が恐怖を覚え、物につかまりたいと感じる</text><text x="640.0" y="409.7" font-size="15" fill="#14181d" text-anchor="start">食器や本が落ちることがある。固定していない家具が動くことがある</text><line x1="48.0" y1="428.4" x2="1152.0" y2="428.4" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="438.4" width="66.0" height="27.2" rx="8" fill="#eaa76b" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="459.4" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">5強</text><text x="154.0" y="458.1" font-size="15" fill="#14181d" text-anchor="start">物につかまらないと歩くことが難しい</text><text x="640.0" y="458.1" font-size="15" fill="#14181d" text-anchor="start">落ちる食器や本が多くなる。固定していない家具が倒れることがある</text><rect x="49" y="476.8" width="1102" height="48.4" fill="#f7f5ef"/><line x1="48.0" y1="476.8" x2="1152.0" y2="476.8" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="486.8" width="66.0" height="27.2" rx="8" fill="#d9744c" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="507.8" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">6弱</text><text x="154.0" y="506.5" font-size="15" fill="#14181d" text-anchor="start">立っていることが困難になる</text><text x="640.0" y="497.0" font-size="15" fill="#14181d" text-anchor="start">固定していない家具の大半が動き、倒れるものもある。</text><text x="640.0" y="516.0" font-size="15" fill="#14181d" text-anchor="start">ドアが開かなくなることがある</text><line x1="48.0" y1="525.2" x2="1152.0" y2="525.2" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="535.2" width="66.0" height="27.2" rx="8" fill="#c4442b" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="556.2" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">6強</text><text x="154.0" y="554.9" font-size="15" fill="#14181d" text-anchor="start">立っていられず、はわないと動けない。飛ばされることもある</text><text x="640.0" y="554.9" font-size="15" fill="#14181d" text-anchor="start">固定していない家具のほとんどが動き、倒れるものが多くなる</text><rect x="49" y="573.6" width="1102" height="48.4" fill="#f7f5ef"/><line x1="48.0" y1="573.6" x2="1152.0" y2="573.6" stroke="#e2ded4" stroke-width="1"/><rect x="61.0" y="583.6" width="66.0" height="27.2" rx="8" fill="#8e2a1a" stroke="#b9b2a3" stroke-width="1"/><text x="94.0" y="604.6" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="154.0" y="603.3" font-size="15" fill="#14181d" text-anchor="start">（6強と同じ）</text><text x="640.0" y="593.8" font-size="15" fill="#14181d" text-anchor="start">固定していない家具のほとんどが動いたり倒れたりし、</text><text x="640.0" y="612.8" font-size="15" fill="#14181d" text-anchor="start">飛ぶこともある</text><line x1="140.0" y1="100.0" x2="140.0" y2="622.0" stroke="#e2ded4" stroke-width="1"/><line x1="626.0" y1="100.0" x2="626.0" y2="622.0" stroke="#e2ded4" stroke-width="1"/><text x="48" y="650" font-size="15" fill="#6b6f76">気象庁「震度階級関連解説表」を短くまとめたもの。表の現象がすべて起きるわけではない。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>