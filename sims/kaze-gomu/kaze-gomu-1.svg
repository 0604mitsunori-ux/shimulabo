<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">風の力・ゴムの力で、車が動くしくみ</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="60.0" y="136.0" font-size="22" fill="#2c6b86" text-anchor="start" font-weight="700">風の力</text><line x1="60.0" y1="318.0" x2="600.0" y2="318.0" stroke="#6b6f76" stroke-width="2"/><rect x="116" y="236" width="8" height="82" fill="#6b6f76"/><rect x="94.0" y="311.0" width="52.0" height="7.0" rx="3" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><circle cx="120.0" cy="236.0" r="42.0" fill="#e9e6df" stroke="#3d434b" stroke-width="2"/><circle cx="120.0" cy="236.0" r="28.0" fill="none" stroke="#6b6f76" stroke-width="1"/><circle cx="120.0" cy="236.0" r="5.0" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="120.0" y="344.0" font-size="15" fill="#3d434b" text-anchor="middle" font-weight="700">送風き</text><line x1="178.0" y1="200.0" x2="340.0" y2="200.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="178.0" y1="222.0" x2="340.0" y2="222.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="178.0" y1="244.0" x2="340.0" y2="244.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><line x1="178.0" y1="266.0" x2="340.0" y2="266.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><text x="259.0" y="188.0" font-size="17" fill="#2c6b86" text-anchor="middle" font-weight="700">風</text><line x1="350.0" y1="300.0" x2="350.0" y2="188.0" stroke="#7a5a2a" stroke-width="3"/><path d="M350,190 Q400,240 350,282Z" fill="#f6eedc" stroke="#a97a24" stroke-width="2"/><rect x="320.0" y="284.0" width="100.0" height="18.0" rx="5" fill="#7fb3d5" stroke="#1b4a63" stroke-width="1.6"/><circle cx="340.0" cy="309.0" r="9.0" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><circle cx="340.0" cy="309.0" r="2.5" fill="#fff" stroke="#fff" stroke-width="0"/><circle cx="400.0" cy="309.0" r="9.0" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><circle cx="400.0" cy="309.0" r="2.5" fill="#fff" stroke="#fff" stroke-width="0"/><line x1="384.0" y1="242.0" x2="470.0" y2="242.0" stroke="#c4442b" stroke-width="4" marker-end="url(#ah-acc)"/><text x="388.0" y="228.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">風が「ほ」をおす力</text><text x="480.0" y="304.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">→ 車が進む</text><rect x="650.0" y="112.0" width="500.0" height="206.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="672.0" y="158.0" font-size="21" fill="#1b4a63" text-anchor="start" font-weight="700">風が強いほど、おす力が大きい</text><text x="672.0" y="200.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">→ 車は遠くまで進む</text><text x="672.0" y="248.0" font-size="16" fill="#3d434b" text-anchor="start">風の強さをかえるには：</text><text x="672.0" y="278.0" font-size="17" fill="#3d434b" text-anchor="start" font-weight="700">送風きの風を「弱」→「強」にする</text><line x1="48.0" y1="352.0" x2="1152.0" y2="352.0" stroke="#e2ded4" stroke-width="1.6"/><text x="60.0" y="392.0" font-size="22" fill="#a97a24" text-anchor="start" font-weight="700">ゴムの力</text><line x1="60.0" y1="590.0" x2="600.0" y2="590.0" stroke="#6b6f76" stroke-width="2"/><rect x="335" y="516" width="10" height="74" fill="#8a6a3a"/><rect x="322.0" y="584.0" width="36.0" height="6.0" rx="2" fill="#6b4f27" stroke="#6b4f27" stroke-width="0"/><line x1="340.0" y1="524.0" x2="248.0" y2="564.0" stroke="#b4703a" stroke-width="3"/><line x1="340.0" y1="580.0" x2="248.0" y2="564.0" stroke="#b4703a" stroke-width="3"/><rect x="148.0" y="556.0" width="100.0" height="18.0" rx="5" fill="#7fb3d5" stroke="#1b4a63" stroke-width="1.6"/><circle cx="168.0" cy="581.0" r="9.0" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><circle cx="168.0" cy="581.0" r="2.5" fill="#fff" stroke="#fff" stroke-width="0"/><circle cx="228.0" cy="581.0" r="9.0" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><circle cx="228.0" cy="581.0" r="2.5" fill="#fff" stroke="#fff" stroke-width="0"/><circle cx="248.0" cy="564.0" r="4.0" fill="#14181d" stroke="#14181d" stroke-width="0"/><text x="352.0" y="538.0" font-size="14" fill="#6b6f76" text-anchor="start" font-weight="700">スタートの台</text><line x1="254.0" y1="498.0" x2="360.0" y2="498.0" stroke="#c4442b" stroke-width="4" marker-end="url(#ah-acc)"/><text x="188.0" y="478.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">ゴムがもとにもどろうとする力</text><line x1="248.0" y1="604.0" x2="340.0" y2="604.0" stroke="#3d434b" stroke-width="1.4"/><line x1="248.0" y1="596.0" x2="248.0" y2="612.0" stroke="#3d434b" stroke-width="1.4"/><line x1="340.0" y1="596.0" x2="340.0" y2="612.0" stroke="#3d434b" stroke-width="1.4"/><text x="352.0" y="610.0" font-size="15" fill="#3d434b" text-anchor="start" font-weight="700">← のばす長さ</text><text x="410.0" y="576.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">はなすと、車が進む →</text><rect x="650.0" y="372.0" width="500.0" height="238.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="672.0" y="418.0" font-size="21" fill="#a97a24" text-anchor="start" font-weight="700">ゴムを長くのばすほど、</text><text x="672.0" y="452.0" font-size="21" fill="#a97a24" text-anchor="start" font-weight="700">ゴムの本数をふやすほど、</text><text x="672.0" y="486.0" font-size="21" fill="#a97a24" text-anchor="start" font-weight="700">もとにもどろうとする力が大きい</text><text x="672.0" y="528.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">→ 車は遠くまで進む</text><text x="672.0" y="576.0" font-size="15.5" fill="#c4442b" text-anchor="start">ゴムを強く引っぱりすぎない。人に向けない。</text><text x="48" y="650" font-size="15" fill="#6b6f76">車・送風き・スタートの台は大きくかいている（大きさ・きょりは実際とちがう）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>