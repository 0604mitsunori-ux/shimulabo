#2c6b86"/><circle cx="159.0" cy="469.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M197.0,456.0 C199.2,462.8 208.2,470.2 208.2,476.2 A11.2,11.2 0 0 1 185.8,476.2 C185.8,470.2 194.8,462.8 197.0,456.0Z" fill="#2c6b86"/><circle cx="235.0" cy="469.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><circle cx="273.0" cy="469.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M311.0,456.0 C313.2,462.8 322.2,470.2 322.2,476.2 A11.2,11.2 0 0 1 299.8,476.2 C299.8,470.2 308.8,462.8 311.0,456.0Z" fill="#2c6b86"/><circle cx="349.0" cy="469.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><circle cx="387.0" cy="469.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><circle cx="425.0" cy="469.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M83.0,494.0 C85.2,500.8 94.2,508.2 94.2,514.2 A11.2,11.2 0 0 1 71.8,514.2 C71.8,508.2 80.8,500.8 83.0,494.0Z" fill="#2c6b86"/><circle cx="121.0" cy="507.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M159.0,494.0 C161.2,500.8 170.2,508.2 170.2,514.2 A11.2,11.2 0 0 1 147.8,514.2 C147.8,508.2 156.8,500.8 159.0,494.0Z" fill="#2c6b86"/><circle cx="197.0" cy="507.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><circle cx="235.0" cy="507.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M273.0,494.0 C275.2,500.8 284.2,508.2 284.2,514.2 A11.2,11.2 0 0 1 261.8,514.2 C261.8,508.2 270.8,500.8 273.0,494.0Z" fill="#2c6b86"/><circle cx="311.0" cy="507.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M349.0,494.0 C351.2,500.8 360.2,508.2 360.2,514.2 A11.2,11.2 0 0 1 337.8,514.2 C337.8,508.2 346.8,500.8 349.0,494.0Z" fill="#2c6b86"/><circle cx="387.0" cy="507.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><circle cx="425.0" cy="507.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><path d="M78.0,540.0 C79.8,545.4 87.0,551.4 87.0,556.2 A9.0,9.0 0 0 1 69.0,556.2 C69.0,551.4 76.2,545.4 78.0,540.0Z" fill="#2c6b86"/><text x="96.0" y="558.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">＝ 1mm以上の雨か雪が降った（約30回）</text><circle cx="78.0" cy="582.0" r="6.0" fill="#e3ded2" stroke="none" stroke-width="0"/><text x="96.0" y="588.0" font-size="16" fill="#14181d" text-anchor="start">＝ 降らなかった（1mm未満の小雨をふくむ）</text><text x="520.0" y="126.0" font-size="19" fill="#2c6b86" text-anchor="start" font-weight="700">降水確率は「降るかどうか」の確率</text><rect x="520.0" y="150.0" width="632.0" height="82.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="544.0" cy="172.0" r="15.3" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="544.0" y="178.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">×</text><text x="568.0" y="178.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">ではない：雨の量や強さ</text><text x="568.0" y="204.0" font-size="15.5" fill="#14181d" text-anchor="start">確率が高くても小雨のことがある。</text><text x="568.0" y="227.2" font-size="15.5" fill="#14181d" text-anchor="start">低くても、短い時間に強く降る雨（夕立）もある</text><rect x="520.0" y="242.0" width="632.0" height="58.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="544.0" cy="264.0" r="15.3" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="544.0" y="270.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">×</text><text x="568.0" y="270.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">ではない：その時間のうち雨が降る長さ</text><text x="568.0" y="296.0" font-size="15.5" fill="#14181d" text-anchor="start">30%でも「時間の3割が雨」ではない</text><rect x="520.0" y="310.0" width="632.0" height="58.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="544.0" cy="332.0" r="15.3" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="544.0" y="338.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">×</text><text x="568.0" y="338.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">ではない：地域のうち雨が降る広さ</text><text x="568.0" y="364.0" font-size="15.5" fill="#14181d" text-anchor="start">発表した区域の中なら、どこでも同じ確率</text><rect x="520.0" y="378.0" width="632.0" height="82.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="544.0" cy="400.0" r="15.3" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="544.0" y="406.5" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">○</text><text x="568.0" y="406.0" font-size="17" fill="#2c6b86" text-anchor="start" font-weight="700">10%きざみ・四捨五入</text><text x="568.0" y="432.0" font-size="15.5" fill="#14181d" text-anchor="start">0%は「5%未満」。1mm未満の雨は数えないので、</text><text x="568.0" y="455.2" font-size="15.5" fill="#14181d" text-anchor="start">0%でも小雨が降ることはある</text><text x="520.0" y="490.0" font-size="14.5" fill="#3d434b" text-anchor="start">このページの降水確率は気象モデル（Open-Meteo）の、</text><text x="520.0" y="511.8" font-size="14.5" fill="#3d434b" text-anchor="start">1時間ごとの確率（0.1mm以上）のうちその日いちばん高い値。</text><text x="520.0" y="533.5" font-size="14.5" fill="#3d434b" text-anchor="start">気象庁の予報と数字がちがうことがある。</text><text x="48" y="650" font-size="15" fill="#6b6f76">気象庁は、決まった時間に1mm以上の雨か雪が降る確率を10%きざみで発表（今日・明日は6時間ごと、週間予報は1日ごと）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>