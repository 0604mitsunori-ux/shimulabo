"56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="986.7" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1002.1" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1017.6" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1033.0" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1048.4" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1063.9" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1079.3" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1094.7" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1110.1" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><rect x="1125.6" y="180" width="13.4" height="56" rx="2" fill="#eef3f6" stroke="#c9dbe4" stroke-width="1"/><line x1="414.9" y1="162.0" x2="414.9" y2="244.0" stroke="#14181d" stroke-width="3"/><text x="414.9" y="154.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">欠課の上限 23コマ</text><path d="M62.0,250 v8 H212.3 v-8" fill="none" stroke="#c4442b" stroke-width="2"/><text x="137.1" y="284.0" font-size="16" fill="#c4442b" text-anchor="middle" font-weight="700">これまでの欠課</text><text x="137.1" y="310.0" font-size="20" fill="#c4442b" text-anchor="middle" font-weight="700">10コマ</text><path d="M216.3,250 v8 H412.9 v-8" fill="none" stroke="#a97a24" stroke-width="2"/><text x="314.6" y="284.0" font-size="16" fill="#a97a24" text-anchor="middle" font-weight="700">あと休める</text><text x="314.6" y="310.0" font-size="20" fill="#a97a24" text-anchor="middle" font-weight="700">13コマ</text><path d="M416.9,250 v8 H1138.0 v-8" fill="none" stroke="#2c6b86" stroke-width="2"/><text x="777.4" y="284.0" font-size="16" fill="#2c6b86" text-anchor="middle" font-weight="700">上限をこえないために出席が必要</text><text x="777.4" y="310.0" font-size="20" fill="#2c6b86" text-anchor="middle" font-weight="700">47コマ</text><rect x="60.0" y="340.0" width="1080.0" height="104.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="88.0" cy="374.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="88.0" y="379.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="112.0" y="380.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">欠課の上限 ＝ 年間授業時数 × 上限の割合（端数は切り捨て）</text><text x="1118.0" y="380.0" font-size="18" fill="#14181d" text-anchor="end" font-weight="700">70 × 33% ＝ 23.1 → 23コマ</text><circle cx="88.0" cy="418.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="88.0" y="423.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="112.0" y="424.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">あと休める回数 ＝ 欠課の上限 − これまでの欠課</text><text x="1118.0" y="424.0" font-size="18" fill="#c4442b" text-anchor="end" font-weight="700">23 − 10 ＝ 13コマ</text><text x="60.0" y="488.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">シミュの判定（あと休める回数）</text><rect x="60.0" y="502.0" width="218.0" height="64.0" rx="8" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="169.0" y="527.0" font-size="15" fill="#3d434b" text-anchor="middle">6コマ以上</text><text x="169.0" y="554.0" font-size="17" fill="#2c6b86" text-anchor="middle" font-weight="700">まだ余裕あり</text><rect x="290.0" y="502.0" width="218.0" height="64.0" rx="8" fill="#f6eedc" stroke="#a97a24" stroke-width="1.4"/><text x="399.0" y="527.0" font-size="15" fill="#3d434b" text-anchor="middle">3〜5コマ</text><text x="399.0" y="554.0" font-size="17" fill="#a97a24" text-anchor="middle" font-weight="700">余裕少なめ</text><rect x="520.0" y="502.0" width="238.0" height="64.0" rx="8" fill="#fbeae6" stroke="#c4442b" stroke-width="1.4"/><text x="639.0" y="527.0" font-size="15" fill="#3d434b" text-anchor="middle">0〜2コマ</text><text x="639.0" y="554.0" font-size="17" fill="#c4442b" text-anchor="middle" font-weight="700">危険ライン！注意</text><rect x="770.0" y="502.0" width="328.0" height="64.0" rx="8" fill="#f2d6cf" stroke="#c4442b" stroke-width="1.4"/><text x="934.0" y="527.0" font-size="15" fill="#3d434b" text-anchor="middle">マイナス</text><text x="934.0" y="554.0" font-size="17" fill="#c4442b" text-anchor="middle" font-weight="700">上限超過の可能性（要相談）</text><text x="60.0" y="600.0" font-size="15.5" fill="#3d434b" text-anchor="start">遅刻・早退を「3回で1欠課」などと換算する学校もある。基準は校則・担任に確認を。</text><text x="48" y="650" font-size="15" fill="#6b6f76">1マス＝1コマ。欠課が上限をこえると単位が認められないことがある（基準は学校でちがう）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>