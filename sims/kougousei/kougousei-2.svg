<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">光合成・蒸散の対照実験（まとめ）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="118.0" font-size="17" fill="#3d434b" text-anchor="start">対照実験：調べたい条件だけを変え、ほかの条件はすべて同じにして、結果をくらべる。</text><rect x="48.0" y="134.0" width="352.0" height="470.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="66.0" y="168.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">BTB溶液とオオカナダモ</text><text x="66.0" y="194.0" font-size="14.5" fill="#6b6f76" text-anchor="start">息をふきこんで緑色にした液を4本に分ける</text><line x1="60.0" y1="212.0" x2="388.0" y2="212.0" stroke="#e2ded4" stroke-width="1"/><circle cx="78.0" cy="242.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="78.0" y="247.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">A</text><text x="100.0" y="236.0" font-size="15" fill="#14181d" text-anchor="start">オオカナダモ あり</text><text x="100.0" y="258.0" font-size="15" fill="#3d434b" text-anchor="start">光：当てる</text><circle cx="284.0" cy="241.0" r="9.0" fill="#3f6fb5" stroke="#3d434b" stroke-width="1.2"/><text x="300.0" y="247.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">青色</text><line x1="60.0" y1="270.0" x2="388.0" y2="270.0" stroke="#e2ded4" stroke-width="1"/><circle cx="78.0" cy="300.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="78.0" y="305.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">B</text><text x="100.0" y="294.0" font-size="15" fill="#14181d" text-anchor="start">オオカナダモ あり</text><text x="100.0" y="316.0" font-size="15" fill="#3d434b" text-anchor="start">光：当てない（はく）</text><circle cx="284.0" cy="299.0" r="9.0" fill="#e3c13b" stroke="#3d434b" stroke-width="1.2"/><text x="300.0" y="305.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">黄色</text><line x1="60.0" y1="328.0" x2="388.0" y2="328.0" stroke="#e2ded4" stroke-width="1"/><circle cx="78.0" cy="358.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="78.0" y="363.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">C</text><text x="100.0" y="352.0" font-size="15" fill="#14181d" text-anchor="start">オオカナダモ なし</text><text x="100.0" y="374.0" font-size="15" fill="#3d434b" text-anchor="start">光：当てる</text><circle cx="284.0" cy="357.0" r="9.0" fill="#4f9a5e" stroke="#3d434b" stroke-width="1.2"/><text x="300.0" y="363.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">緑色のまま</text><line x1="60.0" y1="386.0" x2="388.0" y2="386.0" stroke="#e2ded4" stroke-width="1"/><circle cx="78.0" cy="416.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="78.0" y="421.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">D</text><text x="100.0" y="410.0" font-size="15" fill="#14181d" text-anchor="start">オオカナダモ なし</text><text x="100.0" y="432.0" font-size="15" fill="#3d434b" text-anchor="start">光：当てない（はく）</text><circle cx="284.0" cy="415.0" r="9.0" fill="#4f9a5e" stroke="#3d434b" stroke-width="1.2"/><text x="300.0" y="421.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">緑色のまま</text><line x1="60.0" y1="444.0" x2="388.0" y2="444.0" stroke="#e2ded4" stroke-width="1"/><rect x="60.0" y="464.0" width="328.0" height="128.0" rx="8" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="72.0" y="492.0" font-size="15.5" fill="#14181d" text-anchor="start">A と C：ちがうのはオオカナダモだけ</text><text x="72.0" y="517.1" font-size="15.5" fill="#14181d" text-anchor="start">→ 色の変化はオオカナダモのはたらき</text><text x="72.0" y="542.2" font-size="15.5" fill="#14181d" text-anchor="start">A と B：ちがうのは光だけ</text><text x="72.0" y="567.3" font-size="15.5" fill="#14181d" text-anchor="start">→ 光が当たると光合成で二酸化炭素が減る</text><rect x="424.0" y="134.0" width="352.0" height="470.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="442.0" y="168.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">ヨウ素液でデンプンを調べる</text><text x="442.0" y="194.0" font-size="14.5" fill="#6b6f76" text-anchor="start">ふ入りの葉の一部をアルミはくでおおう</text><line x1="436.0" y1="212.0" x2="764.0" y2="212.0" stroke="#e2ded4" stroke-width="1"/><circle cx="454.0" cy="242.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="454.0" y="247.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">a</text><text x="476.0" y="236.0" font-size="15" fill="#14181d" text-anchor="start">緑色の部分</text><text x="476.0" y="258.0" font-size="15" fill="#3d434b" text-anchor="start">光：当たる</text><circle cx="660.0" cy="241.0" r="9.0" fill="#4b2a6b" stroke="#3d434b" stroke-width="1.2"/><text x="676.0" y="247.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">青紫色</text><line x1="436.0" y1="270.0" x2="764.0" y2="270.0" stroke="#e2ded4" stroke-width="1"/><circle cx="454.0" cy="300.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="454.0" y="305.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">b</text><text x="476.0" y="294.0" font-size="15" fill="#14181d" text-anchor="start">ふ（白い部分）</text><text x="476.0" y="316.0" font-size="15" fill="#3d434b" text-anchor="start">光：当たる</text><circle cx="660.0" cy="299.0" r="9.0" fill="#d9b97c" stroke="#3d434b" stroke-width="1.2"/><text x="676.0" y="305.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">変化なし</text><line x1="436.0" y1="328.0" x2="764.0" y2="328.0" stroke="#e2ded4" stroke-width="1"/><circle cx="454.0" cy="358.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="454.0" y="363.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">c</text><text x="476.0" y="352.0" font-size="15" fill="#14181d" text-anchor="start">緑色の部分</text><text x="476.0" y="374.0" font-size="15" fill="#3d434b" text-anchor="start">光：当たらない（はく）</text><circle cx="660.0" cy="357.0" r="9.0" fill="#d9b97c" stroke="#3d434b" stroke-width="1.2"/><text x="676.0" y="363.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">変化なし</text><line x1="436.0" y1="386.0" x2="764.0" y2="386.0" stroke="#e2ded4" stroke-width="1"/><circle cx="454.0" cy="416.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="454.0" y="421.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">d</text><text x="476.0" y="410.0" font-size="15" fill="#14181d" text-anchor="start">ふ（白い部分）</text><text x="476.0" y="432.0" font-size="15" fill="#3d434b" text-anchor="start">光：当たらない（はく）</text><circle cx="660.0" cy="415.0" r="9.0" fill="#d9b97c" stroke="#3d434b" stroke-width="1.2"/><text x="676.0" y="421.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">変化なし</text><line x1="436.0" y1="444.0" x2="764.0" y2="444.0" stroke="#e2ded4" stroke-width="1"/><rect x="436.0" y="464.0" width="328.0" height="128.0" rx="8" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="448.0" y="492.0" font-size="15.5" fill="#14181d" text-anchor="start">a と c：ちがうのは光だけ</text><text x="448.0" y="517.1" font-size="15.5" fill="#14181d" text-anchor="start">→ デンプンをつくるには光が必要</text><text x="448.0" y="542.2" font-size="15.5" fill="#14181d" text-anchor="start">a と b：ちがうのは葉緑体があるかだけ</text><text x="448.0" y="567.3" font-size="15.5" fill="#14181d" text-anchor="start">→ デンプンは緑色の部分でできる</text><rect x="800.0" y="134.0" width="352.0" height="470.0" rx="12" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="818.0" y="168.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">蒸散（ワセリンでふさぐ）</text><text x="818.0" y="194.0" font-size="14.5" fill="#6b6f76" text-anchor="start">減った水の量（光の強さ100・6時間）</text><line x1="812.0" y1="212.0" x2="1140.0" y2="212.0" stroke="#e2ded4" stroke-width="1"/><circle cx="830.0" cy="242.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="830.0" y="247.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">A</text><text x="852.0" y="236.0" font-size="15" fill="#14181d" text-anchor="start">何もぬらない</text><text x="852.0" y="258.0" font-size="15" fill="#3d434b" text-anchor="start">表＋裏＋茎から</text><rect x="1052.0" y="253.0" width="88.0" height="9" rx="2" fill="#7fb3d5"/><text x="1052.0" y="247.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">5.2mL</text><line x1="812.0" y1="270.0" x2="1140.0" y2="270.0" stroke="#e2ded4" stroke-width="1"/><circle cx="830.0" cy="300.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="830.0" y="305.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">B</text><text x="852.0" y="294.0" font-size="15" fill="#14181d" text-anchor="start">葉の表にワセリン</text><text x="852.0" y="316.0" font-size="15" fill="#3d434b" text-anchor="start">裏＋茎から</text><rect x="1052.0" y="311.0" width="67.7" height="9" rx="2" fill="#7fb3d5"/><text x="1052.0" y="305.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">4.0mL</text><line x1="812.0" y1="328.0" x2="1140.0" y2="328.0" stroke="#e2ded4" stroke-width="1"/><circle cx="830.0" cy="358.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="830.0" y="363.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">C</text><text x="852.0" y="352.0" font-size="15" fill="#14181d" text-anchor="start">葉の裏にワセリン</text><text x="852.0" y="374.0" font-size="15" fill="#3d434b" text-anchor="start">表＋茎から</text><rect x="1052.0" y="369.0" width="27.1" height="9" rx="2" fill="#7fb3d5"/><text x="1052.0" y="363.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">1.6mL</text><line x1="812.0" y1="386.0" x2="1140.0" y2="386.0" stroke="#e2ded4" stroke-width="1"/><circle cx="830.0" cy="416.0" r="12.8" fill="#3d434b" stroke="#3d434b" stroke-width="0"/><text x="830.0" y="421.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">D</text><text x="852.0" y="410.0" font-size="15" fill="#14181d" text-anchor="start">葉をとる</text><text x="852.0" y="432.0" font-size="15" fill="#3d434b" text-anchor="start">茎だけから</text><rect x="1052.0" y="427.0" width="6.8" height="9" rx="2" fill="#7fb3d5"/><text x="1052.0" y="421.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">0.4mL</text><line x1="812.0" y1="444.0" x2="1140.0" y2="444.0" stroke="#e2ded4" stroke-width="1"/><rect x="812.0" y="464.0" width="328.0" height="128.0" rx="8" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="824.0" y="492.0" font-size="15.5" fill="#14181d" text-anchor="start">葉の裏から ＝ B − D ＝ 3.6mL</text><text x="824.0" y="517.1" font-size="15.5" fill="#14181d" text-anchor="start">葉の表から ＝ C − D ＝ 1.2mL</text><text x="824.0" y="542.2" font-size="15.5" fill="#14181d" text-anchor="start">→ 葉の裏からの蒸散が多い</text><text x="824.0" y="567.3" font-size="15.5" fill="#14181d" text-anchor="start">（気孔は葉の裏側に多い）</text><text x="48" y="650" font-size="15" fill="#6b6f76">BTB溶液：二酸化炭素が多いと黄色、少ないと青色。ヨウ素液：デンプンがあると青紫色。蒸散の量はシミュレーションの目安。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>