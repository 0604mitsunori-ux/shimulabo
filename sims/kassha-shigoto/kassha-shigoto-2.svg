.0" y="584.0" font-size="15" fill="#3d434b" text-anchor="middle">0</text><line x1="100.0" y1="560.0" x2="100.0" y2="180.0" stroke="#e2ded4" stroke-width="1"/><line x1="195.0" y1="560.0" x2="195.0" y2="566.0" stroke="#14181d" stroke-width="1.4"/><text x="195.0" y="584.0" font-size="15" fill="#3d434b" text-anchor="middle">0.5</text><line x1="195.0" y1="560.0" x2="195.0" y2="180.0" stroke="#e2ded4" stroke-width="1"/><line x1="290.0" y1="560.0" x2="290.0" y2="566.0" stroke="#14181d" stroke-width="1.4"/><text x="290.0" y="584.0" font-size="15" fill="#3d434b" text-anchor="middle">1</text><line x1="290.0" y1="560.0" x2="290.0" y2="180.0" stroke="#e2ded4" stroke-width="1"/><line x1="385.0" y1="560.0" x2="385.0" y2="566.0" stroke="#14181d" stroke-width="1.4"/><text x="385.0" y="584.0" font-size="15" fill="#3d434b" text-anchor="middle">1.5</text><line x1="385.0" y1="560.0" x2="385.0" y2="180.0" stroke="#e2ded4" stroke-width="1"/><line x1="480.0" y1="560.0" x2="480.0" y2="566.0" stroke="#14181d" stroke-width="1.4"/><text x="480.0" y="584.0" font-size="15" fill="#3d434b" text-anchor="middle">2</text><line x1="480.0" y1="560.0" x2="480.0" y2="180.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="560.0" x2="100.0" y2="560.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="565.0" font-size="15" fill="#3d434b" text-anchor="end">0</text><line x1="100.0" y1="560.0" x2="480.0" y2="560.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="465.0" x2="100.0" y2="465.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="470.0" font-size="15" fill="#3d434b" text-anchor="end">2.5</text><line x1="100.0" y1="465.0" x2="480.0" y2="465.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="370.0" x2="100.0" y2="370.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="375.0" font-size="15" fill="#3d434b" text-anchor="end">5</text><line x1="100.0" y1="370.0" x2="480.0" y2="370.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="275.0" x2="100.0" y2="275.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="280.0" font-size="15" fill="#3d434b" text-anchor="end">7.5</text><line x1="100.0" y1="275.0" x2="480.0" y2="275.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="180.0" x2="100.0" y2="180.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="185.0" font-size="15" fill="#3d434b" text-anchor="end">10</text><line x1="100.0" y1="180.0" x2="480.0" y2="180.0" stroke="#e2ded4" stroke-width="1"/><text x="100.0" y="156.0" font-size="15" fill="#14181d" text-anchor="middle">力（N）</text><text x="290.0" y="610.0" font-size="15" fill="#14181d" text-anchor="middle">力を加えて動かす距離（m）</text><rect x="100" y="465.0" width="380.0" height="95.0" fill="#f6eedc" fill-opacity=".55" stroke="#a97a24" stroke-width="2.2"/><rect x="100" y="370.0" width="190.0" height="190.0" fill="#eef3f6" fill-opacity=".55" stroke="#2c6b86" stroke-width="2.2"/><rect x="100" y="180.0" width="95.0" height="380.0" fill="#e9e6df" fill-opacity=".55" stroke="#3d434b" stroke-width="2.2"/><text x="147.5" y="206.0" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">直接・</text><text x="147.5" y="226.0" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">定滑車</text><text x="147.5" y="252.0" font-size="14" fill="#3d434b" text-anchor="middle">10N×0.5m</text><text x="242.5" y="396.0" font-size="14.5" fill="#1b4a63" text-anchor="middle" font-weight="700">動滑車など</text><text x="242.5" y="418.0" font-size="14" fill="#1b4a63" text-anchor="middle">5N×1m</text><text x="385.0" y="491.0" font-size="14.5" fill="#a97a24" text-anchor="middle" font-weight="700">動滑車2個</text><text x="385.0" y="511.0" font-size="14" fill="#a97a24" text-anchor="middle">2.5N×2m</text><text x="340.0" y="232.0" font-size="17" fill="#1b4a63" text-anchor="middle" font-weight="700">3つの長方形の面積は、どれも 5J</text><text x="340.0" y="260.0" font-size="15" fill="#3d434b" text-anchor="middle">力が半分なら距離は2倍、1/4なら4倍</text><text x="606.0" y="122.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">1000g（10N）を50cm持ち上げるとき</text><rect x="606.0" y="138.0" width="546.0" height="320.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="606" y="138" width="546" height="40" rx="8" fill="#eef3f6"/><text x="724.0" y="163.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">持ち上げ方</text><text x="894.0" y="163.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">必要な力</text><text x="998.0" y="163.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">動かす距離</text><text x="1101.0" y="163.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">仕事</text><line x1="606.0" y1="178.0" x2="1152.0" y2="178.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="203.6" font-size="15.5" fill="#14181d" text-anchor="middle">直接持ち上げる</text><text x="894.0" y="203.6" font-size="15.5" fill="#14181d" text-anchor="middle">10 N</text><text x="998.0" y="203.6" font-size="15.5" fill="#14181d" text-anchor="middle">0.5 m</text><text x="1101.0" y="203.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><rect x="607" y="218" width="544" height="40" fill="#f7f5ef"/><line x1="606.0" y1="218.0" x2="1152.0" y2="218.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="243.6" font-size="15.5" fill="#14181d" text-anchor="middle">定滑車</text><text x="894.0" y="243.6" font-size="15.5" fill="#14181d" text-anchor="middle">10 N</text><text x="998.0" y="243.6" font-size="15.5" fill="#14181d" text-anchor="middle">0.5 m</text><text x="1101.0" y="243.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><line x1="606.0" y1="258.0" x2="1152.0" y2="258.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="283.6" font-size="15.5" fill="#14181d" text-anchor="middle">動滑車</text><text x="894.0" y="283.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 N</text><text x="998.0" y="283.6" font-size="15.5" fill="#14181d" text-anchor="middle">1 m</text><text x="1101.0" y="283.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><rect x="607" y="298" width="544" height="40" fill="#f7f5ef"/><line x1="606.0" y1="298.0" x2="1152.0" y2="298.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="323.6" font-size="15.5" fill="#14181d" text-anchor="middle">定滑車＋動滑車</text><text x="894.0" y="323.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 N</text><text x="998.0" y="323.6" font-size="15.5" fill="#14181d" text-anchor="middle">1 m</text><text x="1101.0" y="323.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><line x1="606.0" y1="338.0" x2="1152.0" y2="338.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="363.6" font-size="15.5" fill="#14181d" text-anchor="middle">動滑車2個（＋定滑車）</text><text x="894.0" y="363.6" font-size="15.5" fill="#14181d" text-anchor="middle">2.5 N</text><text x="998.0" y="363.6" font-size="15.5" fill="#14181d" text-anchor="middle">2 m</text><text x="1101.0" y="363.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><rect x="607" y="378" width="544" height="40" fill="#f7f5ef"/><line x1="606.0" y1="378.0" x2="1152.0" y2="378.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="403.6" font-size="15.5" fill="#14181d" text-anchor="middle">斜面（長さ100cm）</text><text x="894.0" y="403.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 N</text><text x="998.0" y="403.6" font-size="15.5" fill="#14181d" text-anchor="middle">1 m</text><text x="1101.0" y="403.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><line x1="606.0" y1="418.0" x2="1152.0" y2="418.0" stroke="#e2ded4" stroke-width="1"/><text x="724.0" y="443.6" font-size="15.5" fill="#14181d" text-anchor="middle">てこ（支点からのきょり2:1）</text><text x="894.0" y="443.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 N</text><text x="998.0" y="443.6" font-size="15.5" fill="#14181d" text-anchor="middle">1 m</text><text x="1101.0" y="443.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 J</text><text x="606.0" y="494.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">仕事率（仕事 ÷ かかった時間）：5Jの仕事なら</text><rect x="606.0" y="508.0" width="546.0" height="80.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="606" y="508" width="546" height="40" rx="8" fill="#eef3f6"/><text x="659.0" y="533.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">時間</text><text x="756.0" y="533.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">1秒</text><text x="844.0" y="533.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">2秒</text><text x="932.0" y="533.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">5秒</text><text x="1020.0" y="533.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">10秒</text><text x="1108.0" y="533.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">20秒</text><line x1="606.0" y1="548.0" x2="1152.0" y2="548.0" stroke="#e2ded4" stroke-width="1"/><text x="659.0" y="573.6" font-size="15.5" fill="#14181d" text-anchor="middle">仕事率</text><text x="756.0" y="573.6" font-size="15.5" fill="#14181d" text-anchor="middle">5 W</text><text x="844.0" y="573.6" font-size="15.5" fill="#14181d" text-anchor="middle">2.5 W</text><text x="932.0" y="573.6" font-size="15.5" fill="#14181d" text-anchor="middle">1 W</text><text x="1020.0" y="573.6" font-size="15.5" fill="#14181d" text-anchor="middle">0.5 W</text><text x="1108.0" y="573.6" font-size="15.5" fill="#14181d" text-anchor="middle">0.25 W</text><text x="48" y="650" font-size="15" fill="#6b6f76">どの方法でも仕事は同じ（仕事の原理）。滑車・ひも・棒の重さと摩擦は考えない。100gの物体にはたらく重力＝1N。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>