 stroke-width="1.6"/><text x="203.5" y="164.0" font-size="15" fill="#3d434b" text-anchor="middle">平均年収</text><text x="203.5" y="200.0" font-size="26" fill="#14181d" text-anchor="middle" font-weight="700">500万円</text><text x="341.0" y="188.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">÷</text><rect x="371.0" y="134.0" width="215.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.6"/><text x="478.5" y="164.0" font-size="15" fill="#3d434b" text-anchor="middle">年間の労働時間</text><text x="478.5" y="200.0" font-size="26" fill="#14181d" text-anchor="middle" font-weight="700">約1,900時間</text><text x="616.0" y="188.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">＝</text><rect x="646.0" y="134.0" width="215.0" height="84.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="753.5" y="164.0" font-size="15" fill="#3d434b" text-anchor="middle">1人1時間あたり</text><text x="753.5" y="200.0" font-size="26" fill="#1b4a63" text-anchor="middle" font-weight="700">約2,632円</text><text x="925.0" y="164.0" font-size="14" fill="#6b6f76" text-anchor="start">1日約7.5時間×月20日</text><text x="925.0" y="185.0" font-size="14" fill="#6b6f76" text-anchor="start">×12か月＝1,800〜1,900時間</text><text x="925.0" y="206.0" font-size="14" fill="#6b6f76" text-anchor="start">という一般的な目安</text><rect x="96.0" y="276.0" width="215.0" height="84.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.6"/><text x="203.5" y="306.0" font-size="15" fill="#3d434b" text-anchor="middle">①の答え（1人1時間）</text><text x="203.5" y="342.0" font-size="26" fill="#1b4a63" text-anchor="middle" font-weight="700">約2,632円</text><text x="341.0" y="330.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">×</text><rect x="371.0" y="276.0" width="215.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.6"/><text x="478.5" y="306.0" font-size="15" fill="#3d434b" text-anchor="middle">参加人数</text><text x="478.5" y="342.0" font-size="26" fill="#14181d" text-anchor="middle" font-weight="700">6人</text><text x="616.0" y="330.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">×</text><rect x="646.0" y="276.0" width="215.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.6"/><text x="753.5" y="306.0" font-size="15" fill="#3d434b" text-anchor="middle">会議の時間</text><text x="753.5" y="342.0" font-size="26" fill="#14181d" text-anchor="middle" font-weight="700">1時間（60分）</text><text x="891.0" y="330.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">＝</text><rect x="921.0" y="276.0" width="215.0" height="84.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.6"/><text x="1028.5" y="306.0" font-size="15" fill="#3d434b" text-anchor="middle">会議1回の人件費</text><text x="1028.5" y="342.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">15,789円</text><rect x="96.0" y="418.0" width="215.0" height="84.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.6"/><text x="203.5" y="448.0" font-size="15" fill="#3d434b" text-anchor="middle">②の答え（会議1回）</text><text x="203.5" y="484.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">15,789円</text><text x="341.0" y="472.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">×</text><rect x="371.0" y="418.0" width="215.0" height="84.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.6"/><text x="478.5" y="448.0" font-size="15" fill="#3d434b" text-anchor="middle">開く回数</text><text x="478.5" y="484.0" font-size="26" fill="#14181d" text-anchor="middle" font-weight="700">毎週＝年52回</text><text x="616.0" y="472.0" font-size="30" fill="#3d434b" text-anchor="middle" font-weight="700">＝</text><rect x="646.0" y="418.0" width="215.0" height="84.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.6"/><text x="753.5" y="448.0" font-size="15" fill="#3d434b" text-anchor="middle">1年間の人件費</text><text x="753.5" y="484.0" font-size="26" fill="#c4442b" text-anchor="middle" font-weight="700">821,053円</text><text x="925.0" y="448.0" font-size="17" fill="#14181d" text-anchor="start">1分あたり 約263円</text><text x="925.0" y="475.2" font-size="17" fill="#14181d" text-anchor="start">1秒あたり 約4.4円</text><rect x="48.0" y="534.0" width="1104.0" height="76.0" rx="10" fill="#f6eedc" stroke="#e8d9b5" stroke-width="1.2"/><text x="72.0" y="564.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">コストは人数と時間に比例する</text><text x="72.0" y="592.0" font-size="16" fill="#3d434b" text-anchor="start">60分→45分にすると25%減（11,842円）、6人→4人にすると約33%減（10,526円）。</text><text x="48" y="650" font-size="15" fill="#6b6f76">社会保険料・オフィス代などは含まない概算。実際のコストはこれより高い（最低ラインの目安）。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>