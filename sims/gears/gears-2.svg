06.1,217.6 L325.3,219.9 L328.9,211.1 L313.8,199.2 L318.0,191.7 L336.0,198.9 L341.7,191.4 L330.2,175.9 L336.3,169.8 L351.8,181.3 L359.3,175.6 L352.1,157.6 L359.6,153.4 L371.5,168.5 L380.3,164.9 L378.0,145.7 L386.3,143.5 L393.9,161.2 L403.3,160.0 L406.1,140.9 L414.7,140.9 L417.5,160.0 L426.9,161.2 L434.5,143.5 L442.8,145.7 L440.5,164.9 L449.3,168.5 L461.2,153.4 L468.7,157.6 L461.5,175.6 L469.0,181.3 L484.5,169.8 L490.6,175.9 L479.1,191.4 L484.8,198.9 L502.8,191.7 L507.0,199.2 L491.9,211.1 L495.5,219.9 L514.7,217.6 L516.9,225.9 L499.2,233.5 L500.4,242.9 L519.5,245.7 L519.5,254.3 L500.4,257.1 L499.2,266.5 L516.9,274.1 L514.7,282.4 L495.5,280.1 L491.9,288.9 L507.0,300.8 L502.8,308.3 L484.8,301.1Z" fill="#f6eedc" stroke="#a97a24" stroke-width="2" stroke-linejoin="round"/><circle cx="410.4" cy="250.0" r="12.1" fill="#faf8f3" stroke="#a97a24" stroke-width="2"/><path d="M39.6,225.1 A72.80000000000001,72.80000000000001 0 0 1 132.9,181.6" fill="none" stroke="#2c6b86" stroke-width="3" marker-end="url(#ah-teal)"/><path d="M283.0,165.1 A98.00000000000001,98.00000000000001 0 0 0 185.0,165.1" fill="none" stroke="#14181d" stroke-width="3" marker-end="url(#ah-ink)"/><path d="M294.6,207.9 A123.20000000000002,123.20000000000002 0 0 1 452.5,134.2" fill="none" stroke="#a97a24" stroke-width="3" marker-end="url(#ah-gold)"/><text x="108.0" y="234.0" font-size="15" fill="#1b4a63" text-anchor="middle" font-weight="700">原動車</text><text x="108.0" y="280.0" font-size="15" fill="#14181d" text-anchor="middle">12歯</text><text x="234.0" y="234.0" font-size="15" fill="#3d434b" text-anchor="middle" font-weight="700">まん中</text><text x="234.0" y="280.0" font-size="15" fill="#14181d" text-anchor="middle">18歯</text><text x="410.4" y="234.0" font-size="15" fill="#a97a24" text-anchor="middle" font-weight="700">従動車</text><text x="410.4" y="280.0" font-size="15" fill="#14181d" text-anchor="middle">24歯</text><text x="108.0" y="392.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">60rpm</text><text x="234.0" y="392.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">40rpm</text><text x="410.4" y="392.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">30rpm</text><text x="580.0" y="128.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">歯車を3つつなぐと</text><text x="580.0" y="166.0" font-size="16" fill="#3d434b" text-anchor="start">・まん中の歯車（アイドラー）は、回る向きを変えるだけ。</text><text x="580.0" y="191.6" font-size="16" fill="#3d434b" text-anchor="start">・右はしの回転数は、両はしの歯数だけで決まる。</text><text x="580.0" y="217.2" font-size="16" fill="#3d434b" text-anchor="start">　60 × 12 ÷ 24 ＝ 30rpm（まん中の歯数を変えても同じ）</text><text x="580.0" y="242.8" font-size="16" fill="#3d434b" text-anchor="start">・1つ目と3つ目は同じ向き（時計回り）、</text><text x="580.0" y="268.4" font-size="16" fill="#3d434b" text-anchor="start">　まん中だけ反対向き（反時計回り）に回る。</text><text x="48.0" y="436.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">速度伝達比と、回る速さ・回す力の関係</text><rect x="48.0" y="452.0" width="1104.0" height="164.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="452" width="1104" height="41" rx="8" fill="#eef3f6"/><text x="173.0" y="478.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">速度伝達比</text><text x="398.0" y="478.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">従動車の回り方</text><text x="598.0" y="478.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">回す力（トルク）</text><text x="925.0" y="478.2" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">例（原動車の歯数 → 従動車の歯数）</text><line x1="48.0" y1="493.0" x2="1152.0" y2="493.0" stroke="#e2ded4" stroke-width="1"/><text x="173.0" y="519.2" font-size="16" fill="#14181d" text-anchor="middle">1より小さい（例 0.5）</text><text x="398.0" y="519.2" font-size="16" fill="#14181d" text-anchor="middle">速くなる</text><text x="598.0" y="519.2" font-size="16" fill="#14181d" text-anchor="middle">小さくなる</text><text x="925.0" y="519.2" font-size="16" fill="#14181d" text-anchor="middle">24歯 → 12歯：60rpm → 120rpm</text><rect x="49" y="534" width="1102" height="41" fill="#f7f5ef"/><line x1="48.0" y1="534.0" x2="1152.0" y2="534.0" stroke="#e2ded4" stroke-width="1"/><text x="173.0" y="560.2" font-size="16" fill="#14181d" text-anchor="middle">1（歯数が同じ）</text><text x="398.0" y="560.2" font-size="16" fill="#14181d" text-anchor="middle">同じ</text><text x="598.0" y="560.2" font-size="16" fill="#14181d" text-anchor="middle">同じ</text><text x="925.0" y="560.2" font-size="16" fill="#14181d" text-anchor="middle">24歯 → 24歯：60rpm → 60rpm</text><line x1="48.0" y1="575.0" x2="1152.0" y2="575.0" stroke="#e2ded4" stroke-width="1"/><text x="173.0" y="601.2" font-size="16" fill="#14181d" text-anchor="middle">1より大きい（例 2）</text><text x="398.0" y="601.2" font-size="16" fill="#14181d" text-anchor="middle">ゆっくりになる</text><text x="598.0" y="601.2" font-size="16" fill="#14181d" text-anchor="middle">大きくなる</text><text x="925.0" y="601.2" font-size="16" fill="#14181d" text-anchor="middle">20歯 → 40歯：60rpm → 30rpm</text><text x="48" y="650" font-size="15" fill="#6b6f76">回す力は摩擦を無視した場合。回転をゆっくりにするほど、回す力は大きくなる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>