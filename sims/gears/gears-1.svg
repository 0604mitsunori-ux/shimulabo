.3 L130.1,490.7 L139.2,467.7 L129.6,460.3 L109.7,475.1 L101.9,467.3 L116.7,447.4 L109.3,437.8 L86.3,446.9 L80.7,437.4 L100.2,422.0 L95.6,410.8 L70.9,413.6 L68.1,403.0 L90.8,393.2 L89.3,381.1 L64.7,377.5 L64.7,366.5 L89.3,362.9 L90.8,350.8 L68.1,341.0 L70.9,330.4 L95.6,333.2 L100.2,322.0 L80.7,306.6 L86.3,297.1 L109.3,306.2 L116.7,296.6 L101.9,276.7 L109.7,268.9 L129.6,283.7 L139.2,276.3 L130.1,253.3 L139.6,247.7 L155.0,267.2 L166.2,262.6 L163.4,237.9 L174.0,235.1 L183.8,257.8 L195.9,256.3 L199.5,231.7 L210.5,231.7 L214.1,256.3 L226.2,257.8 L236.0,235.1 L246.6,237.9 L243.8,262.6 L255.0,267.2 L270.4,247.7 L279.9,253.3 L270.8,276.3 L280.4,283.7 L300.3,268.9 L308.1,276.7 L293.3,296.6 L300.7,306.2 L323.7,297.1 L329.3,306.6 L309.8,322.0 L314.4,333.2 L339.1,330.4 L341.9,341.0 L319.2,350.8Z" fill="#eef3f6" stroke="#2c6b86" stroke-width="2" stroke-linejoin="round"/><circle cx="205.0" cy="372.0" r="15.6" fill="#faf8f3" stroke="#2c6b86" stroke-width="2"/><path d="M352.5,392.9 L328.1,397.2 L325.1,385.8 L348.4,377.4 L348.4,366.6 L325.1,358.2 L328.1,346.8 L352.5,351.1 L357.9,341.8 L341.9,322.9 L350.3,314.5 L369.2,330.5 L378.5,325.1 L374.2,300.7 L385.6,297.7 L394.0,321.0 L404.8,321.0 L413.2,297.7 L424.6,300.7 L420.3,325.1 L429.6,330.5 L448.5,314.5 L456.9,322.9 L440.9,341.8 L446.3,351.1 L470.7,346.8 L473.7,358.2 L450.4,366.6 L450.4,377.4 L473.7,385.8 L470.7,397.2 L446.3,392.9 L440.9,402.2 L456.9,421.1 L448.5,429.5 L429.6,413.5 L420.3,418.9 L424.6,443.3 L413.2,446.3 L404.8,423.0 L394.0,423.0 L385.6,446.3 L374.2,443.3 L378.5,418.9 L369.2,413.5 L350.3,429.5 L341.9,421.1 L357.9,402.2Z" fill="#f6eedc" stroke="#a97a24" stroke-width="2" stroke-linejoin="round"/><circle cx="399.4" cy="372.0" r="7.8" fill="#faf8f3" stroke="#a97a24" stroke-width="2"/><path d="M54.3,317.1 A160.40000000000003,160.40000000000003 0 0 1 259.9,221.3" fill="none" stroke="#2c6b86" stroke-width="3" marker-end="url(#ah-teal)"/><path d="M482.2,324.2 A95.60000000000001,95.60000000000001 0 0 0 337.9,298.8" fill="none" stroke="#a97a24" stroke-width="3" marker-end="url(#ah-gold)"/><text x="205.0" y="177.6" font-size="18" fill="#1b4a63" text-anchor="middle" font-weight="700">原動車（回す側）</text><text x="205.0" y="201.6" font-size="16" fill="#14181d" text-anchor="middle">24歯・時計回り</text><text x="419.4" y="242.4" font-size="18" fill="#a97a24" text-anchor="middle" font-weight="700">従動車（回される側）</text><text x="419.4" y="266.4" font-size="16" fill="#14181d" text-anchor="middle">12歯・反時計回り</text><text x="205.0" y="424.0" font-size="22" fill="#1b4a63" text-anchor="middle" font-weight="700">60rpm</text><text x="399.4" y="406.0" font-size="17" fill="#a97a24" text-anchor="middle" font-weight="700">120rpm</text><line x1="334.6" y1="390.0" x2="374.6" y2="522.0" stroke="#6b6f76" stroke-width="1.4" stroke-dasharray="4 4"/><text x="378.6" y="528.0" font-size="15" fill="#3d434b" text-anchor="start">かみ合う所では、</text><text x="378.6" y="551.2" font-size="15" fill="#3d434b" text-anchor="start">両方の歯が同じ数ずつ進む</text><rect x="640.0" y="112.0" width="512.0" height="112.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="668.0" cy="146.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="668.0" y="151.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="692.0" y="152.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">回る向き</text><text x="692.0" y="186.0" font-size="16" fill="#3d434b" text-anchor="start">かみ合う歯車は、たがいに反対向きに回る。</text><text x="692.0" y="210.0" font-size="15" fill="#6b6f76" text-anchor="start">（3つつなぐと、3つ目は1つ目と同じ向き）</text><rect x="640.0" y="238.0" width="512.0" height="112.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="668.0" cy="272.0" r="12.8" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="668.0" y="277.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="692.0" y="278.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">回転数は、歯数の逆の比</text><text x="692.0" y="312.0" font-size="16" fill="#3d434b" text-anchor="start">原動車が1回転＝24歯ぶん進む</text><text x="692.0" y="336.0" font-size="16" fill="#3d434b" text-anchor="start">→ 12歯の従動車は 24÷12＝2回転</text><rect x="640.0" y="364.0" width="512.0" height="232.0" rx="10" fill="#f6eedc" stroke="#a97a24" stroke-width="1.4"/><circle cx="668.0" cy="398.0" r="12.8" fill="#a97a24" stroke="#a97a24" stroke-width="0"/><text x="668.0" y="403.4" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="692.0" y="404.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">計算のしかた（中学校 技術）</text><text x="664.0" y="440.0" font-size="16.5" fill="#14181d" text-anchor="start">速度伝達比 ＝ 従動車の歯数 ÷ 原動車の歯数</text><text x="664.0" y="464.8" font-size="16.5" fill="#14181d" text-anchor="start">　　　　　 ＝ 原動車の回転数 ÷ 従動車の回転数</text><text x="664.0" y="502.0" font-size="16.5" fill="#14181d" text-anchor="start">従動車の回転数</text><text x="664.0" y="526.8" font-size="16.5" fill="#14181d" text-anchor="start">＝ 原動車の回転数 × 原動車の歯数 ÷ 従動車の歯数</text><text x="664.0" y="572.0" font-size="17" fill="#c4442b" text-anchor="start" font-weight="700">例：60 × 24 ÷ 12 ＝ 120rpm（速度伝達比 12÷24＝0.5）</text><text x="48" y="650" font-size="15" fill="#6b6f76">rpm＝1分間に回る回数。歯数が半分の歯車は2倍の速さで、反対向きに回る。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>