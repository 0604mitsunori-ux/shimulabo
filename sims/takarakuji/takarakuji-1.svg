<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">宝くじの還元率と期待値のしくみ</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="60.0" y="128.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">買ったお金のゆくえ（還元率 約47%）</text><rect x="60" y="148" width="235.0" height="66" rx="8" fill="#2c6b86"/><rect x="295.0" y="148" width="265.0" height="66" rx="8" fill="#cfc9bb"/><text x="177.5" y="176.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">当せん金として</text><text x="177.5" y="202.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">戻る 47%</text><text x="427.5" y="176.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">戻らない</text><text x="427.5" y="202.0" font-size="18" fill="#14181d" text-anchor="middle" font-weight="700">53%</text><text x="560.0" y="240.0" font-size="15" fill="#6b6f76" text-anchor="end">（経費や、発売元の自治体の収益金など）</text><text x="60.0" y="290.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">1回3,000円買うと…</text><rect x="60.0" y="304.0" width="240.0" height="94.0" rx="10" fill="#eef3f6" stroke="#2c6b86" stroke-width="1.4"/><text x="180.0" y="336.0" font-size="15" fill="#1b4a63" text-anchor="middle" font-weight="700">平均して戻る（期待値）</text><text x="180.0" y="378.0" font-size="28" fill="#2c6b86" text-anchor="middle" font-weight="700">1,410円</text><rect x="320.0" y="304.0" width="240.0" height="94.0" rx="10" fill="#fbeae6" stroke="#c4442b" stroke-width="1.4"/><text x="440.0" y="336.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">期待値で戻らない</text><text x="440.0" y="378.0" font-size="28" fill="#c4442b" text-anchor="middle" font-weight="700">1,590円</text><rect x="60.0" y="424.0" width="500.0" height="170.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><text x="80.0" y="456.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">期待値とは？</text><text x="80.0" y="488.0" font-size="16" fill="#3d434b" text-anchor="start">とても多くの人が買ったときの、1人あたりの平均の戻り。</text><text x="80.0" y="513.6" font-size="16" fill="#3d434b" text-anchor="start">実際は、ほとんどの人は期待値より少なく、</text><text x="80.0" y="539.2" font-size="16" fill="#3d434b" text-anchor="start">ごく一部の人が大きく当たる。</text><text x="80.0" y="578.0" font-size="16" fill="#c4442b" text-anchor="start" font-weight="700">長く買うほど、平均では使った額の約53%が戻らない。</text><text x="610.0" y="128.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">30年買い続けたら（年額別）</text><rect x="610.0" y="146.0" width="540.0" height="260.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="610" y="146" width="540" height="52" rx="8" fill="#eef3f6"/><text x="669.0" y="179.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">年額</text><text x="796.0" y="179.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">30年の総額</text><text x="944.0" y="179.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">期待回収（47%）</text><text x="1087.0" y="179.3" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">実質の損失</text><line x1="610.0" y1="198.0" x2="1150.0" y2="198.0" stroke="#e2ded4" stroke-width="1"/><text x="669.0" y="231.3" font-size="17" fill="#14181d" text-anchor="middle">年1万円</text><text x="796.0" y="231.3" font-size="17" fill="#14181d" text-anchor="middle">30万円</text><text x="944.0" y="231.3" font-size="17" fill="#14181d" text-anchor="middle">14.1万円</text><text x="1087.0" y="231.3" font-size="17" fill="#14181d" text-anchor="middle">15.9万円</text><rect x="611" y="250" width="538" height="52" fill="#f7f5ef"/><line x1="610.0" y1="250.0" x2="1150.0" y2="250.0" stroke="#e2ded4" stroke-width="1"/><text x="669.0" y="283.3" font-size="17" fill="#14181d" text-anchor="middle">年3万円</text><text x="796.0" y="283.3" font-size="17" fill="#14181d" text-anchor="middle">90万円</text><text x="944.0" y="283.3" font-size="17" fill="#14181d" text-anchor="middle">42.3万円</text><text x="1087.0" y="283.3" font-size="17" fill="#14181d" text-anchor="middle">47.7万円</text><line x1="610.0" y1="302.0" x2="1150.0" y2="302.0" stroke="#e2ded4" stroke-width="1"/><text x="669.0" y="335.3" font-size="17" fill="#14181d" text-anchor="middle">年6万円</text><text x="796.0" y="335.3" font-size="17" fill="#14181d" text-anchor="middle">180万円</text><text x="944.0" y="335.3" font-size="17" fill="#14181d" text-anchor="middle">84.6万円</text><text x="1087.0" y="335.3" font-size="17" fill="#14181d" text-anchor="middle">95.4万円</text><rect x="611" y="354" width="538" height="52" fill="#f7f5ef"/><line x1="610.0" y1="354.0" x2="1150.0" y2="354.0" stroke="#e2ded4" stroke-width="1"/><text x="669.0" y="387.3" font-size="17" fill="#14181d" text-anchor="middle">年12万円</text><text x="796.0" y="387.3" font-size="17" fill="#14181d" text-anchor="middle">360万円</text><text x="944.0" y="387.3" font-size="17" fill="#14181d" text-anchor="middle">169.2万円</text><text x="1087.0" y="387.3" font-size="17" fill="#14181d" text-anchor="middle">190.8万円</text><text x="610.0" y="446.0" font-size="15.5" fill="#3d434b" text-anchor="start">例：年3万円 ＝ 1回3,000円 × 年10回（シミュの初期値）</text><rect x="610.0" y="470.0" width="540.0" height="116.0" rx="10" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="630.0" y="504.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">総額 ＝ 1回の額 × 年の回数 × 年数</text><text x="630.0" y="531.2" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">期待回収 ＝ 総額 × 47%</text><text x="630.0" y="558.4" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">実質の損失 ＝ 総額 − 期待回収</text><text x="48" y="650" font-size="15" fill="#6b6f76">還元率47%はシミュで使う目安。くじの種類や回によって少しちがう。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>