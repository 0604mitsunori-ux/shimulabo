ll="#3d434b" text-anchor="start">なり、やさしくつまめる</text><text x="48" y="650" font-size="15" fill="#6b6f76">つり合うとき：左の（重さ×きょり）＝右の（重さ×きょり）。きょりと重さは反比例の関係。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>