>おもりでは作れない。</text><text x="606.0" y="122.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">身の回りのてこ（支点・力点・作用点）</text><path d="M618,140 l-9,16 h18z" fill="#14181d"/><text x="632.0" y="154.0" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">支点</text><circle cx="702.0" cy="148.0" r="8.0" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="716.0" y="154.0" font-size="15" fill="#c4442b" text-anchor="start" font-weight="700">力点（力を加える所）</text><rect x="880" y="140" width="16" height="16" fill="#2c6b86"/><text x="904.0" y="154.0" font-size="15" fill="#2c6b86" text-anchor="start" font-weight="700">作用点（物に力がはたらく所）</text><rect x="600.0" y="178.0" width="552.0" height="116.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="625.0" y="225.0" width="270.0" height="10.0" rx="4" fill="#d9d4c7" stroke="#3d434b" stroke-width="1.2"/><path d="M820,235 l-13,22 h26z" fill="#14181d"/><text x="820.0" y="280.0" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">支点</text><circle cx="640.0" cy="230.0" r="10.0" fill="#c4442b" stroke="#c4442b" stroke-width="0"/><text x="640.0" y="280.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">力点</text><rect x="871" y="221" width="18" height="18" fill="#2c6b86"/><text x="880.0" y="280.0" font-size="15" fill="#2c6b86" text-anchor="middle" font-weight="700">作用点</text><text x="918.0" y="212.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">支点が真ん中</text><text x="918.0" y="237.0" font-size="16" fill="#14181d" text-anchor="start">はさみ・くぎぬき</text><text x="918.0" y="262.0" font-size="14.5" fill="#3d434b" text-anchor="start">力点を支点から遠くすると、</text><text x="918.0" y="282.3" font-size="14.5" fill="#3d434b" text-anchor="start">小さな力で大きな力が出る</text><rect x="600.0" y="310.0" width="552.0" height="116.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="625.0" y="357.0" width="270.0" height="10.0" rx="4" fill="#d9d4c7" stroke="#3d434b