ink)"/><line x1="135.0" y1="530.0" x2="135.0" y2="536.0" stroke="#14181d" stroke-width="1.4"/><text x="135.0" y="554.0" font-size="15" fill="#3d434b" text-anchor="middle">1</text><line x1="135.0" y1="530.0" x2="135.0" y2="210.0" stroke="#e2ded4" stroke-width="1"/><line x1="205.0" y1="530.0" x2="205.0" y2="536.0" stroke="#14181d" stroke-width="1.4"/><text x="205.0" y="554.0" font-size="15" fill="#3d434b" text-anchor="middle">2</text><line x1="205.0" y1="530.0" x2="205.0" y2="210.0" stroke="#e2ded4" stroke-width="1"/><line x1="275.0" y1="530.0" x2="275.0" y2="536.0" stroke="#14181d" stroke-width="1.4"/><text x="275.0" y="554.0" font-size="15" fill="#3d434b" text-anchor="middle">3</text><line x1="275.0" y1="530.0" x2="275.0" y2="210.0" stroke="#e2ded4" stroke-width="1"/><line x1="345.0" y1="530.0" x2="345.0" y2="536.0" stroke="#14181d" stroke-width="1.4"/><text x="345.0" y="554.0" font-size="15" fill="#3d434b" text-anchor="middle">4</text><line x1="345.0" y1="530.0" x2="345.0" y2="210.0" stroke="#e2ded4" stroke-width="1"/><line x1="415.0" y1="530.0" x2="415.0" y2="536.0" stroke="#14181d" stroke-width="1.4"/><text x="415.0" y="554.0" font-size="15" fill="#3d434b" text-anchor="middle">5</text><line x1="415.0" y1="530.0" x2="415.0" y2="210.0" stroke="#e2ded4" stroke-width="1"/><line x1="485.0" y1="530.0" x2="485.0" y2="536.0" stroke="#14181d" stroke-width="1.4"/><text x="485.0" y="554.0" font-size="15" fill="#3d434b" text-anchor="middle">6</text><line x1="485.0" y1="530.0" x2="485.0" y2="210.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="530.0" x2="100.0" y2="530.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="535.0" font-size="15" fill="#3d434b" text-anchor="end">0</text><line x1="100.0" y1="530.0" x2="520.0" y2="530.0" stroke="#e2ded4" stroke-width="1"/><line x1="94.0" y1="478.0" x2="100.0" y2="478.0" stroke="#14181d" stroke-width="1.4"/><text x="90.0" y="483.0" font-size="15" fill="#3d434b" text-anchor="end">20</text><line x1="100.0" y1="478.0" x2=