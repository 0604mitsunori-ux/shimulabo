<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">星の1年の動き（年周運動）と季節の星座</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">北極の上から見た地球の公転と季節の星座</text><circle cx="280.0" cy="365.0" r="104.0" fill="none" stroke="#6b6f76" stroke-width="1.4" stroke-dasharray="5 5"/><path d="M209.5,267.9 A120,120 0 0 0 170.4,316.2" fill="none" stroke="#2c6b86" stroke-width="2.4" marker-end="url(#ah-teal)"/><text x="152.8" y="285.5" font-size="14" fill="#2c6b86" text-anchor="middle" font-weight="700">公転の向き</text><circle cx="280.0" cy="365.0" r="26.0" fill="#f4d35e" stroke="#a97a24" stroke-width="2"/><text x="280.0" y="371.0" font-size="15" fill="#7a5a10" text-anchor="middle" font-weight="700">太陽</text><circle cx="279.6" cy="469.0" r="13.0" fill="#2f4f6b" stroke="#fff" stroke-width="1.5"/><path d="M292.6,469.0 A13,13 0 0 0 266.6,469.0Z" fill="#7fb3d5"/><line x1="279.6" y1="485.0" x2="279.5" y2="517.0" stroke="#c4442b" stroke-width="2" marker-end="url(#ah-acc)"/><text x="301.6" y="475.0" font-size="15" fill="#14181d" text-anchor="start" font-weight="700">12月中ごろ</text><circle cx="279.4" cy="551.0" r="32.0" fill="#fff" stroke="#a97a24" stroke-width="1.6"/><text x="279.4" y="549.0" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">オリオン</text><text x="279.4" y="567.0" font-size="14" fill="#3d434b" text-anchor="middle">（冬）</text><circle cx="377.0" cy="402.4" r="13.0" fill="#2f4f6b" stroke="#fff" stroke-width="1.5"/><path d="M381.7,390.3 A13,13 0 0 0 372.3,414.6Z" fill="#7fb3d5"/><line x1="392.0" y1="408.2" x2="421.8" y2="419.7" stroke="#c4442b" stroke-width="2" marker-end="url(#ah-acc)"/><text x="377.0" y="380.4" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">2月下旬</text><circle cx="453.5" cy="432.0" r="32.0" fill="#fff" stroke="#a97a24" stroke-width="1.6"/><text x="453.5" y="430.0" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">しし</text><text x="453.5" y="448.0" font-size="14" fill="#3d434b" text-anchor="middle">（春）</text><circle cx="294.7" cy="262.0" r="13.0" fill="#2f4f6b" stroke="#fff" stroke-width="1.5"/><path d="M281.8,260.2 A13,13 0 0 0 307.5,263.9Z" fill="#7fb3d5"/><line x1="296.9" y1="246.2" x2="301.4" y2="214.5" stroke="#c4442b" stroke-width="2" marker-end="url(#ah-acc)"/><text x="272.9" y="268.0" font-size="15" fill="#14181d" text-anchor="end" font-weight="700">6月上旬</text><circle cx="306.2" cy="180.9" r="32.0" fill="#fff" stroke="#a97a24" stroke-width="1.6"/><text x="306.2" y="178.9" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">さそり</text><text x="306.2" y="196.9" font-size="14" fill="#3d434b" text-anchor="middle">（夏）</text><circle cx="176.0" cy="363.7" r="13.0" fill="#2f4f6b" stroke="#fff" stroke-width="1.5"/><path d="M175.8,376.7 A13,13 0 0 0 176.2,350.7Z" fill="#7fb3d5"/><line x1="160.0" y1="363.5" x2="128.0" y2="363.1" stroke="#c4442b" stroke-width="2" marker-end="url(#ah-acc)"/><text x="176.0" y="397.7" font-size="15" fill="#14181d" text-anchor="middle" font-weight="700">9月中ごろ</text><circle cx="94.0" cy="362.7" r="32.0" fill="#fff" stroke="#a97a24" stroke-width="1.6"/><text x="94.0" y="360.7" font-size="14.5" fill="#14181d" text-anchor="middle" font-weight="700">ペガスス</text><text x="94.0" y="378.7" font-size="14" fill="#3d434b" text-anchor="middle">（秋）</text><text x="48.0" y="610.0" font-size="14" fill="#6b6f76" text-anchor="start">赤い矢印＝真夜中に南に見える向き。大きさ・きょりは実際とちがう。</text><text x="572.0" y="128.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">動き方のまとめ</text><rect x="572.0" y="144.0" width="580.0" height="132.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="572" y="144" width="580" height="44" rx="8" fill="#eef3f6"/><text x="634.0" y="172.2" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700"></text><text x="856.0" y="172.2" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">動き方</text><text x="1084.0" y="172.2" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">原因</text><line x1="572.0" y1="188.0" x2="1152.0" y2="188.0" stroke="#e2ded4" stroke-width="1"/><text x="634.0" y="216.2" font-size="15.5" fill="#14181d" text-anchor="middle">日周運動</text><text x="856.0" y="216.2" font-size="15.5" fill="#14181d" text-anchor="middle">1時間に約15°、東から西へ</text><text x="1084.0" y="216.2" font-size="15.5" fill="#14181d" text-anchor="middle">地球の自転</text><rect x="573" y="232" width="578" height="44" fill="#f7f5ef"/><line x1="572.0" y1="232.0" x2="1152.0" y2="232.0" stroke="#e2ded4" stroke-width="1"/><text x="634.0" y="260.2" font-size="15.5" fill="#14181d" text-anchor="middle">年周運動</text><text x="856.0" y="260.2" font-size="15.5" fill="#14181d" text-anchor="middle">同じ時刻で1か月に約30°、東から西へ</text><text x="1084.0" y="260.2" font-size="15.5" fill="#14181d" text-anchor="middle">地球の公転</text><text x="572.0" y="300.0" font-size="15" fill="#14181d" text-anchor="start">・南中する時刻は1日に約4分、1か月で約2時間早くなる。</text><text x="572.0" y="322.5" font-size="15" fill="#14181d" text-anchor="start">　例：1月15日22時に南中した星は、2月15日には20時ごろ南中。</text><text x="572.0" y="345.0" font-size="15" fill="#14181d" text-anchor="start">・北極星はほとんど動かない（高度＝その土地の緯度）。</text><text x="572.0" y="384.0" font-size="18" fill="#14181d" text-anchor="start" font-weight="700">季節の星座（夜9時ごろの南の空）</text><rect x="572.0" y="400.0" width="580.0" height="200.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="572" y="400" width="580" height="40" rx="8" fill="#eef3f6"/><text x="647.0" y="425.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">季節</text><text x="937.0" y="425.6" font-size="15.5" fill="#14181d" text-anchor="middle" font-weight="700">南の空の主な星座</text><line x1="572.0" y1="440.0" x2="1152.0" y2="440.0" stroke="#e2ded4" stroke-width="1"/><text x="647.0" y="465.6" font-size="15.5" fill="#14181d" text-anchor="middle">春（4〜5月）</text><text x="937.0" y="465.6" font-size="15.5" fill="#14181d" text-anchor="middle">しし座・おとめ座・うしかい座</text><rect x="573" y="480" width="578" height="40" fill="#f7f5ef"/><line x1="572.0" y1="480.0" x2="1152.0" y2="480.0" stroke="#e2ded4" stroke-width="1"/><text x="647.0" y="505.6" font-size="15.5" fill="#14181d" text-anchor="middle">夏（7〜8月）</text><text x="937.0" y="505.6" font-size="15.5" fill="#14181d" text-anchor="middle">さそり座・いて座・わし座</text><line x1="572.0" y1="520.0" x2="1152.0" y2="520.0" stroke="#e2ded4" stroke-width="1"/><text x="647.0" y="545.6" font-size="15.5" fill="#14181d" text-anchor="middle">秋（10〜11月）</text><text x="937.0" y="545.6" font-size="15.5" fill="#14181d" text-anchor="middle">ペガスス座・アンドロメダ座</text><rect x="573" y="560" width="578" height="40" fill="#f7f5ef"/><line x1="572.0" y1="560.0" x2="1152.0" y2="560.0" stroke="#e2ded4" stroke-width="1"/><text x="647.0" y="585.6" font-size="15.5" fill="#14181d" text-anchor="middle">冬（1〜2月）</text><text x="937.0" y="585.6" font-size="15.5" fill="#14181d" text-anchor="middle">オリオン座・おうし座・おおいぬ座</text><text x="572.0" y="616.0" font-size="14.5" fill="#3d434b" text-anchor="start">太陽と同じ方向にある星座は、昼の空にあるので見えない。</text><text x="48" y="650" font-size="15" fill="#6b6f76">地球が1年で太陽のまわりを1周するので、同じ時刻に見える星は1か月に約30°ずつ西へずれる。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>