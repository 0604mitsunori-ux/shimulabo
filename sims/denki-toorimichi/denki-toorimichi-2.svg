" fill="#3d434b" text-anchor="start">空きかんは、ぬってある所をけずると電気を通す。</text><text x="48" y="650" font-size="15" fill="#6b6f76">テスター（回路にすき間を作った物）のすき間に物をはさんで、明かりがつけば電気を通す物。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>