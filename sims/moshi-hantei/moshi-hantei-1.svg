<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">模試判定のしくみ（偏差値と志望校の差で決まる）</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="48.0" y="100.0" width="1104.0" height="122.0" rx="10" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><circle cx="78.0" cy="136.0" r="14.4" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="78.0" y="142.1" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="106.0" y="143.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">偏差値を出す</text><text x="290.0" y="143.0" font-size="20" fill="#14181d" text-anchor="start" font-weight="700">偏差値 ＝ 50 ＋ 10 ×（得点 − 平均点）÷ 標準偏差</text><text x="106.0" y="195.0" font-size="18" fill="#3d434b" text-anchor="start">例）62点・平均55点・標準偏差15 → 50 ＋ 10 × 7 ÷ 15 ＝</text><text x="600.0" y="197.0" font-size="26" fill="#2c6b86" text-anchor="start" font-weight="700">偏差値 54.7</text><circle cx="78.0" cy="268.0" r="14.4" fill="#2c6b86" stroke="#2c6b86" stroke-width="0"/><text x="78.0" y="274.1" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="106.0" y="275.0" font-size="19" fill="#14181d" text-anchor="start" font-weight="700">志望校の偏差値との差で判定する（志望校が偏差値58のとき）</text><rect x="90.0" y="366" width="306.0" height="80" fill="#f2d6cf" stroke="#ffffff" stroke-width="2"/><text x="243.0" y="420.0" font-size="36" fill="#14181d" text-anchor="middle" font-weight="700">E</text><rect x="396.0" y="366" width="153.0" height="80" fill="#fbeae6" stroke="#ffffff" stroke-width="2"/><text x="472.5" y="420.0" font-size="36" fill="#14181d" text-anchor="middle" font-weight="700">D</text><rect x="549.0" y="366" width="153.0" height="80" fill="#f6eedc" stroke="#ffffff" stroke-width="2"/><text x="625.5" y="420.0" font-size="36" fill="#14181d" text-anchor="middle" font-weight="700">C</text><rect x="702.0" y="366" width="153.0" height="80" fill="#eef3f6" stroke="#ffffff" stroke-width="2"/><text x="778.5" y="420.0" font-size="36" fill="#14181d" text-anchor="middle" font-weight="700">B</text><rect x="855.0" y="366" width="255.0" height="80" fill="#d6e6ee" stroke="#ffffff" stroke-width="2"/><text x="982.5" y="420.0" font-size="36" fill="#14181d" text-anchor="middle" font-weight="700">A</text><line x1="396.0" y1="356.0" x2="396.0" y2="450.0" stroke="#14181d" stroke-width="2"/><text x="396.0" y="322.0" font-size="16" fill="#3d434b" text-anchor="middle">偏差値52</text><text x="396.0" y="348.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">差 −6</text><line x1="549.0" y1="356.0" x2="549.0" y2="450.0" stroke="#14181d" stroke-width="2"/><text x="549.0" y="322.0" font-size="16" fill="#3d434b" text-anchor="middle">偏差値55</text><text x="549.0" y="348.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">差 −3</text><line x1="702.0" y1="356.0" x2="702.0" y2="450.0" stroke="#14181d" stroke-width="2"/><text x="702.0" y="322.0" font-size="16" fill="#3d434b" text-anchor="middle">偏差値58</text><text x="702.0" y="348.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">差 0（志望校）</text><line x1="855.0" y1="356.0" x2="855.0" y2="450.0" stroke="#14181d" stroke-width="2"/><text x="855.0" y="322.0" font-size="16" fill="#3d434b" text-anchor="middle">偏差値61</text><text x="855.0" y="348.0" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">差 +3</text><text x="94.0" y="476.0" font-size="15" fill="#6b6f76" text-anchor="start">← 低い</text><text x="1106.0" y="476.0" font-size="15" fill="#6b6f76" text-anchor="end">高い →</text><line x1="532.0" y1="370.0" x2="532.0" y2="446.0" stroke="#c4442b" stroke-width="3" stroke-dasharray="5 4"/><path d="M532.0,448 l-12,24 h24z" fill="#c4442b"/><text x="532.0" y="508.0" font-size="19" fill="#c4442b" text-anchor="middle" font-weight="700">62点 → 偏差値54.7（差 −3.3）→ D判定</text><rect x="48.0" y="548.0" width="1104.0" height="58.0" rx="10" fill="#eef3f6" stroke="#eef3f6" stroke-width="1.2"/><text x="70.0" y="584.0" font-size="17" fill="#14181d" text-anchor="start" font-weight="700">判定1段階の幅は偏差値3 ＝ 標準偏差15のテストなら 4.5点ぶん（標準偏差 × 0.3 点）。62点の人は あと0.5点で C判定。</text><text x="48" y="650" font-size="15" fill="#6b6f76">このシミュは、偏差値と志望校の偏差値の差だけで A〜E を出す目安です。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>