ont-weight="700">E</text><text x="55.0" y="540.0" font-size="16" fill="#3d434b" text-anchor="start">判定の区切りと合格可能性の％は模試の会社によってちがう。</text><text x="55.0" y="600.0" font-size="16" fill="#14181d" text-anchor="start" font-weight="700">得点の目安 ＝ 平均 ＋ 標準偏差 ×（偏差値 − 50）÷ 10　例）偏差値61 → 55 ＋ 15 × 11 ÷ 10 ＝ 71.5点</text><text x="48" y="650" font-size="15" fill="#6b6f76">A判定でも油断は禁物、E判定でもあきらめる必要はない。判定は「今の位置」。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>