<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">おもりの質量・重さ・ばねののび（早見表）と、重さと質量のちがい</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><rect x="70.0" y="104.0" width="1060.0" height="320.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="70" y="104" width="1060" height="40" rx="8" fill="#eef3f6"/><text x="160.0" y="129.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">おもりの質量</text><text x="340.0" y="129.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">重さ（地球）</text><text x="555.0" y="129.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">ばねA（1Nで5cm）ののび</text><text x="805.0" y="129.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">ばねB（1Nで2.5cm）ののび</text><text x="1030.0" y="129.6" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">月面での重さ</text><line x1="70.0" y1="144.0" x2="1130.0" y2="144.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="169.6" font-size="17" fill="#14181d" text-anchor="middle">20 g</text><text x="340.0" y="169.6" font-size="17" fill="#14181d" text-anchor="middle">0.2 N</text><text x="555.0" y="169.6" font-size="17" fill="#14181d" text-anchor="middle">1.0 cm</text><text x="805.0" y="169.6" font-size="17" fill="#14181d" text-anchor="middle">0.5 cm</text><text x="1030.0" y="169.6" font-size="17" fill="#14181d" text-anchor="middle">約0.03 N</text><rect x="71" y="184" width="1058" height="40" fill="#f7f5ef"/><line x1="70.0" y1="184.0" x2="1130.0" y2="184.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="209.6" font-size="17" fill="#14181d" text-anchor="middle">40 g</text><text x="340.0" y="209.6" font-size="17" fill="#14181d" text-anchor="middle">0.4 N</text><text x="555.0" y="209.6" font-size="17" fill="#14181d" text-anchor="middle">2.0 cm</text><text x="805.0" y="209.6" font-size="17" fill="#14181d" text-anchor="middle">1.0 cm</text><text x="1030.0" y="209.6" font-size="17" fill="#14181d" text-anchor="middle">約0.07 N</text><line x1="70.0" y1="224.0" x2="1130.0" y2="224.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="249.6" font-size="17" fill="#14181d" text-anchor="middle">60 g</text><text x="340.0" y="249.6" font-size="17" fill="#14181d" text-anchor="middle">0.6 N</text><text x="555.0" y="249.6" font-size="17" fill="#14181d" text-anchor="middle">3.0 cm</text><text x="805.0" y="249.6" font-size="17" fill="#14181d" text-anchor="middle">1.5 cm</text><text x="1030.0" y="249.6" font-size="17" fill="#14181d" text-anchor="middle">約0.1 N</text><rect x="71" y="264" width="1058" height="40" fill="#f7f5ef"/><line x1="70.0" y1="264.0" x2="1130.0" y2="264.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="289.6" font-size="17" fill="#14181d" text-anchor="middle">80 g</text><text x="340.0" y="289.6" font-size="17" fill="#14181d" text-anchor="middle">0.8 N</text><text x="555.0" y="289.6" font-size="17" fill="#14181d" text-anchor="middle">4.0 cm</text><text x="805.0" y="289.6" font-size="17" fill="#14181d" text-anchor="middle">2.0 cm</text><text x="1030.0" y="289.6" font-size="17" fill="#14181d" text-anchor="middle">約0.13 N</text><line x1="70.0" y1="304.0" x2="1130.0" y2="304.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="329.6" font-size="17" fill="#14181d" text-anchor="middle">100 g</text><text x="340.0" y="329.6" font-size="17" fill="#14181d" text-anchor="middle">1 N</text><text x="555.0" y="329.6" font-size="17" fill="#14181d" text-anchor="middle">5.0 cm</text><text x="805.0" y="329.6" font-size="17" fill="#14181d" text-anchor="middle">2.5 cm</text><text x="1030.0" y="329.6" font-size="17" fill="#14181d" text-anchor="middle">約0.17 N</text><rect x="71" y="344" width="1058" height="40" fill="#f7f5ef"/><line x1="70.0" y1="344.0" x2="1130.0" y2="344.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="369.6" font-size="17" fill="#14181d" text-anchor="middle">200 g</text><text x="340.0" y="369.6" font-size="17" fill="#14181d" text-anchor="middle">2 N</text><text x="555.0" y="369.6" font-size="17" fill="#14181d" text-anchor="middle">10.0 cm</text><text x="805.0" y="369.6" font-size="17" fill="#14181d" text-anchor="middle">5.0 cm</text><text x="1030.0" y="369.6" font-size="17" fill="#14181d" text-anchor="middle">約0.33 N</text><line x1="70.0" y1="384.0" x2="1130.0" y2="384.0" stroke="#e2ded4" stroke-width="1"/><text x="160.0" y="409.6" font-size="17" fill="#14181d" text-anchor="middle">300 g</text><text x="340.0" y="409.6" font-size="17" fill="#14181d" text-anchor="middle">3 N</text><text x="555.0" y="409.6" font-size="17" 