<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic','Meiryo',sans-serif"><defs><marker id="ah-ink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#14181d"/></marker><marker id="ah-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#2c6b86"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#c4442b"/></marker><marker id="ah-gold" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#a97a24"/></marker><marker id="ah-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#6b6f76"/></marker><marker id="ah-green" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10z" fill="#3f8a5a"/></marker></defs><rect width="1200" height="675" fill="#faf8f3"/><text x="48" y="62" font-family="'Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','Yu Mincho',serif" font-size="32" font-weight="700" fill="#14181d">体細胞分裂と減数分裂のちがい</text><line x1="48" y1="82" x2="1152" y2="82" stroke="#14181d" stroke-width="1.5"/><text x="48.0" y="124.0" font-size="19" fill="#2c6b86" text-anchor="start" font-weight="700">体細胞分裂</text><text x="160.0" y="124.0" font-size="15" fill="#6b6f76" text-anchor="start">（体の細胞をふやす）</text><circle cx="130.0" cy="222.0" r="54.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2.4"/><line x1="109.0" y1="200.4" x2="109.0" y2="243.6" stroke="#c4442b" stroke-width="6"/><line x1="123.0" y1="200.4" x2="123.0" y2="243.6" stroke="#2c6b86" stroke-width="6"/><line x1="137.0" y1="208.8" x2="137.0" y2="235.2" stroke="#c4442b" stroke-width="6"/><line x1="151.0" y1="208.8" x2="151.0" y2="235.2" stroke="#2c6b86" stroke-width="6"/><text x="130.0" y="302.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">4本</text><line x1="196.0" y1="222.0" x2="276.0" y2="222.0" stroke="#2c6b86" stroke-width="2.6" marker-end="url(#ah-teal)"/><text x="236.0" y="208.0" font-size="15" fill="#2c6b86" text-anchor="middle" font-weight="700">1回</text><circle cx="350.0" cy="222.0" r="54.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2.4"/><line x1="329.0" y1="200.4" x2="329.0" y2="243.6" stroke="#c4442b" stroke-width="6"/><line x1="343.0" y1="200.4" x2="343.0" y2="243.6" stroke="#2c6b86" stroke-width="6"/><line x1="357.0" y1="208.8" x2="357.0" y2="235.2" stroke="#c4442b" stroke-width="6"/><line x1="371.0" y1="208.8" x2="371.0" y2="235.2" stroke="#2c6b86" stroke-width="6"/><text x="350.0" y="302.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">4本</text><circle cx="470.0" cy="222.0" r="54.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2.4"/><line x1="449.0" y1="200.4" x2="449.0" y2="243.6" stroke="#c4442b" stroke-width="6"/><line x1="463.0" y1="200.4" x2="463.0" y2="243.6" stroke="#2c6b86" stroke-width="6"/><line x1="477.0" y1="208.8" x2="477.0" y2="235.2" stroke="#c4442b" stroke-width="6"/><line x1="491.0" y1="208.8" x2="491.0" y2="235.2" stroke="#2c6b86" stroke-width="6"/><text x="470.0" y="302.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">4本</text><text x="410.0" y="330.0" font-size="16" fill="#2c6b86" text-anchor="middle" font-weight="700">数は変わらない</text><line x1="570.0" y1="106.0" x2="570.0" y2="330.0" stroke="#e2ded4" stroke-width="1.4"/><text x="600.0" y="124.0" font-size="19" fill="#c4442b" text-anchor="start" font-weight="700">減数分裂と受精</text><text x="744.0" y="124.0" font-size="15" fill="#6b6f76" text-anchor="start">（生殖細胞をつくる）</text><circle cx="650.0" cy="222.0" r="46.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2.4"/><line x1="630.5" y1="204.0" x2="630.5" y2="240.0" stroke="#c4442b" stroke-width="6"/><line x1="643.5" y1="204.0" x2="643.5" y2="240.0" stroke="#2c6b86" stroke-width="6"/><line x1="656.5" y1="211.0" x2="656.5" y2="233.0" stroke="#c4442b" stroke-width="6"/><line x1="669.5" y1="211.0" x2="669.5" y2="233.0" stroke="#2c6b86" stroke-width="6"/><text x="650.0" y="302.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">4本</text><line x1="704.0" y1="222.0" x2="760.0" y2="222.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="732.0" y="208.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">2回</text><circle cx="794.0" cy="192.0" r="26.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2"/><line x1="788.0" y1="175.8" x2="788.0" y2="208.2" stroke="#c4442b" stroke-width="6"/><line x1="800.0" y1="182.1" x2="800.0" y2="201.9" stroke="#2c6b86" stroke-width="6"/><circle cx="852.0" cy="192.0" r="26.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2"/><line x1="846.0" y1="175.8" x2="846.0" y2="208.2" stroke="#c4442b" stroke-width="6"/><line x1="858.0" y1="182.1" x2="858.0" y2="201.9" stroke="#2c6b86" stroke-width="6"/><circle cx="794.0" cy="254.0" r="26.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2"/><line x1="788.0" y1="237.8" x2="788.0" y2="270.2" stroke="#2c6b86" stroke-width="6"/><line x1="800.0" y1="244.1" x2="800.0" y2="263.9" stroke="#c4442b" stroke-width="6"/><circle cx="852.0" cy="254.0" r="26.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2"/><line x1="846.0" y1="237.8" x2="846.0" y2="270.2" stroke="#2c6b86" stroke-width="6"/><line x1="858.0" y1="244.1" x2="858.0" y2="263.9" stroke="#c4442b" stroke-width="6"/><text x="823.0" y="302.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">2本ずつ（半分）</text><line x1="890.0" y1="222.0" x2="1010.0" y2="222.0" stroke="#c4442b" stroke-width="2.6" marker-end="url(#ah-acc)"/><text x="950.0" y="208.0" font-size="15" fill="#c4442b" text-anchor="middle" font-weight="700">受精</text><text x="950.0" y="250.0" font-size="15" fill="#a97a24" text-anchor="middle" font-weight="700">＋精子 2本</text><circle cx="1080.0" cy="222.0" r="54.0" fill="#f2f8ec" stroke="#3f8a5a" stroke-width="2.4"/><line x1="1059.0" y1="200.4" x2="1059.0" y2="243.6" stroke="#c4442b" stroke-width="6"/><line x1="1073.0" y1="208.8" x2="1073.0" y2="235.2" stroke="#2c6b86" stroke-width="6"/><line x1="1087.0" y1="200.4" x2="1087.0" y2="243.6" stroke="#a97a24" stroke-width="6"/><line x1="1101.0" y1="208.8" x2="1101.0" y2="235.2" stroke="#a97a24" stroke-width="6"/><text x="1080.0" y="302.0" font-size="17" fill="#14181d" text-anchor="middle" font-weight="700">受精卵 4本</text><text x="1080.0" y="330.0" font-size="15" fill="#3d434b" text-anchor="middle">卵 2本＋精子 2本</text><text x="1152.0" y="124.0" font-size="15" fill="#a97a24" text-anchor="end" font-weight="700">金色＝もう一方の親から</text><rect x="48.0" y="352.0" width="1104.0" height="266.0" rx="8" fill="#ffffff" stroke="#e2ded4" stroke-width="1.2"/><rect x="48" y="352" width="1104" height="38" rx="8" fill="#eef3f6"/><text x="150.0" y="376.3" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700"></text><text x="477.0" y="376.3" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">体細胞分裂</text><text x="927.0" y="376.3" font-size="16" fill="#14181d" text-anchor="middle" font-weight="700">減数分裂</text><line x1="48.0" y1="390.0" x2="1152.0" y2="390.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="414.3" font-size="16" fill="#14181d" text-anchor="middle">何のための分裂か</text><text x="477.0" y="414.3" font-size="16" fill="#14181d" text-anchor="middle">体の細胞をふやす（成長・無性生殖）</text><text x="927.0" y="414.3" font-size="16" fill="#14181d" text-anchor="middle">生殖細胞（卵・精子）をつくる</text><rect x="49" y="428" width="1102" height="38" fill="#f7f5ef"/><line x1="48.0" y1="428.0" x2="1152.0" y2="428.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="452.3" font-size="16" fill="#14181d" text-anchor="middle">どこで起こるか</text><text x="477.0" y="452.3" font-size="16" fill="#14181d" text-anchor="middle">根やくきの先端（成長点）など体のいろいろな部分</text><text x="927.0" y="452.3" font-size="16" fill="#14181d" text-anchor="middle">動物は卵巣・精巣、植物は胚珠・やく</text><line x1="48.0" y1="466.0" x2="1152.0" y2="466.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="490.3" font-size="16" fill="#14181d" text-anchor="middle">分裂の回数</text><text x="477.0" y="490.3" font-size="16" fill="#14181d" text-anchor="middle">1回</text><text x="927.0" y="490.3" font-size="16" fill="#14181d" text-anchor="middle">続けて2回</text><rect x="49" y="504" width="1102" height="38" fill="#f7f5ef"/><line x1="48.0" y1="504.0" x2="1152.0" y2="504.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="528.3" font-size="16" fill="#14181d" text-anchor="middle">できる細胞の数</text><text x="477.0" y="528.3" font-size="16" fill="#14181d" text-anchor="middle">2つ</text><text x="927.0" y="528.3" font-size="16" fill="#14181d" text-anchor="middle">4つ</text><line x1="48.0" y1="542.0" x2="1152.0" y2="542.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="566.3" font-size="16" fill="#14181d" text-anchor="middle">染色体の数（この図）</text><text x="477.0" y="566.3" font-size="16" fill="#14181d" text-anchor="middle">4本 → 4本（変わらない）</text><text x="927.0" y="566.3" font-size="16" fill="#14181d" text-anchor="middle">4本 → 2本（半分）→ 受精で4本</text><rect x="49" y="580" width="1102" height="38" fill="#f7f5ef"/><line x1="48.0" y1="580.0" x2="1152.0" y2="580.0" stroke="#e2ded4" stroke-width="1"/><text x="150.0" y="604.3" font-size="16" fill="#14181d" text-anchor="middle">染色体の数（ヒト）</text><text x="477.0" y="604.3" font-size="16" fill="#14181d" text-anchor="middle">46本 → 46本</text><text x="927.0" y="604.3" font-size="16" fill="#14181d" text-anchor="middle">46本 → 23本 → 受精で46本</text><text x="48" y="650" font-size="15" fill="#6b6f76">受精卵の染色体は、半分が卵（母親）から、半分が精子（父親）から受けついだもの。</text><text x="1152" y="650" font-size="15" fill="#6b6f76" text-anchor="end">シミュラボ shimulabo.com</text></svg>